/* \002500\002500 base \002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500 */

*,
*::before,
*::after {
  box-sizing: border-box;
}

[hidden] {
  display: none !important;
}

:root,
body {
  background-color: var(--bg);
  color: var(--ink);
  font-family: var(--font-ui);
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
}

/* The background is three soft CSS gradient blobs \002014 violet into teal, from the
   owner's references. No image: the artifact CSP blocks every external request,
   and a data-URI photo would cost more than it is worth. Painted on a fixed
   pseudo-element rather than on `body` so it stays put while the page scrolls,
   which on iOS is far smoother than `background-attachment: fixed`. */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  /* NOT z-index: -1. A negative-z child paints at step 2 of the root stacking
     context, before in-flow block descendants' backgrounds at step 3 \002014 so
     body's own opaque background-color painted straight over this and the
     field was never once visible. z-index: 0 puts it in step 6, above body's
     background, and .app below is lifted above it in turn. */
  z-index: 0;
  pointer-events: none;
  background-color: var(--bg);
  background-image: radial-gradient(
      95% 72% at 2% -16%,
      var(--grad-violet),
      transparent 72%
    ),
    radial-gradient(90% 66% at 106% 0%, var(--grad-teal), transparent 72%),
    radial-gradient(115% 72% at 46% 118%, var(--grad-indigo), transparent 72%),
    radial-gradient(72% 58% at 90% 56%, var(--grad-bloom), transparent 70%);
}

.app {
  display: flex;
  flex-direction: column;
  min-height: 100dvh;
  max-width: var(--measure);
  margin: 0 auto;
  color: var(--ink);
  font-size: var(--t-ui);
  line-height: 1.45;
  /* `clip`, not `hidden`: `overflow-x: hidden` would make .app a scroll
     container, and the sticky tab bar would then stick to .app's own
     scrollport \002014 which never scrolls \002014 instead of to the viewport. */
  overflow-x: clip;
  /* Above the fixed gradient layer. Raising the layer to z-index 0 is what
     makes the field visible at all; this is what keeps the content over it. */
  position: relative;
  z-index: 1;
}

.noscript {
  position: relative;
  z-index: 1;
}

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: -1px;
  padding: 0;
  border: 0;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}

/* \002500\002500 app bar \002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500 */

/* `apple-mobile-web-app-status-bar-style: black-translucent` puts the page
   under the clock, so the top inset is padding rather than nothing. It is 0
   everywhere else, including inside the artifact. */
.app-bar {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--sp-3);
  padding: calc(var(--sp-3) + env(safe-area-inset-top, 0px)) var(--sp-4)
    var(--sp-2);
}

.wordmark {
  font-size: var(--t-xs);
  font-weight: 600;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--ink-3);
}

/* \002500\002500 screens \002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500 */

.view {
  display: flex;
  flex-direction: column;
  gap: var(--sp-4);
  flex: 1 1 auto;
  /* Room for the sticky tab bar to float over while scrolling. */
  padding: var(--sp-2) var(--sp-4) calc(var(--sp-6) + 3rem);
}

/* The class `screen` belongs to the markup render.mjs injects, not to the
   shell containers \002014 that is why the shell uses `view`, so the two never
   fight over padding. */
.screen {
  display: flex;
  flex-direction: column;
  gap: var(--sp-4);
}

.screen h2 {
  margin: 0;
  font-size: var(--t-xl);
  font-weight: 600;
  letter-spacing: -0.015em;
  text-wrap: balance;
}

/* \002500\002500 buttons \002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500 */

/* Deliberately a bare type selector (0,0,1): every button variant below is a
   single class (0,1,0) and must be able to override this reset without an
   escalating-specificity fight. */
button {
  font-family: inherit;
  font-size: var(--t-ui);
  line-height: 1.3;
  color: inherit;
  min-height: var(--tap);
  /* Both axes: a text button is wide enough on its own, but an icon button \002014
     the theme toggle \002014 would otherwise be a 44px-tall sliver. */
  min-width: var(--tap);
  border-radius: var(--radius-sm);
  border: 1px solid var(--line-strong);
  background: var(--surface);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: background-color 0.14s ease, border-color 0.14s ease,
    transform 0.06s ease;
}

button:active {
  transform: translateY(1px);
}

@media (prefers-reduced-motion: reduce) {
  button:active {
    transform: none;
  }
}

/* THE PRIMARY ACTION IS NOT CHROME. Her words about the old one: \0000ab\00043d\000438\000436\00043d\00044f\00044f
   \00043f\00043b\000430\000448\00043a\000430-\00043f\000430\00043d\000435\00043b\00044c \00043f\00043e\000445\00043e\000436\000430 \00043f\00043e \000441\000442\000438\00043b\000438\000441\000442\000438\00043a\000435 \00043d\000430 \00043a\00043d\00043e\00043f\00043a\000443 \000434\000430\00043b\00044c\000448\000435. \00043a\000430\00043a \000431\000443\000434\000442\00043e \00043a\00043d\00043e\00043f\00043a\000443 \00043d\000430\000434\00043e
   \00043f\000435\000440\000435\00043f\000440\000438\000434\000443\00043c\000430\000442\00044c \000447\000442\00043e\000431\00044b \00043d\000435 \000432\00044b\000433\00043b\00044f\000434\000435\00043b\00043e \00043f\00043b\00043e\000445\00043e\0000bb \002014 and she was right, because it was
   built out of the same three ingredients as the tab bar: a pill, a translucent
   fill and a backdrop blur. Two objects of the same material sitting 8px apart,
   one of which she presses twenty times a session and the other three times.

   So the two now part on every axis a glance takes in. The bar stays glass: a
   frosted pill, segmented, small type, see-through. The button becomes the one
   solid object on the screen \002014 a slab at the card's own corner radius, opaque,
   graded across its face, 52px tall against the bar's 44px tabs, and it casts a
   shadow instead of being lit from behind.

   The grade is the design's standing device rather than a flat fill: --accent-ink
   into --accent and back, so the colour enters from the leading edge and falls
   off. Both ends are safe to read on \002014 --on-accent measures 8.99 on --accent and
   10.85 on --accent-ink in the light theme, 11.34 and 8.15 in the dark \002014 so
   unlike the old 86% fill there is no part of this button where the label sits
   at 4.89 over whatever the background field happens to be doing. */
.btn-primary,
.check {
  min-height: calc(var(--tap) + var(--sp-2));
  background-color: var(--accent);
  background-image: linear-gradient(
    103deg,
    var(--accent-ink) 0%,
    var(--accent) 46%,
    var(--accent-ink) 100%
  );
  border-color: transparent;
  color: var(--on-accent);
  font-weight: 600;
  letter-spacing: 0.01em;
  border-radius: var(--radius-sm);
  box-shadow: var(--shadow);
}

.btn-primary {
  padding: 0 var(--sp-5);
}

.check {
  width: 100%;
}

/* \002500\002500 session: filter and topic picker \002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500 */

.session-top {
  display: flex;
  flex-direction: column;
  gap: var(--sp-3);
}

/* The two controls she asked to have together in the top right. */
.controls {
  display: flex;
  align-items: stretch;
  gap: var(--sp-2);
}

/* .filter carries width: 100% for the case where it stands alone; inside the
   cluster it is the element that flexes and the toggle is the fixed one. */
.controls .filter {
  width: auto;
  flex: 1 1 auto;
  min-width: 0;
}

.theme-toggle {
  flex: 0 0 auto;
  width: var(--tap);
  padding: 0;
  border-radius: var(--radius-pill);
}

.theme-icon {
  display: block;
  font-size: 1.25rem;
  line-height: 1;
  color: var(--accent-ink);
}

/* Pressed means dark, and the glyph is a half-filled circle: rotating it shows
   the other half. A state difference, not an animation \002014 there is no
   transition on it, and the page still has exactly one animated moment.

   `background-color`, NOT the `background` shorthand. The shorthand resets
   every background longhand it does not mention, `background-image` included,
   and this rule is 0-2-0 against the 0-1-0 that gives the disc its highlight
   further down. Pressed means dark and dark is now the default, so the
   shorthand was erasing that highlight on exactly the screen she opens \002014 the
   very thing her point 7 was about, fixed everywhere except where she would
   see it. */
.theme-toggle[aria-pressed="true"] {
  background-color: var(--accent-soft);
  border-color: var(--accent-line);
}

.theme-toggle[aria-pressed="true"] .theme-icon {
  transform: rotate(180deg);
}

.filter {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  width: 100%;
  padding: 0 var(--sp-4);
  text-align: left;
  border-radius: var(--radius-pill);
}

.filter-label {
  font-size: var(--t-sm);
  color: var(--ink-3);
}

.filter-summary {
  font-weight: 600;
  color: var(--accent-ink);
  overflow-wrap: anywhere;
}

.filter[aria-expanded="true"] {
  background: var(--accent-soft);
  border-color: var(--accent-line);
}

.picker {
  display: flex;
  flex-direction: column;
  gap: var(--sp-4);
  padding: var(--sp-3);
  border-radius: var(--radius);
}

.deck {
  display: flex;
  flex-direction: column;
  gap: var(--sp-2);
}

/* Inside the frosted picker, so transparent rather than frosted again \002014
   stacking backdrop-filters muddies the blur and costs a layer each. */
.preset {
  align-self: flex-start;
  padding: 0 var(--sp-4);
  font-size: var(--t-sm);
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--ink-2);
  background: transparent;
  border-color: var(--line);
  border-radius: var(--radius-pill);
}

.preset[aria-pressed="true"] {
  color: var(--accent-ink);
  background: var(--accent-soft);
  border-color: var(--accent-line);
}

.topic-list {
  display: flex;
  flex-direction: column;
  gap: var(--sp-1);
  margin: 0;
  padding: 0;
  list-style: none;
}

.topic-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--sp-3);
  width: 100%;
  padding: var(--sp-2) var(--sp-3);
  text-align: left;
  background: transparent;
  border-color: transparent;
  border-radius: var(--radius-sm);
}

.topic-row[aria-pressed="true"] {
  background: var(--accent-soft);
  border-color: var(--accent-line);
}

.topic-title {
  min-width: 0;
  overflow-wrap: anywhere;
}

.topic-row[aria-pressed="true"] .topic-title {
  font-weight: 600;
  color: var(--accent-ink);
}

.topic-counts {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 2px;
  flex: 0 0 auto;
  font-size: var(--t-xs);
  color: var(--ink-3);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.topic-due {
  color: var(--accent);
  font-weight: 600;
}

/* \002500\002500 session meter \002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500 */

.session-meter {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  padding: 0 var(--sp-1);
}

/* THE EMPTY TRACK HAS TO BE A TRACK. Her first note of the afternoon was that
   this is barely there in the light theme, and at 0/20 \002014 where every session
   starts \002014 there was nothing to see at all: the fill is zero wide and the track
   was --line, which measures 1.18:1 against the page in light and 1.53:1 in
   dark. Invisible is the right word for it.

   The extent is what 1.4.11 asks for here, so the extent is what gets the
   contrast: a hairline groove in --line-strong, 3.04:1 light and 4.02:1 dark
   against the ground. The interior stays --line, which keeps the pair that
   actually encodes the value \002014 fill against track \002014 at 7.92:1 and 4.14:1. A
   solid --line-strong track would have read better empty and then collapsed to
   1.58:1 against the fill in the dark theme, which is the number that matters.

   Drawn as an inset shadow rather than a border so the track keeps its 6px and
   the fill still starts flush at the left edge. Children paint over an inset
   shadow, so the filled part covers the groove and the empty part keeps it. */
.session-meter-track {
  flex: 1 1 auto;
  height: 6px;
  border-radius: var(--radius-pill);
  background: var(--line);
  box-shadow: inset 0 0 0 1px var(--line-strong);
  overflow: hidden;
}

.session-meter-fill {
  height: 100%;
  width: 0;
  border-radius: var(--radius-pill);
  background: var(--accent);
  transition: width 0.24s ease;
}

.session-meter-count {
  flex: 0 0 auto;
  font-size: var(--t-xs);
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  color: var(--ink-2);
}

/* \0000ab0/20\0000bb on its own contradicts \0000ab9 \00043a\000430\000440\000442\00043e\000447\000435\00043a \000441\000435\000433\00043e\000434\00043d\00044f\0000bb on the progress screen
   after a reload \002014 the same day, two different numbers. Saying which of the two
   this one counts is the whole fix. */
.session-meter-label {
  flex: 0 0 auto;
  font-size: var(--t-xs);
  color: var(--ink-3);
}

/* \002500\002500 card \002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500 */

/* The shell is glass, so the bloom behind it shows through and the card reads
   as the same material as the chrome. What she has to read exactly is not:
   the English sentence sits in its own opaque well below, and so do the
   options and the answer field. That is the owner's constraint kept intact \002014
   glass around the text, never under it. */
.card {
  display: flex;
  flex-direction: column;
  gap: var(--sp-4);
  padding: var(--sp-5) var(--sp-4);
  background-color: var(--glass-card-solid);
  border: 1px solid var(--glass-line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}

/* THE LINE SHE READS PAST. \0000ab\00041c\00043e\000439 \000433\00043b\000430\000437 \000437\000430 \00043d\000435\000433\00043e \00043d\000435 \000446\000435\00043f\00043b\00044f\000435\000442\000441\00044f \000438 \000438\000434\000435\000442 \000432\00044b\000431\000438\000440\000430\000442\00044c \00043e\000434\000438\00043d
   \000432\000430\000440\000438\000430\00043d\000442\0000bb \002014 and on an emphasis card, where every option is grammatical, the
   line is the only thing that says which one the card wants. It was the
   quietest text on the screen: --ink-3, one size down, no shape of its own.

   It is still the second thing read, and it must stay that way \002014 the English
   sentence in the well below is what she is here for, and it is 19px of serif
   against 13px of Avenir. What changed is that the line now has a floor and a
   peak instead of one flat grey: the line at --ink-2, and inside it the one
   word that carries the instruction at full ink and 600.

   NO COLOUR, DELIBERATELY. Teal is \0000ab\000432\000435\000440\00043d\00043e\0000bb on this page and lilac is \0000ab\00043c\000438\00043c\00043e\0000bb;
   an instruction tinted with either would be answering the card. Avenir Next
   ships a real 600 for Cyrillic (its 275 and 900 carry none), so this is a
   drawn weight and not a synthesised one. */
.task {
  margin: 0;
  font-size: var(--t-sm);
  color: var(--ink-2);
  text-wrap: balance;
}

.task-key {
  font-weight: 600;
  color: var(--ink);
}

/* Every English string on the page is set in the text face. */
.sentence,
.option,
.answer,
.diff,
.example {
  font-family: var(--font-text);
}

/* The opaque well. Full ink-on-surface contrast (17.2 light, 14.5 dark)
   whatever the gradient happens to be doing behind the card. */
.card .sentence {
  margin: 0;
  padding: var(--sp-3) var(--sp-4);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  font-size: var(--t-text);
  line-height: 1.55;
  letter-spacing: -0.003em;
  overflow-wrap: break-word;
  hyphens: none;
  /* New York is variable on one axis that matters here. Its `wght` axis starts
     at 400, so there is no lighter weight to ask for \002014 but `opsz` runs 12 to
     256. CSS's default `font-optical-sizing: auto` pins it to the used font
     size, so a 19px sentence got opsz 19, the sturdiest cut the family has,
     and that is what read heavy.
     `none` was the first attempt and went too far the other way: it restores
     the font's own default of 256, the display cut, which looked elegant in a
     desktop screenshot and turned high-contrast and brittle on a real phone \002014
     Didot, not the book face she chose. 40 is roughly twice the used size, the
     traditional distance between a text cut and a subhead cut: lighter texture,
     hairlines that still hold at 375px. */
  font-variation-settings: "opsz" 40;
}

/* The blank in a choice card is drawn as a ruled space, the way a
   fill-in-the-blank is written on paper \002014 the ellipsis render.mjs emits sits
   on the rule. */
.gap {
  display: inline-block;
  min-width: 3.5em;
  margin: 0 0.12em;
  padding: 0 0.25em;
  text-align: center;
  color: var(--accent);
  /* 1px, the weight of a button border. Still --accent and not --accent-line:
     a blank in a fill-in-the-blank is a graphic that conveys information, so
     1.4.11 wants 3:1, and thinning the stroke does not relax that. --accent
     measures 10.58 light / 5.52 dark; --accent-line measured 1.99. */
  border-bottom: 1px solid var(--accent);
  line-height: 1.1;
  /* The span is emptied of its ellipsis, and an empty inline-block collapses to
     zero height \002014 which would put the rule on the baseline of nothing. */
  min-height: 1.05em;
  vertical-align: -0.12em;
}

/* \0000ab________ , still unsigned.\0000bb \002014 the blank's own 0.37em of margin and padding on
   the right is a space before the comma, and about sixty items in the bank put
   a comma, a full stop or a bracket straight after the blank. The renderer marks
   those; here the right-hand air comes off. The left keeps its own, because
   there a word really does precede the rule. */
.gap.gap-tight {
  margin-right: 0;
  padding-right: 0;
}

.options {
  display: flex;
  flex-direction: column;
  gap: var(--sp-2);
}

/* Options carry English she must read exactly, and they sit on the dense card,
   so they stay dense too. */
.option {
  padding: var(--sp-2) var(--sp-4);
  font-size: var(--t-base);
  text-align: left;
  background: var(--surface-2);
  border-color: var(--line-strong);
  overflow-wrap: anywhere;
  font-variation-settings: "opsz" 40;
}

.option:hover {
  border-color: var(--accent-line);
}

.option[aria-pressed="true"],
.option[data-picked="true"] {
  background: var(--accent-soft);
  border-color: var(--accent);
  font-weight: 600;
}

.option[disabled] {
  opacity: 0.55;
  cursor: default;
}

/* The label belongs to the field, so it is pulled back out of the card's own
   1rem gap to sit right on top of it. */
.answer-label {
  display: block;
  margin-bottom: calc(var(--sp-1) - var(--sp-4));
  font-size: var(--t-sm);
  font-weight: 600;
  color: var(--ink-2);
}

.answer {
  width: 100%;
  min-height: var(--tap);
  padding: var(--sp-2) var(--sp-4);
  /* Never below 16px: iOS Safari zooms the page on focus otherwise. */
  font-size: var(--t-base);
  color: var(--ink);
  /* Opaque, like the sentence well: she types English into this and has to
     see it. */
  background: var(--surface);
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-sm);
}

.answer:focus {
  border-color: var(--accent);
  background: var(--surface);
}

/* \002500\002500 feedback \002014 dense, never frosted \002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500 */

/* The colour is a signal, not a background. Every panel sits on the same
   neutral surface the card uses, and the accent enters as light along the top
   edge and falls off: a tinted hairline at the boundary, a faint bloom from the
   top-left corner, and the border in the accent. Two custom properties carry
   it, so the state rules below set colours and nothing else \002014 no state ever
   touches `background-color`, and the surface under the running text stays the
   card's own.

   TWO CHANNELS, TWO QUESTIONS. The bloom answers "am I being graded?"; the hue
   answers "did I get it?".

     graded    correct, typo, wrong   bloom in the field, accent edge + border
     ungraded  accepted, plain-ok     NO bloom, and a 3px rail down the leading
                                      edge instead

   Before this, `correct` and `accepted` both carried a teal bloom \002014 the two
   furthest-apart meanings in the system wearing the same clothes. Now only a
   graded panel has colour in its field at all, and the rail marks the two that
   are telling her something rather than scoring her. The rail sits inside the
   panel's 16px left padding, so no text ever crosses it, and it clears 1.4.11
   at 5.51/9.18 (teal) and 3.43/3.50 (neutral). */

/* Five panels, and each is a unique combination of three things a reader takes
   in at a glance:

     panel      big verdict word?   hue     filled?
     correct    yes                 teal    yes
     typo       yes                 teal    no
     wrong      yes                 lilac   yes
     accepted   no                  teal    yes
     plain-ok   no                  none    no

   Hue says whether she got the rule \002014 teal yes, lilac no, none means nothing is
   being graded at all. Fill says how emphatic the panel is. A big coloured
   verdict word versus a line of prose says whether it is a grade or a
   statement.

   The two that are not corrections fall out of that table: `plain-ok` and
   `accepted` are the only panels with no verdict word, and NEITHER CARRIES A
   TRACE OF LILAC. `plain-ok` \002014 her sentence was correct English that did not do
   what the card asked \002014 is the quietest of the five: dense surface, neutral
   edge, no hue anywhere. `accepted` \002014 her wording is also correct \002014 is an
   affirmation and gets the teal wash.

   The graded rules are written `[data-verdict=\002026]:not([data-note])`, which is
   0-3-0 against the note rules' 0-2-0. Graded panels never carry `data-note`,
   so the semantics are identical \002014 but the sets are now provably disjoint and
   the invariant no longer depends on the order these rules appear in. */

.feedback {
  display: flex;
  flex-direction: column;
  --panel-bloom: transparent;
  --panel-edge: var(--edge);
  --panel-rail: transparent;
  gap: var(--sp-3);
  padding: var(--sp-5) var(--sp-4);
  background-color: var(--surface);
  background-image: radial-gradient(
    105% 58% at 0% 0%,
    var(--panel-bloom),
    transparent 66%
  );
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: inset 3px 0 0 var(--panel-rail), var(--shadow);
}

@media (prefers-reduced-motion: no-preference) {
  .feedback {
    animation: feedback-in 0.18s ease-out;
  }
}

@keyframes feedback-in {
  from {
    opacity: 0;
    transform: translateY(5px);
  }
}

.feedback > * {
  margin: 0;
}

.feedback-verdict {
  font-size: var(--t-lg);
  font-weight: 700;
  letter-spacing: -0.01em;
}

.feedback-note {
  font-size: var(--t-base);
  color: var(--ink-2);
  text-wrap: pretty;
}

.feedback-expected,
.feedback-given,
.feedback-option-note {
  display: flex;
  flex-direction: column;
  gap: var(--sp-1);
}

/* \0000ab\00041f\000420\00041e \000412\000410\000428 \000412\000410\000420\000418\000410\00041d\000422:\0000bb \002014 why the option she tapped is wrong, on the flat \0000ab\00041d\000435\000432\000435\000440\00043d\00043e\0000bb
   and nowhere else.

   THREE KINDS OF PROSE NOW SHARE THIS PANEL and no two of them can be told
   apart by size: this note is about the answer she gave, .feedback-explanation
   is about the rule, .feedback-plain-note is about the rule's other variant.
   So none of them is distinguished by size. Each is distinguished by what it
   hangs from \002014 this one from a label of exactly the kind the sentence lines
   already carry, the explanation from the rule above it, the plain note from
   sitting tight against the explanation.

   Which is also why this is not a fourth typographic invention: it is the
   .feedback-expected block, label over line, with prose on the line instead of
   a sentence. A panel that answers her mistake should not look like a panel
   that has grown a new section. It is set at the panel's own prose size, one
   step down from the verdict and level with \0000ab\00042d\000442\00043e \00043d\000435 \00043e\000448\000438\000431\00043a\000430\002026\0000bb, because it is the
   same kind of remark: something said about the answer she just gave. */
.feedback-option-note {
  font-size: var(--t-base);
  color: var(--ink-2);
  text-wrap: pretty;
}

/* What she wrote, printed above what the card holds. Same shape as the expected
   block and deliberately quieter inside it: the sentence to learn is the one
   below, and two sentences in the same ink would make her find out which is
   which by reading both. --ink-3 on the panel is 5.92 light / 8.34 dark, so
   quieter is not fainter than AA. */
.feedback-given .sentence {
  color: var(--ink-3);
}

.feedback-label {
  font-size: var(--t-xs);
  font-weight: 600;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--ink-3);
}

/* On the diff path the label is a block <p> directly above the diff; elsewhere
   it is a span inside .feedback-expected. The rule above works for both. This
   one applies only to the block path, so the label sits on its diff rather
   than floating a full gap above it. */
p.feedback-label + .diff {
  margin-top: calc(var(--sp-1) - var(--sp-3));
}

/* THE OPTICAL SIZE, SETTLED. `.card .sentence` and `.option` ask for opsz 40
   because they are set at 19px and 16px on a glass card and New York's own
   default at that size is its sturdiest cut, which is what read heavy. This
   sentence and the typed answer stay on `auto`, deliberately: at 16px on a
   dense opaque panel, opsz 40 is two and a half times the used size, and the
   hairlines that make the card's line elegant at 19px go brittle here \002014 this is
   the line that carries the correction, and it is read once, quickly, next to a
   diff. Different job, different cut. Nothing to change; this is the answer. */
.feedback .sentence {
  font-size: var(--t-base);
  line-height: 1.5;
  overflow-wrap: break-word;
}

.feedback-explanation {
  padding-top: var(--sp-3);
  border-top: 1px solid var(--line);
  font-size: var(--t-sm);
  color: var(--ink-2);
}

/* \0000ab\00041e\000431\000430 \000432\000430\000440\000438\000430\00043d\000442\000430 \000433\000440\000430\00043c\00043c\000430\000442\000438\000447\00043d\00044b.\0000bb \002014 the rule's own reassurance, printed after the
   explanation on every panel where it is true of the card in front of her: the
   correct, typo, accepted and plain-ok shapes, a thousand-odd panels between
   them, and withheld from a flat \0000ab\00041d\000435\000432\000435\000440\00043d\00043e\0000bb and from a forced item.

   It continues the explanation, so it is set exactly like it and pulled up
   against it \002014 same size, same ink, one line's air rather than the panel's full
   gap, no second rule above it. Left to inherit it would have come out at the
   panel's base size in full-strength ink, louder than the paragraph it
   qualifies.

   AND IT IS NOT TEAL. On a \0000ab\000412\000435\000440\00043d\00043e\0000bb panel teal is already saying "the English
   you wrote was right"; this sentence is about the rule, not about her answer,
   and colouring it would merge the two claims. Neutral ink is the point. */
.feedback-plain-note {
  margin-top: calc(var(--sp-1) - var(--sp-3));
  font-size: var(--t-sm);
  color: var(--ink-2);
  text-wrap: pretty;
}

/* THE RULE'S EXAMPLE IS QUOTED, NOT PRONOUNCED. On the feedback panel \002014 and
   only there \002014 the example block sits in a recessed well with a rail down its
   leading edge, the way a quotation is set inside running prose.

   It earns that on a shape nobody had seen on a phone until this round: 25
   \0000ab\000412\000435\000440\00043d\00043e\0000bb panels now end on a solitary \002717, because the \002713 half is already on the
   panel above under \0000ab\00041f\000440\000435\000434\00043b\00043e\000436\000435\00043d\000438\000435 \000446\000435\00043b\000438\00043a\00043e\00043c:\0000bb and the renderer drops the repeat.
   A lilac cross and an ungrammatical sentence as the last thing under a correct
   verdict reads as a correction of what she just wrote. Inside a quoted well,
   under its own label, it reads as what it is: the sentence the rule is about.
   The 31 emphasis panels that end on a lone \0000ab\00043e\000431\00044b\000447\00043d\00043e X\0000bb gain the same.

   THE WELL HAS NO FILL, AND THAT IS THE WHOLE POINT. The first version tinted
   it --surface-2. On a white panel that tint is 1.11:1 \002014 it carried nothing \002014
   while every mark and every word inside it lost the difference between white
   and #f2f3fb: the lilac \002717 went 5.05 \002192 4.57, the teal \002713 5.51 \002192 4.98, --ink-2
   10.01 \002192 9.05. Still AA, and still a regression of the floor this stylesheet
   is not allowed to lower, bought with a background nobody could see.
   So the box is drawn instead of filled: a hairline of --line-strong all round
   at 3.43 light / 3.50 dark, thickened to 2px on the leading edge for the rail.
   That is three times the separation the fill gave, it is identical in both
   themes, and the text inside sits on the panel it always sat on, at the
   contrast it always had.

   The rules list and the progress rows keep their bare pairs: there the example
   IS the content, and a well inside a card of nothing but examples would be a
   box around everything. */
.feedback-example {
  display: flex;
  flex-direction: column;
  gap: var(--sp-1);
  padding: var(--sp-2) var(--sp-3);
  border: 1px solid var(--line-strong);
  border-left-width: 2px;
  border-radius: var(--radius-sm);
}

/* \0000ab\00041f\000440\000438\00043c\000435\000440 \000438\000437 \00043f\000440\000430\000432\000438\00043b\000430:\0000bb \002014 a grandchild of .feedback, so the `> *` margin reset
   above does not reach it and a <p>'s own margins would open a gap the flex gap
   already provides. Set like the panel's other labels, because that is what it
   is: the line that says these two sentences belong to the rule and not to the
   answer she just gave. */
.feedback-example-label {
  margin: 0;
  font-size: var(--t-xs);
  font-weight: 600;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--ink-3);
}

/* graded \002014 0-3-0, disjoint from the note rules below by construction */
.feedback[data-verdict="correct"]:not([data-note]) {
  --panel-bloom: var(--teal-bloom);
  --panel-edge: var(--teal-edge);
  border-color: var(--teal-line);
}

.feedback[data-verdict="correct"]:not([data-note]) .feedback-verdict {
  color: var(--teal);
}

.feedback[data-verdict="typo"]:not([data-note]) {
  --panel-bloom: var(--teal-bloom);
  --panel-edge: var(--teal-edge);
  border-color: var(--teal-line);
}

.feedback[data-verdict="typo"]:not([data-note]) .feedback-verdict {
  color: var(--teal);
}

.feedback[data-verdict="wrong"]:not([data-note]) {
  --panel-bloom: var(--lilac-bloom);
  --panel-edge: var(--lilac-edge);
  border-color: var(--lilac-line);
}

.feedback[data-verdict="wrong"]:not([data-note]) .feedback-verdict {
  color: var(--lilac);
}

/* not corrections, and therefore not graded: no bloom, a rail instead */
.feedback[data-note="accepted"] {
  --panel-edge: var(--teal-edge);
  --panel-rail: var(--teal);
  border-color: var(--teal-line);
}

.feedback[data-note="accepted"] .feedback-note {
  color: var(--teal);
  font-weight: 600;
}

/* plain-ok and off-goal are the same statement arrived at from two directions:
   the English she wrote is correct, and it is not what the card asked for. One
   says it about the plain version of the rule, the other about anything else she
   typed under an emphasis rule. Neither is a rebuke and neither grades her
   English, so they wear the same quiet clothes \002014 a neutral rail, no hue in the
   field, and the verdict line in ordinary ink because the graded rules above are
   all written `:not([data-note])`. */
.feedback[data-note="plain-ok"],
.feedback[data-note="off-goal"] {
  --panel-rail: var(--line-strong);
  border-color: var(--line-strong);
}

.feedback[data-note="plain-ok"] .feedback-note,
.feedback[data-note="off-goal"] .feedback-note {
  color: var(--ink-2);
}

/* \002500\002500 diff \002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500 */

/* Unchanged words recede so the changed ones carry the line. */
.diff {
  font-size: var(--t-base);
  line-height: 1.65;
  overflow-wrap: break-word;
}

.diff-same {
  color: var(--ink-3);
}

/* The strike is drawn by a pseudo-element rather than by `text-decoration`, so
   that the one moment worth animating can sweep it across the word. It sits at
   scaleX(1) by default: with motion disabled, or before any animation runs, the
   removed word is struck through exactly as it always was. */
.diff-del {
  position: relative;
  color: var(--lilac);
}

.diff-del::after {
  content: "";
  position: absolute;
  left: -0.05em;
  right: -0.05em;
  top: 0.58em;
  height: 1.5px;
  background: currentColor;
  transform-origin: left center;
  pointer-events: none;
}

/* The inserted word is underlined as well as coloured, so the pair still reads
   as removal-and-insertion when nothing moves at all. */
.diff-add {
  /* inline-block so the settle transform applies; transforms do not affect
     non-replaced inline boxes. max-width keeps a long inserted word from
     pushing the panel sideways at 375 px. */
  display: inline-block;
  max-width: 100%;
  color: var(--teal);
  font-weight: 600;
  text-decoration: underline;
  /* currentColor, i.e. --teal. --teal-line measured 1.48 against the panel,
     which made the no-motion redundancy a fiction. */
  text-decoration-thickness: 2px;
  text-underline-offset: 3px;
}

/* A plain-ok panel keeps its diff \002014 but not the repair colouring. Struck
   through in the miss hue, her own words would say "you erred", which is the
   one thing this branch exists to avoid. Here the removed half is neutral and
   merely underlined: it marks what differs without grading it. */
.feedback[data-note="plain-ok"] .diff-del {
  color: var(--ink-3);
  text-decoration: underline dotted;
  text-decoration-thickness: 1px;
  text-underline-offset: 3px;
}

/* No strike and no insertion mark here: nothing was removed and nothing was
   put right. */
.feedback[data-note="plain-ok"] .diff-del::after {
  display: none;
}

.feedback[data-note="plain-ok"] .diff-add {
  color: var(--teal);
  font-weight: 600;
  text-decoration: none;
}

/* \002500\002500 the correction \002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500 */

/* The one moment in this product worth animating. The whole bank of 1020 cards,
   the streak and the topic filter exist to produce it: she answers, and the
   wrong span becomes the right one. Printed fully formed, that is two states
   side by side; performed, it is a substitution.

   It runs once, on the panel's appearance, in one 760ms pass with the phases
   carried by keyframe percentages rather than by three staggered delays, and
   only on the diff shape it was built for (see the gating note below):

     0-30%   the line reads as she wrote it -- the removed word in ordinary ink,
             unstruck, the inserted word not yet there;
     30-62%  the strike sweeps left to right and the word turns lilac;
     58-100% the correction settles in from above and resolves to teal.

   Layout does not move: the inserted word holds its space throughout and only
   its ink arrives, so nothing reflows mid-animation on a phone.

   THE TWO PANELS THAT ARE NOT CORRECTIONS DO NOT GET THIS. `:not([data-note])`
   excludes both: when her sentence was correct English that simply did not do
   what the card asked, and when her wording is one the card accepts, nothing is
   being fixed, so nothing may perform a fix. They still fade in with every other
   panel -- they may appear, they may not substitute. */

/* WHICH PANELS PLAY IT. render.mjs emits `data-gesture="correction"` only where
   the gesture is meant to run, and `data-diff-shape` only where a diff actually
   rendered \002014 so an absent attribute means "nothing to animate" and the static
   diff is already the correct final state.

     substitution  362 items  the full three-phase gesture. One word out, one
                              word in: the case it was designed for.
     insertion     178 items  nothing to strike, so the settle runs alone and
                              shorter. No strike is synthesised.
     deletion       91 items  a word struck and nothing arriving is a bare
                              rebuke with no repair \002014 the one tone this whole
                              design exists to avoid. Panel fades in, diff
                              static.
     complex       357 items  up to seven strikes and seven arrivals at once:
                              confetti, not a signature. Fades in, diff static.

   `typo` carries no `data-gesture` by render.mjs's choice, so a spelling slip
   never spends the product's one animated moment. Note that this is gated on
   `data-gesture` and NOT on `data-note`: `data-note` stays shorthand for "this
   panel is not a rebuke", and typo is a rebuke that simply does not earn the
   animation. `:not([data-note])` stays in the chain regardless \002014 `plain-ok` and
   `accepted` must never perform a substitution. */

@media (prefers-reduced-motion: no-preference) {
  .feedback[data-verdict]:not([data-note])[data-gesture="correction"][data-diff-shape="substitution"]
    .diff-del {
    animation: correction-mark 760ms cubic-bezier(0.2, 0.7, 0.3, 1) both;
  }

  .feedback[data-verdict]:not([data-note])[data-gesture="correction"][data-diff-shape="substitution"]
    .diff-del::after {
    animation: correction-sweep 760ms cubic-bezier(0.2, 0.7, 0.3, 1) both;
  }

  .feedback[data-verdict]:not([data-note])[data-gesture="correction"][data-diff-shape="substitution"]
    .diff-add {
    animation: correction-settle 760ms cubic-bezier(0.2, 0.7, 0.3, 1) both;
  }

  /* Nothing is struck here, so the 760ms pass would be a held beat with no
     strike in it. Same keyframes, shorter, which scales the hold down with it. */
  .feedback[data-verdict]:not([data-note])[data-gesture="correction"][data-diff-shape="insertion"]
    .diff-add {
    animation: correction-settle 480ms cubic-bezier(0.2, 0.7, 0.3, 1) both;
  }
}

@keyframes correction-mark {
  0%,
  30% {
    color: var(--ink-2);
  }
  62%,
  100% {
    color: var(--lilac);
  }
}

@keyframes correction-sweep {
  0%,
  30% {
    transform: scaleX(0);
  }
  62%,
  100% {
    transform: scaleX(1);
  }
}

@keyframes correction-settle {
  0%,
  58% {
    opacity: 0;
    transform: translateY(-0.45em);
  }
  100% {
    opacity: 1;
    transform: none;
  }
}

/* \002500\002500 logged examples (feedback panel and rules list) \002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500 */

/* THE MARK IS SOMETIMES A WORD. The pair under a plain rule is \002717 and \002713, but
   under an emphasis rule it is a contrast rather than a verdict and the marks
   are Russian words: \00043e\000431\00044b\000447\00043d\00043e (46 rules), \000432\00044b\000440\000430\000437\000438\000442\000435\00043b\00044c\00043d\000435\000435 (15), \00043e\000444\000438\000446\000438\000430\00043b\00044c\00043d\000435\000435 (12),
   \00043a\00043e\000440\00043e\000447\000435 (12), \000442\00043e\000447\00043d\000435\000435 (7). The old rule pinned the mark at `width: 1em` \002014 right
   for a glyph \002014 and `.example` sets `overflow-wrap: break-word`, which inherits.
   So each word broke inside a 12px column and came out as a vertical stack of
   letters: measured in the DOM at w=12px, h=265px for \000432\00044b\000440\000430\000437\000438\000442\000435\00043b\00044c\00043d\000435\000435, on all
   three screens that print an example and in both themes.

   `white-space: nowrap` is the fix for the stack and would be enough on its own;
   the rest is making a word-length mark read as a label rather than as a maimed
   glyph. The width is a floor, not a fixed size, so a longer word than any in
   the deck today squeezes the sentence instead of colliding with it.

   Baselines rather than boxes: the mark and the sentence are set in different
   faces at different sizes, and stretched flex items would hang them from their
   tops. */
.example {
  display: flex;
  align-items: baseline;
  gap: var(--sp-2);
  margin: 0;
  font-size: var(--t-sm);
  line-height: 1.5;
  color: var(--ink-2);
  overflow-wrap: break-word;
}

.example-mark {
  flex: 0 0 auto;
  min-width: 1em;
  font-family: var(--font-mono);
  font-size: var(--t-xs);
  line-height: 1.7;
  white-space: nowrap;
}

/* A word mark is Russian, so it is set in the Russian face \002014 the mono is right
   for \002717 and \002713 and wrong for a word. Right-aligned in a column wide enough for
   the longest of the five (\000432\00044b\000440\000430\000437\000438\000442\000435\00043b\00044c\00043d\000435\000435 measures 86px at this size, hence
   5.5rem): the words end against the sentence the way a dictionary sets its
   labels, and both sentences of a pair start on the same vertical, which is
   what makes the two readings comparable at a glance. They stay in --ink-3 and
   carry no hue \002014 these two lines are a contrast, not a right and a wrong, and
   colouring them would say otherwise. */
.example-plain .example-mark,
.example-goal .example-mark {
  min-width: 5.5rem;
  font-family: var(--font-ui);
  text-align: right;
  color: var(--ink-3);
}

.example-bad .example-mark {
  color: var(--lilac);
}

.example-good .example-mark {
  color: var(--teal);
}

/* Every list in this interface is a layout device, never a bulleted list. The
   specific rules below already say so; this is the floor, because the markup
   these screens are filled with is generated and can gain a list at any time. */
.screen ul,
.screen ol,
.picker ul {
  margin: 0;
  padding: 0;
  list-style: none;
}

/* \002500\002500 progress \002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500 */

.stats {
  display: flex;
  gap: var(--sp-3);
  margin: 0;
  padding: 0;
  list-style: none;
}

.stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
  flex: 1 1 0;
  padding: var(--sp-4);
  border-radius: var(--radius);
}

.stat-value {
  font-size: var(--t-xl);
  font-weight: 700;
  line-height: 1.1;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.02em;
}

.stat-label {
  font-size: var(--t-xs);
  color: var(--ink-3);
}

.export,
.import,
.io-apply,
.io-copy {
  align-self: flex-start;
  padding: 0 var(--sp-5);
  font-weight: 600;
  color: var(--accent-ink);
  border-radius: var(--radius-pill);
}

.category {
  display: flex;
  flex-direction: column;
  gap: var(--sp-2);
}

.category-title,
.missed-heading {
  margin: 0;
  font-size: var(--t-xs);
  font-weight: 700;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--ink-3);
}

/* \0000ab\000427\000430\000449\000435 \000432\000441\000435\000433\00043e \00043e\000448\000438\000431\000430\000435\000442\000435\000441\00044c\0000bb \002014 the one block on this screen that answers a question
   rather than listing rows, so it is a panel and the hundred rows below are not.
   Dense, like everything with sentences in it. */
.missed {
  display: flex;
  flex-direction: column;
  gap: var(--sp-2);
  padding: var(--sp-4);
  background-color: var(--surface);
  background-image: linear-gradient(157deg, var(--wash-lift) 0%, transparent 62%);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}

.missed-list {
  display: flex;
  flex-direction: column;
}

.missed-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--sp-3);
  border-top: 1px solid var(--line);
}

.missed-row:first-child {
  border-top: 0;
}

/* A real link down to the rule's own row, so it is dressed as a control:
   indigo, never the lilac a miss is written in. The whole row height is the tap
   target \002014 five of these in a column, and she is aiming with a thumb. */
.missed-rule {
  display: flex;
  align-items: center;
  flex: 1 1 auto;
  min-width: 0;
  min-height: var(--tap);
  padding: var(--sp-1) 0;
  color: var(--accent-ink);
  font-weight: 600;
  text-decoration: none;
  overflow-wrap: anywhere;
}

.missed-rule:hover {
  text-decoration: underline;
}

.missed-empty {
  margin: 0;
  font-size: var(--t-sm);
  color: var(--ink-2);
  text-wrap: pretty;
}

/* HOW IT HAS ACTUALLY GONE, IN WORDS. Both counts say what they are \002014 \0000ab\000432\000435\000440\00043d\00043e 5\0000bb,
   \0000ab\00043e\000448\000438\000431\00043e\00043a 3\0000bb \002014 so the hue is a second channel and never the only one. A zero
   drops to neutral ink: on a hundred rules she has not met yet, two coloured
   zeros in every row would paint the screen with a verdict about nothing. */
/* --sp-1 between the two counts, not --sp-2: they are one reading \002014 how this
   rule has gone \002014 and at 375px the four px buy the row its second line back.
   The summary carries the title, both counts, the meter, \0000ab\00043d\000430 \000441\000435\000433\00043e\000434\00043d\00044f\0000bb and the
   deck chips, and when the renderer's copy grew a colon the total went 3px over
   the width and wrapped the chip onto a third line, on fifty of the 110 rows. */
.rule-counts {
  display: flex;
  flex: 0 0 auto;
  gap: var(--sp-1);
  font-size: var(--t-xs);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.count {
  color: var(--ink-3);
}

.count-right {
  color: var(--teal);
}

.count-wrong {
  color: var(--lilac);
}

.rule-counts[data-right="0"] .count-right,
.rule-counts[data-wrong="0"] .count-wrong {
  color: var(--ink-3);
}

/* 110 rows. Dense, no backdrop-filter \002014 one frosted layer per row would cost
   more than the whole rest of the page. */
.rule-list {
  display: flex;
  flex-direction: column;
  gap: 1px;
  margin: 0;
  padding: 0;
  list-style: none;
  background: var(--line);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
}

/* The \0000ab\000447\000430\000449\000435 \000432\000441\000435\000433\00043e \00043e\000448\000438\000431\000430\000435\000442\000435\000441\00044c\0000bb block links down to these rows by id, so a landing
   row stops clear of the top edge rather than flush against it. */
.rule-row {
  background: var(--surface);
  scroll-margin-top: var(--sp-4);
}

/* <details> draws a disclosure triangle on its <summary>, which is the same
   marker she asked to be rid of wearing a different hat. Three engines, three
   mechanisms: `display: flex` takes the summary out of `display: list-item`,
   which handles Chrome and Firefox; `list-style: none` is the belt; and Safari
   needs its own pseudo-element switched off. */
.rule-head {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: var(--sp-2);
  min-height: var(--tap);
  padding: var(--sp-2) var(--sp-3);
  cursor: pointer;
  list-style: none;
}

.rule-head::-webkit-details-marker {
  display: none;
}

.rule-head::marker {
  content: "";
}

.rule-body {
  display: flex;
  flex-direction: column;
  gap: var(--sp-2);
  padding: 0 var(--sp-3) var(--sp-3);
}

/* MASTERY IS A QUANTITY, NOT A VERDICT. Her words about this screen were
   \0000ab\000441\00043d\00043e\000432\000430 \00043a\000440\000430\000441\00043d\00043e\000435/\000437\000435\00043b\000451\00043d\00043e\000435\0000bb, and asked to be precise she named this bar: a
   continuous teal fill, at this size, in this context, reads as a tick-mark \002014
   the traffic light the whole design bans. Teal in this product means \0000abthis is
   the correct English\0000bb, and a rule she has seen twice is not incorrect.

   Two things change and neither is a new colour. The bar becomes five pips, so
   what it shows is countable at a glance \002014 three of five, the same shape as the
   number it replaces, and a count cannot be read as a pass or a fail. And the
   filled pips take the indigo the rest of the interface uses for its own
   furniture, entering from the leading edge and falling off, so the meter says
   \0000abhow far in\0000bb in the app's own voice rather than in the language of right and
   wrong. Teal and lilac stay where they mean something: on the counts beside
   it, each with its own Russian word.

   The pips are carved out with a mask, which applies to the fill as well
   because a mask covers the element and its descendants \002014 so one declaration
   splits both layers on exactly the same grid. The arithmetic is deliberate:
   pips start at 0, 9, 18, 27 and 36 with a 7px body, against fill widths of
   8.6, 17.2, 25.8, 34.4 and 43 \002014 every level ends inside a gap, so a pip is
   never drawn half full. The 43px total is what lets the counts, the meter and
   \0000ab\00043d\000430 \000441\000435\000433\00043e\000434\00043d\00044f\0000bb share one line at 375px.

   On the contrast: the pair that encodes the value is fill against track, and
   that is 7.92 light / 4.14 dark, comfortably past 1.4.11. The track against
   the row is 1.34 and cannot be fixed \002014 no colour is 3:1 from both --surface
   and the fill in the light theme \002014 but the pips give the extent a shape, and
   the element carries `role="img"` with \0000ab\000423\000440\00043e\000432\000435\00043d\00044c 3 \000438\000437 5\0000bb besides. */
.rule-meter {
  display: inline-block;
  flex: 0 0 auto;
  --pip: 7px;
  --pip-step: 9px;
  width: calc(var(--pip-step) * 4 + var(--pip));
  height: 8px;
  border-radius: 2px;
  /* An empty pip is --line, which is 1.33 against the row \002014 the same \0000ab\000435\00043b\000435
     \000432\000438\000434\00043d\00043e\0000bb the session meter's track was, and on a fresh profile every one of
     the 110 rows is at level 0 and shows five of them. So each pip is outlined
     the way that track is: a hairline in --line-strong, 3.43 light / 3.50 dark
     against the row, with the --line interior left alone so the pair that
     carries the value stays at 7.92 / 4.14.
     Two gradients rather than an inset shadow: a shadow is drawn on the whole
     44px box and the mask below would leave only the top and bottom of each
     pip, dashes instead of boxes. These are on the same 9px period as the mask,
     so the vertical strokes land exactly on the pip edges \002014 and a filled pip
     covers its own outline, because the fill is a child and children paint
     above their parent's background. */
  background-color: var(--line);
  background-image: repeating-linear-gradient(
      90deg,
      var(--line-strong) 0 1px,
      transparent 1px calc(var(--pip) - 1px),
      var(--line-strong) calc(var(--pip) - 1px) var(--pip),
      transparent var(--pip) var(--pip-step)
    ),
    linear-gradient(
      180deg,
      var(--line-strong) 0 1px,
      transparent 1px calc(100% - 1px),
      var(--line-strong) calc(100% - 1px) 100%
    );
  overflow: hidden;
  -webkit-mask-image: repeating-linear-gradient(
    90deg,
    #000 0 var(--pip),
    transparent var(--pip) var(--pip-step)
  );
  mask-image: repeating-linear-gradient(
    90deg,
    #000 0 var(--pip),
    transparent var(--pip) var(--pip-step)
  );
}

.rule-meter-fill {
  display: block;
  height: 100%;
  width: calc(var(--level) / var(--max) * 100%);
  background-color: var(--accent);
  background-image: linear-gradient(
    90deg,
    var(--accent-ink) 0%,
    var(--accent) 100%
  );
}

/* The title takes the whole first line and everything that measures the rule
   sits under it. At 375px the five children after it come to more than the row
   is wide, and letting the title share a line with them wrapped the row to
   three. */
.rule-row .rule-title {
  flex: 1 1 100%;
  min-width: 0;
  font-size: var(--t-ui);
  overflow-wrap: anywhere;
}

/* THE \0000ab3/5\0000bb PILL GOES. It was the other half of what she saw here: a number in
   `var(--font-mono)` \002014 \0000ab\000448\000440\000438\000444\000442 \00043d\000435\00043f\00043e\00043d\00044f\000442\00043d\00044b\000439\0000bb \002014 inside a chip that turned teal as
   the level climbed, which is the green-for-good reading again in a second
   place. The meter beside it now shows the same value as five countable pips
   and carries \0000ab\000423\000440\00043e\000432\000435\00043d\00044c 3 \000438\000437 5\0000bb as its accessible name, so nothing is lost by
   the number going: not the value, not the reading, and not the label a screen
   reader announces.

   It also buys the row the width it needed. The summary now carries the title,
   two counts, the meter, \0000ab\00043d\000430 \000441\000435\000433\00043e\000434\00043d\00044f\0000bb and the deck chips; at 375px that came to
   three wrapped lines, and this is the one child of the five that repeats
   something already on the screen. Hidden rather than removed because the
   markup is another agent's file, and `display: none` takes it out of the
   accessibility tree too rather than leaving a duplicate for a screen reader to
   read out. */
.rule-level {
  display: none;
}

/* \0000ab\00043d\000430 \000441\000435\000433\00043e\000434\00043d\00044f\0000bb, in words. It replaces an unexplained dot in --accent before the
   rule's name \002014 a coloured mark that looked like a status light and said
   nothing. Dressed as the deck chips beside it, because that is what it is: a
   fact about the row, not a warning. */
.rule-due {
  flex: 0 0 auto;
  padding: 2px 8px;
  font-size: var(--t-xs);
  font-weight: 600;
  color: var(--accent-ink);
  background: var(--accent-soft);
  border: 1px solid var(--accent-line);
  border-radius: var(--radius-pill);
  white-space: nowrap;
}

.deck-chip {
  flex: 0 0 auto;
  padding: 2px 8px;
  font-size: var(--t-xs);
  color: var(--ink-3);
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: var(--radius-pill);
  white-space: nowrap;
}

.deck-chip[data-deck="tutor"] {
  color: var(--accent-ink);
  background: var(--accent-soft);
  border-color: var(--accent-line);
}

/* \002500\002500 export and restore \002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500 */

/* This is the only way her progress moves between devices, so it is a
   considered block and not a debug affordance. Dense, not glass: it holds a
   text area full of JSON she has to read, select and paste, and the rule on
   this page has been that glass goes around text and never under it.

   It opens closed and the wiring reveals its parts one at a time \002014 the label
   and field together, the apply button only in import mode, the note only when
   there is one \002014 so every child is styled to stand alone. Nothing here assumes
   a sibling is visible, and `[hidden]` already wins over the flex display. */
.io {
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: var(--sp-3);
  padding: var(--sp-4);
  background-color: var(--surface);
  background-image: linear-gradient(157deg, var(--wash-lift) 0%, transparent 62%);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}

/* \000412\00044b\000433\000440\000443\000437\000438\000442\00044c and \000417\000430\000433\000440\000443\000437\000438\000442\00044c side by side, equal halves of one row \002014 her point 2.
   Stacked, they read as two separate operations one above the other; on a row
   they read as the pair they are, and neither is the bigger one. `flex: 1 1 0`
   with a smaller inset than the standalone buttons carry, so \0000ab\000412\00044b\000433\000440\000443\000437\000438\000442\00044c\0000bb fits
   its half at 375px without shrinking the type. */
.io-buttons {
  display: flex;
  gap: var(--sp-2);
}

.io-buttons > button {
  flex: 1 1 0;
  align-self: auto;
  min-width: 0;
  padding: 0 var(--sp-3);
}

/* Each half of the block \002014 a label, its field, and the one control that acts on
   it \002014 holds together as a group, and the wiring can show either on its own. */
.io-group {
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: var(--sp-3);
}

/* The export box is for copying out of, not typing into, and it says so before
   she taps it: the recessed surface the rest of the interface uses for things
   she reads rather than fills. */
.io-text.io-out {
  background: var(--surface-2);
  color: var(--ink-2);
}

/* The label belongs to its field, so it is pulled out of the column gap the
   same way the answer field's label is. */
.io-label {
  margin-bottom: calc(var(--sp-1) - var(--sp-3));
  font-size: var(--t-sm);
  font-weight: 600;
  color: var(--ink-2);
}

.io-text {
  width: 100%;
  min-height: 9rem;
  padding: var(--sp-3);
  /* Monospace because the content is JSON. 16px because anything smaller makes
     iOS Safari zoom the page the moment she taps into it \002014 and this is a field
     she taps into specifically to paste. */
  font-family: var(--font-mono);
  font-size: var(--t-base);
  line-height: 1.5;
  color: var(--ink);
  background: var(--surface);
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-sm);
  resize: vertical;
}

.io-text:focus {
  border-color: var(--accent);
}

/* The status line carries three different messages from the wiring \002014 two
   instructions and importJSON's thrown error \002014 with nothing in the markup to
   tell them apart, so the default is a quiet status colour rather than an
   alarm that would fire on '\000421\00043a\00043e\00043f\000438\000440\000443\000439\000442\000435 \000442\000435\00043a\000441\000442 \000438 \000441\00043e\000445\000440\000430\00043d\000438\000442\000435 \000435\000433\00043e \000432 \000444\000430\000439\00043b.'.
   The error treatment is written and waiting: it needs data-state="error" on
   the element, and lilac because on this page lilac is what a miss looks like. */
.io-note {
  font-size: var(--t-sm);
  color: var(--ink-2);
  text-wrap: pretty;
}

.io-note[data-state="error"] {
  color: var(--lilac);
  font-weight: 600;
}

/* \002500\002500 rules list \002014 110 cards, dense \002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500 */

/* Four categories over 110 cards is a lot of thumb, so the screen opens with a
   row of jumps into it. Controls, therefore indigo and pill-shaped like the
   other chips she taps; 44px tall like everything else. Not sticky: it would
   have to float over the cards it sends her to, and this screen is the one
   place in the app with nothing else fixed to the top. */
.rule-jump {
  display: flex;
  flex-wrap: wrap;
  gap: var(--sp-2);
}

.rule-jump-link {
  display: inline-flex;
  align-items: center;
  min-height: var(--tap);
  padding: 0 var(--sp-4);
  font-size: var(--t-sm);
  font-weight: 600;
  color: var(--accent-ink);
  text-decoration: none;
  background: var(--accent-soft);
  border: 1px solid var(--accent-line);
  border-radius: var(--radius-pill);
}

/* The anchor lands the section's heading under the app bar rather than flush
   against the top edge of the screen. */
.category[id] {
  scroll-margin-top: var(--sp-4);
}

.rule-cards {
  display: flex;
  flex-direction: column;
  gap: var(--sp-3);
  margin: 0;
  padding: 0;
  list-style: none;
}

.rule-card {
  display: flex;
  flex-direction: column;
  gap: var(--sp-2);
  padding: var(--sp-4);
  background-color: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}

.rule-card .rule-title {
  margin: 0;
  font-size: var(--t-base);
  font-weight: 600;
  letter-spacing: -0.01em;
  text-wrap: balance;
}

.rule-explanation {
  margin: 0;
  font-size: var(--t-sm);
  color: var(--ink-2);
}

/* \002500\002500 session footer \002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500 */

/* \0000ab\000414\000430\00043b\00044c\000448\000435\0000bb IS ALWAYS REACHABLE. Measured before this rule existed, at the
   scroll position the app itself chooses after an answer: on an ordinary panel
   the button sat at 734\002013778 with the tab bar's top edge at 750, so 28px of a
   44px target were covered and a 16px sliver was tappable; on the tallest panel
   in the deck (867px, a plain-ok with a full diff) it sat at 883\002013927, which is
   71px past the bottom of the screen and not on it at all.

   The scroll that reveals a panel cannot fix this on its own \002014 it deliberately
   stops as soon as the panel's first line reaches the top, so that a panel
   taller than the screen is read from its beginning, and everything below the
   fold stays below the fold. So the button stops depending on the scroll: it
   sticks, and floats above the bar the moment its place in the flow would put
   it any lower. With room to spare it does not move at all, which keeps the
   ordinary card exactly as she designed it.

   `--bar-clear` is the bar plus the home indicator; the extra --sp-2 is the gap
   between the two objects, so the whole 52px target is always clear of both. */
.session-foot {
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: var(--sp-3);
  position: sticky;
  bottom: calc(var(--bar-clear) + var(--sp-2));
  /* Above the card and the panel it floats over, below the tab bar, which is 2. */
  z-index: 1;
}

.session-status {
  margin: 0;
  padding: var(--sp-5) var(--sp-4);
  text-align: center;
  color: var(--ink-2);
  border-radius: var(--radius);
  text-wrap: pretty;
}

/* \002500\002500 tab bar \002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500 */

.tabbar {
  position: sticky;
  bottom: calc(var(--sp-2) + env(safe-area-inset-bottom, 0px));
  z-index: 2;
  display: flex;
  gap: var(--sp-1);
  margin: auto var(--sp-3) calc(var(--sp-2) + env(safe-area-inset-bottom, 0px));
  /* From the tokens --bar-h is computed from, so the two cannot drift. The
     border width is the other half of that and has to be set after the glass
     block, whose `border` shorthand would reset it \002014 see below. */
  padding: var(--bar-pad);
  border-radius: var(--radius-pill);
}

/* Inside the frosted bar, so transparent rather than frosted again. */
.tab {
  flex: 1 1 0;
  min-height: var(--tap);
  padding: 0 var(--sp-1);
  font-size: var(--t-sm);
  font-weight: 600;
  color: var(--ink-3);
  background: transparent;
  border-color: transparent;
  border-radius: var(--radius-pill);
}

.tab[aria-current="page"] {
  color: var(--accent-ink);
  background: var(--accent-soft);
}

/* \002500\002500 the panel material \002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500 */

/* On a phone the content column is nearly the whole width, so there is no wall
   left for the glass to glow against. The light therefore lives IN the panel
   surface rather than behind it.

   Two gradients, and one rule that keeps them safe. Both move the surface AWAY
   from the colour that was measured for contrast \002014 lighter in the light theme,
   darker in the dark one \002014 so the darkest point of any gradient is exactly the
   flat value the contrast figures were computed against, and the floor holds by
   construction rather than by luck.

   `--sheen` goes on the card alone: one sweep of light across the glass. It is
   halved from where it started and its violet companion is gone, because the
   background field turned out never to have been visible \002014 with a real bloom
   behind the glass, a second light source inside it reads as muddy, and the
   violet it used to add now arrives through the glass from the field itself.
   The chrome \002014 tab bar, filter, picker, stat tiles \002014 gets none of it.

   `--wash-lift` goes on the opaque panels, where it turns the feedback panel's
   flat teal or lilac wash into a gradient of the same colour. No violet tint
   there: those washes carry meaning and must not pick up a foreign hue. */

.card {
  background-image: linear-gradient(157deg, var(--sheen) 0%, transparent 46%);
}

.rule-card {
  background-image: linear-gradient(157deg, var(--wash-lift) 0%, transparent 62%);
}

/* The bright hairline where light would catch the top edge of a panel, fading
   out as the edge wraps away. This is the detail that reads as glass rather
   than as tinted plastic, and it costs no contrast because it is one pixel of
   border, never a ground for text. */
.card,
.feedback,
.picker,
.filter,
.stat,
.session-status {
  position: relative;
}


.card::before,
.feedback::before,
.picker::before,
.filter::before,
.stat::before,
.session-status::before,
.tabbar::before {
  content: "";
  position: absolute;
  top: 1px;
  left: 14%;
  right: 14%;
  height: 1px;
  pointer-events: none;
  background: linear-gradient(
    90deg,
    transparent,
    var(--panel-edge, var(--edge)) 24%,
    var(--panel-edge, var(--edge)) 76%,
    transparent
  );
}

/* \002500\002500 the glass \002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500 */

/* Chrome only. The exercise card, the feedback panel, the 110-row progress
   list and the rules list are all absent from this list on purpose \002014 they
   carry English she has to read exactly, and a see-through ground under text
   trades legibility for decoration.

   Progressive enhancement: the default below is a near-opaque surface that is
   legible with no compositing at all, and the @supports block upgrades it to
   real glass only where backdrop-filter exists. Anything that sets its own
   background as a state \002014 .filter[aria-expanded], .preset[aria-pressed],
   .tab[aria-current] \002014 is 0-2-0 and wins over both, by specificity rather than
   by order. */
.tabbar,
.filter,
.theme-toggle,
.picker,
.stat,
.export,
.import,
.io-apply,
.session-status {
  background-color: var(--glass-solid);
  border: 1px solid var(--glass-line);
  /* The inset hairline along the top edge is what separates glass from tinted
     plastic: a lit edge where the panel catches the light behind it. */
  box-shadow: var(--glass-shadow);
}


@supports (
  (backdrop-filter: blur(2px)) or (-webkit-backdrop-filter: blur(2px))
) {
  .tabbar,
  .filter,
  .theme-toggle,
  .picker,
  .stat,
  .export,
  .import,
  .io-apply,
  .session-status {
    background-color: var(--glass);
    -webkit-backdrop-filter: var(--blur);
    backdrop-filter: var(--blur);
  }

  /* One card at a time, so this is affordable where a 110-row list is not. */
  .card {
    background-color: var(--glass-card);
    -webkit-backdrop-filter: var(--blur);
    backdrop-filter: var(--blur);
  }

  /* The primary buttons used to frost here too. They are the one solid object
     on the screen now, on purpose \002014 see the note on .btn-primary. */
}

/* THE ROUND ONE IS NOT A PANEL. Every other piece of chrome wears a straight
   hairline across its top edge, 14% in from each side, which on a rectangle is
   where the light would catch. On a 44px circle that same line is a chord: it
   crosses the disc instead of following it, and it is exactly what she saw \002014
   \0000ab\00044d\000444\000444\000435\00043a\000442 \000441\000442\000435\00043a\00043b\000430 \000443 \00043a\000440\000443\000433\00043b\00043e\000439 \00043a\00043d\00043e\00043f\00043a\000438 (\000438 \000432 \000441\000432\000435\000442\00043b\00043e\000439 \000438 \000432 \000442\000435\00043c\00043d\00043e\000439) \000432\00044b\000433\00043b\00044f\000434\000438\000442 \00043a\000430\00043a \00043f\000440\00043e\000441\000442\00043e
   \00043f\00043e\00043b\00043e\000441\000430 \000432 \000432\000435\000440\000445\00043d\000435\000439 \000447\000430\000441\000442\000438 \00043a\000440\000443\000436\00043a\000430, \00043d\000435 \000446\000435\00043b\00044c\00043d\00043e\0000bb.

   So the toggle is off the ::before list, and its light is described the way
   light lands on something round instead: one soft source from the upper left
   that falls off before the far edge, a lit rim along the top arc, and shade
   under the lower one. Both rims are inset shadows, which follow the border
   radius by definition and thin out towards the equator on their own \002014 curves
   rather than a chord \002014 and it is the pair of them, not either alone, that
   makes the disc read as one object with a near side and a far side.

   After the glass block on purpose: that block sets `box-shadow` for the whole
   chrome group, and this has to add to it rather than be overwritten. Both
   rules are 0-1-0, so this one wins by coming later.

   The source is `--dome` and not `--sheen`. `--sheen` is the sweep across the
   exercise card, and it is white at 0.025 in dark on purpose \002014 behind real
   glass with a bloom coming through, a second light source inside the card
   reads as muddy. On a 44px disc that same 0.025 is nothing at all: rendered
   beside a disc with no gradient, the two were indistinguishable, which made
   this fix true only in the light theme. `--dome` is white at 0.16 in dark,
   which lifts the brightest point of the disc by 1.65 against its own fill.
   The glyph does not pay for it: the highlight is centred at 30%/6% and is
   transparent by 68% of the ray, so by the middle of the disc the dome is down
   to about 1% alpha and the icon sits on the flat fill it always did. In light
   it stays exactly where `--sheen` was. */
.theme-toggle {
  background-image: radial-gradient(
    82% 82% at 30% 6%,
    var(--dome),
    transparent 68%
  );
  box-shadow: inset 0 1.5px 1px -0.5px var(--edge),
    inset 0 -3px 4px -3px var(--line), var(--glass-shadow);
}

/* The other half of the tab bar's geometry, down here for the same reason the
   disc's highlight is: the glass block's `border` shorthand resets border-width,
   and --bar-h \002014 the sum that keeps \0000ab\000414\000430\00043b\00044c\000448\000435\0000bb clear of this bar \002014 is computed
   from this token. Setting it after the shorthand is what makes the sum true.
   The bar's padding is up in .tabbar with the rest of its layout; only the half

      "\u0421\u0440\u0430\u0432\u043d\u0438\u0432\u0430\u0442\u044c \u043d\u0443\u0436\u043d\u043e \u0441\u043e\u043f\u043e\u0441\u0442\u0430\u0432\u0438\u043c\u044b\u0435 \u0432\u0435\u0449\u0438. \u0417\u0434\u0435\u0441\u044c \u201caudience\u201d \u0441\u0440\u0430\u0432\u043d\u0438\u0432\u0430\u0435\u0442\u0441\u044f \u0441 " +
      "\u201cfeatures\u201d \u0432\u043c\u0435\u0441\u0442\u043e \u201caudience\u201d \u2014 \u044d\u0442\u043e \u043d\u0435\u0432\u0435\u0440\u043d\u043e. \u0421\u043b\u043e\u0432\u0430 \u201cthat of\u201d \u0438 \u201cthose " +
      "of\u201d \u043f\u043e\u0437\u0432\u043e\u043b\u044f\u044e\u0442 \u043f\u043e\u0432\u0442\u043e\u0440\u0438\u0442\u044c \u0441\u0443\u0449\u0435\u0441\u0442\u0432\u0438\u0442\u0435\u043b\u044c\u043d\u043e\u0435, \u043d\u0435 \u0432\u044b\u043f\u0438\u0441\u044b\u0432\u0430\u044f \u0435\u0433\u043e \u0434\u0432\u0430\u0436\u0434\u044b. \u0412\u044b\u0431\u043e\u0440 \u043c\u0435\u0436\u0434\u0443 " +
      "\u043d\u0438\u043c\u0438 \u2014 \u0447\u0438\u0441\u0442\u043e\u0435 \u0441\u043e\u0433\u043b\u0430\u0441\u043e\u0432\u0430\u043d\u0438\u0435 \u043f\u043e \u0447\u0438\u0441\u043b\u0443, \u0438 \u0441\u0447\u0438\u0442\u0430\u0442\u044c \u043d\u0443\u0436\u043d\u043e \u043f\u043e \u0442\u043e\u043c\u0443 \u0441\u043b\u043e\u0432\u0443, \u043a\u043e\u0442\u043e\u0440\u043e\u0435 " +
      "\u043f\u043e\u0432\u0442\u043e\u0440\u044f\u0435\u0442\u0441\u044f, \u0430 \u043d\u0435 \u043f\u043e \u0442\u043e\u043c\u0443, \u0441 \u0447\u0435\u043c \u0441\u0440\u0430\u0432\u043d\u0438\u0432\u0430\u044e\u0442: \u201cthat of\u201d \u0432\u0441\u0442\u0430\u0451\u0442 \u0432\u043c\u0435\u0441\u0442\u043e " +
      "\u0435\u0434\u0438\u043d\u0441\u0442\u0432\u0435\u043d\u043d\u043e\u0433\u043e \u0447\u0438\u0441\u043b\u0430 \u0438\u043b\u0438 \u043d\u0435\u0438\u0441\u0447\u0438\u0441\u043b\u044f\u0435\u043c\u043e\u0433\u043e (\u201cthe response rate \u2026 than that of a " +
      "typical survey\u201d, \u201cher feedback \u2026 than that of the seminar group\u201d), \u201cthose " +
      "of\u201d \u2014 \u0432\u043c\u0435\u0441\u0442\u043e \u043c\u043d\u043e\u0436\u0435\u0441\u0442\u0432\u0435\u043d\u043d\u043e\u0433\u043e (\u201cthe needs of screen reader users \u2026 than those " +
      "of sighted users\u201d).",
    example: {
      wrong: "the audience of accessibility features is less than mass features",
      right: "the audience of accessibility features is smaller than that of mass features",
    },
    registers: ["work"],
    topics: ["course-comparison"],
  },
  {

      "\u0441 \u0438\u0441\u0447\u0438\u0441\u043b\u044f\u0435\u043c\u044b\u043c\u0438 \u043f\u0440\u0435\u0434\u043c\u0435\u0442\u0430\u043c\u0438 (fewer people, fewer features), \u0430 \u201csmaller\u201d \u2014 \u0441 \u0440\u0430\u0437\u043c\u0435\u0440\u043e\u043c " +
