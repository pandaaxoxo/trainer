  {
    id: "that-which",
    category: "grammar",
    title: "\u041e\u0433\u0440\u0430\u043d\u0438\u0447\u0438\u0442\u0435\u043b\u044c\u043d\u044b\u0435 \u043f\u0440\u0438\u0434\u0430\u0442\u043e\u0447\u043d\u044b\u0435: \u201cthat\u201d vs \u201cwhich\u201d",
    explanation:
      "\u0416\u0451\u0441\u0442\u043a\u043e\u0435 \u043f\u0440\u0430\u0432\u0438\u043b\u043e \u043e\u0434\u043d\u043e: \u201cthat\u201d \u043d\u0435 \u043c\u043e\u0436\u0435\u0442 \u0432\u0432\u043e\u0434\u0438\u0442\u044c \u0443\u0442\u043e\u0447\u043d\u044f\u044e\u0449\u0435\u0435 \u043f\u0440\u0438\u0434\u0430\u0442\u043e\u0447\u043d\u043e\u0435: \u0442\u043e, " +
      "\u043a\u043e\u0442\u043e\u0440\u043e\u0435 \u043e\u0442\u0434\u0435\u043b\u0435\u043d\u043e \u0437\u0430\u043f\u044f\u0442\u044b\u043c\u0438 \u0438 \u0434\u043e\u0431\u0430\u0432\u043b\u044f\u0435\u0442 \u043d\u0435\u043e\u0431\u044f\u0437\u0430\u0442\u0435\u043b\u044c\u043d\u0443\u044e \u0438\u043d\u0444\u043e\u0440\u043c\u0430\u0446\u0438\u044e. \u0422\u0430\u043c \u043d\u0443\u0436\u0435\u043d " +
      "\u201cwhich\u201d (\u043e \u043b\u044e\u0434\u044f\u0445 \u2014 \u201cwho\u201d), \u0438 \u0437\u0430\u043f\u044f\u0442\u0430\u044f \u043e\u0431\u044f\u0437\u0430\u0442\u0435\u043b\u044c\u043d\u0430. \u0412 \u043e\u0431\u0440\u0430\u0442\u043d\u0443\u044e \u0441\u0442\u043e\u0440\u043e\u043d\u0443 \u043f\u0440\u0430\u0432\u0438\u043b\u0430 \u043d\u0435\u0442: \u0432 " +
      "\u043e\u0433\u0440\u0430\u043d\u0438\u0447\u0438\u0442\u0435\u043b\u044c\u043d\u043e\u043c \u043f\u0440\u0438\u0434\u0430\u0442\u043e\u0447\u043d\u043e\u043c, \u0431\u0435\u0437 \u0437\u0430\u043f\u044f\u0442\u043e\u0439, \u0431\u0440\u0438\u0442\u0430\u043d\u0441\u043a\u0438\u0439 \u0430\u043d\u0433\u043b\u0438\u0439\u0441\u043a\u0438\u0439 \u0434\u043e\u043f\u0443\u0441\u043a\u0430\u0435\u0442 \u0438 " +
      "\u201cwhich\u201d. \u0412 \u0430\u043a\u0430\u0434\u0435\u043c\u0438\u0447\u0435\u0441\u043a\u043e\u0439 \u043f\u0440\u043e\u0437\u0435 \u201cthat\u201d \u0441\u0447\u0438\u0442\u0430\u0435\u0442\u0441\u044f \u0430\u043a\u043a\u0443\u0440\u0430\u0442\u043d\u0435\u0435, " +
      "\u0438 \u0432 \u0430\u043c\u0435\u0440\u0438\u043a\u0430\u043d\u0441\u043a\u043e\u0439 \u043d\u043e\u0440\u043c\u0435 \u043e\u043d \u0442\u0430\u043c \u043e\u0431\u044f\u0437\u0430\u0442\u0435\u043b\u0435\u043d.",
    plainNote:
      "\u0411\u0435\u0437 \u0437\u0430\u043f\u044f\u0442\u043e\u0439 \u201cwhich\u201d \u0442\u043e\u0436\u0435 \u043f\u0440\u0430\u0432\u0438\u043b\u0435\u043d: \u201cteams which work based on classical product " +
      "metrics\u201d \u2014 \u043d\u0435 \u043e\u0448\u0438\u0431\u043a\u0430.",
    example: {

      right: "The audit, which we ran last spring, changed the whole roadmap.",
    },
    registers: ["work", "everyday"],
    topics: ["course-sentence-structure"],
  },
  {
    id: "there-is-are",

    title: "\u0421\u043e\u0433\u043b\u0430\u0441\u043e\u0432\u0430\u043d\u0438\u0435 \u0432 \u043a\u043e\u043d\u0441\u0442\u0440\u0443\u043a\u0446\u0438\u0438 \u201cthere is / there are\u201d",

      "\u201cMarkers\u201d \u0441\u0442\u043e\u0438\u0442 \u0432\u043e \u043c\u043d\u043e\u0436\u0435\u0441\u0442\u0432\u0435\u043d\u043d\u043e\u043c \u0447\u0438\u0441\u043b\u0435 \u2192 \u043d\u0443\u0436\u043d\u043e \u201care\u201d. \u0420\u0443\u0441\u0441\u043a\u043e\u0435 \u00ab\u043d\u0435\u0442 [\u0447\u0435\u0433\u043e-\u043b\u0438\u0431\u043e]\u00bb \u043d\u0435 " +
      "\u043f\u0435\u0440\u0435\u0434\u0430\u0451\u0442 \u0447\u0438\u0441\u043b\u043e, \u043f\u043e\u044d\u0442\u043e\u043c\u0443 \u043d\u0430 \u044d\u0442\u043e \u043b\u0435\u0433\u043a\u043e \u043d\u0435 \u043e\u0431\u0440\u0430\u0442\u0438\u0442\u044c \u0432\u043d\u0438\u043c\u0430\u043d\u0438\u044f.",

  {

    explanation:

      "\u201cexpects\u201d. \u0421 \u201cI\u201d \u0438 \u201cyou\u201d \u044d\u0442\u043e\u0433\u043e \u043e\u043a\u043e\u043d\u0447\u0430\u043d\u0438\u044f \u043d\u0435\u0442 (\u201cI face\u201d, \u201cyou face\u201d). " +
      "\u041f\u0440\u0430\u0432\u0438\u043b\u043e \u043a\u0430\u0441\u0430\u0435\u0442\u0441\u044f \u0442\u043e\u043b\u044c\u043a\u043e 3-\u0433\u043e \u043b\u0438\u0446\u0430. \u0412 \u0440\u0443\u0441\u0441\u043a\u043e\u043c \u0442\u0430\u043a\u043e\u0433\u043e \u043e\u043a\u043e\u043d\u0447\u0430\u043d\u0438\u044f \u043d\u0435\u0442 \u0432\u043e\u0432\u0441\u0435, " +
      "\u043f\u043e\u044d\u0442\u043e\u043c\u0443 \u0435\u0433\u043e \u043b\u0435\u0433\u043a\u043e \u043f\u0440\u043e\u043f\u0443\u0441\u0442\u0438\u0442\u044c.",

  {
    id: "no-article-possessive",
    category: "grammar",
    title: "\u0411\u0435\u0437 \u0430\u0440\u0442\u0438\u043a\u043b\u044f \u043f\u0435\u0440\u0435\u0434 \u043f\u0440\u0438\u0442\u044f\u0436\u0430\u0442\u0435\u043b\u044c\u043d\u043e\u0439 \u0444\u043e\u0440\u043c\u043e\u0439 \u0438\u043b\u0438 \u0438\u043c\u0435\u043d\u0435\u043c",
    explanation:

      "\u0430\u0440\u0442\u0438\u043a\u043b\u044c \u201cthe\u201d \u043f\u0435\u0440\u0435\u0434 \u043d\u0438\u043c \u043d\u0435 \u043d\u0443\u0436\u0435\u043d: \u201cthe Ashley\u2019s point\u201d \u2192 \u201cAshley\u2019s " +
      "point\u201d. \u0422\u043e\u0442 \u0436\u0435 \u043f\u0440\u0438\u043d\u0446\u0438\u043f \u0440\u0430\u0431\u043e\u0442\u0430\u0435\u0442 \u0438 \u0441 \u0438\u043c\u0435\u043d\u0430\u043c\u0438 \u0441\u043e\u0431\u0441\u0442\u0432\u0435\u043d\u043d\u044b\u043c\u0438 \u0431\u0435\u0437 \u2019s: \u043e\u043d\u0438 \u0438 \u0442\u0430\u043a " +
      "\u043d\u0430\u0437\u044b\u0432\u0430\u044e\u0442 \u0447\u0442\u043e-\u0442\u043e \u0435\u0434\u0438\u043d\u0441\u0442\u0432\u0435\u043d\u043d\u043e\u0435 \u0432 \u0441\u0432\u043e\u0451\u043c \u0440\u043e\u0434\u0435, \u0432\u0442\u043e\u0440\u043e\u0439 \u043c\u0430\u0440\u043a\u0435\u0440 \u043a\u043e\u043d\u043a\u0440\u0435\u0442\u043d\u043e\u0441\u0442\u0438 \u0438\u043c \u043d\u0435 " +
      "\u043d\u0443\u0436\u0435\u043d. \u0418\u0441\u043a\u043b\u044e\u0447\u0435\u043d\u0438\u0439 \u0434\u0432\u0430, \u043e\u0431\u0430 \u0440\u0430\u0437\u0433\u043e\u0432\u043e\u0440\u043d\u044b\u0435. \u201cThe\u201d \u043f\u0435\u0440\u0435\u0434 \u0438\u043c\u0435\u043d\u0435\u043c \u0432\u0441\u0435\u0433\u0434\u0430 \u0442\u044f\u043d\u0435\u0442 \u0437\u0430 " +

  {

  {

  {

      "\u201cbut also\u201d, \u0432\u043a\u043b\u044e\u0447\u0430\u044f \u043f\u0440\u0435\u0434\u043b\u043e\u0433. \u0415\u0441\u043b\u0438 \u043f\u0435\u0440\u0432\u0430\u044f \u0447\u0430\u0441\u0442\u044c \u2014 \u044d\u0442\u043e \u201con + -ing\u201d, \u0432\u0442\u043e\u0440\u0430\u044f " +
      "\u0447\u0430\u0441\u0442\u044c \u0442\u043e\u0436\u0435 \u0434\u043e\u043b\u0436\u043d\u0430 \u0431\u044b\u0442\u044c \u201con + -ing\u201d. \u0412 \u0443\u0441\u0442\u043d\u043e\u0439 \u0440\u0435\u0447\u0438 \u201calso\u201d \u043c\u043e\u0436\u043d\u043e \u043e\u043f\u0443\u0441\u0442\u0438\u0442\u044c, " +
      "\u043d\u043e \u0442\u043e\u0433\u0434\u0430 \u043f\u0430\u0440\u0430\u043b\u043b\u0435\u043b\u0438\u0437\u043c \u0434\u043e\u043b\u0436\u0435\u043d \u0431\u044b\u0442\u044c \u0442\u043e\u0447\u043d\u044b\u043c.",
    example: {

  },
  {
    id: "adjective-to-verb-en",
    category: "grammar",
    title: "\u0413\u043b\u0430\u0433\u043e\u043b\u044b, \u043e\u0431\u0440\u0430\u0437\u043e\u0432\u0430\u043d\u043d\u044b\u0435 \u043e\u0442 \u043f\u0440\u0438\u043b\u0430\u0433\u0430\u0442\u0435\u043b\u044c\u043d\u044b\u0445 (-en)",
    explanation:

      "wide \u2192 widen, strong \u2192 strengthen, short \u2192 shorten, broad \u2192 broaden. \u0421\u0430\u043c\u043e \u043f\u0440\u0438\u043b\u0430\u0433\u0430\u0442\u0435\u043b\u044c\u043d\u043e\u0435 " +
      "(\u0438\u043b\u0438 \u0435\u0433\u043e \u0441\u0440\u0430\u0432\u043d\u0438\u0442\u0435\u043b\u044c\u043d\u0430\u044f \u0444\u043e\u0440\u043c\u0430) \u043d\u0435 \u043c\u043e\u0436\u0435\u0442 \u0432\u044b\u0441\u0442\u0443\u043f\u0430\u0442\u044c \u0433\u043b\u0430\u0433\u043e\u043b\u043e\u043c. \u201cTo deeper\u201d \u0447\u0438\u0442\u0430\u0435\u0442\u0441\u044f \u043a\u0430\u043a " +
      "\u0441\u0440\u0430\u0432\u043d\u0438\u0442\u0435\u043b\u044c\u043d\u0430\u044f \u0441\u0442\u0435\u043f\u0435\u043d\u044c \u0431\u0435\u0437 \u0432\u0441\u044f\u043a\u043e\u0433\u043e \u0433\u043b\u0430\u0433\u043e\u043b\u0430.",
    example: {

    },
    registers: ["work", "everyday"],
    topics: ["course-verb-forms"],
  },
  {
    id: "agreement-relative-clause",
    category: "grammar",
    title: "\u0421\u043e\u0433\u043b\u0430\u0441\u043e\u0432\u0430\u043d\u0438\u0435 \u0432\u043d\u0443\u0442\u0440\u0438 \u043f\u0440\u0438\u0434\u0430\u0442\u043e\u0447\u043d\u043e\u0433\u043e",
    explanation:
      "\u0413\u043b\u0430\u0433\u043e\u043b \u0432 \u043f\u0440\u0438\u0434\u0430\u0442\u043e\u0447\u043d\u043e\u043c \u043f\u0440\u0435\u0434\u043b\u043e\u0436\u0435\u043d\u0438\u0438 \u0441\u043e\u0433\u043b\u0430\u0441\u0443\u0435\u0442\u0441\u044f \u0441\u043e \u0441\u043b\u043e\u0432\u043e\u043c, \u043a\u043e\u0442\u043e\u0440\u043e\u0435 \u044d\u0442\u043e \u043f\u0440\u0438\u0434\u0430\u0442\u043e\u0447\u043d\u043e\u0435 " +
      "\u043e\u043f\u0438\u0441\u044b\u0432\u0430\u0435\u0442, \u0430 \u043d\u0435 \u0441 \u0431\u043b\u0438\u0436\u0430\u0439\u0448\u0438\u043c \u0441\u0443\u0449\u0435\u0441\u0442\u0432\u0438\u0442\u0435\u043b\u044c\u043d\u044b\u043c. \u0410\u043d\u0442\u0435\u0446\u0435\u0434\u0435\u043d\u0442 \u0437\u0434\u0435\u0441\u044c \u2014 \u201cones\u201d " +
      "(\u043c\u043d\u043e\u0436\u0435\u0441\u0442\u0432\u0435\u043d\u043d\u043e\u0435 \u0447\u0438\u0441\u043b\u043e), \u043f\u043e\u044d\u0442\u043e\u043c\u0443 \u043d\u0443\u0436\u043d\u043e \u201chaven\u2019t been\u201d: \u043d\u0435 \u201chasn\u2019t been\u201d, \u043d\u0435 " +
      "\u201cwasn\u2019t\u201d \u0438 \u043d\u0435 \u201cis\u201d, \u043a\u0430\u043a \u043f\u043e\u043b\u0443\u0447\u0438\u043b\u043e\u0441\u044c \u0432 \u0438\u0441\u0445\u043e\u0434\u043d\u043e\u0439 \u0437\u0430\u043f\u0438\u0441\u0438. \u041d\u0430\u0440\u0435\u0447\u0438\u0435 \u201cfully\u201d \u043f\u0440\u0438 \u044d\u0442\u043e\u043c " +
      "\u0441\u0442\u043e\u0438\u0442 \u043f\u0435\u0440\u0435\u0434 \u043f\u0440\u0438\u0447\u0430\u0441\u0442\u0438\u0435\u043c \u043f\u0440\u043e\u0448\u0435\u0434\u0448\u0435\u0433\u043e \u0432\u0440\u0435\u043c\u0435\u043d\u0438, \u0430 \u043d\u0435 \u043f\u043e\u0441\u043b\u0435 \u043d\u0435\u0433\u043e.",
    example: {
      wrong: "narrow the research questions down to ones that is not explored fully yet",
      right: "narrow the research questions down to ones that haven\u2019t been fully explored yet",
    },
    registers: ["work", "everyday"],
    topics: ["course-agreement"],
  },
  {

      "\u201cbegin by asking\u201d). \u201cWith\u201d + \u0441\u0443\u0449\u0435\u0441\u0442\u0432\u0438\u0442\u0435\u043b\u044c\u043d\u043e\u0435 \u043e\u043f\u0438\u0441\u044b\u0432\u0430\u0435\u0442 \u043f\u0440\u0435\u0434\u043c\u0435\u0442, \u0441 \u043a\u043e\u0442\u043e\u0440\u043e\u0433\u043e " +

  {

      "\u044d\u0442\u043e \u201cten more years\u201d. \u041e\u0431\u0440\u0430\u0442\u043d\u044b\u0439 \u043f\u043e\u0440\u044f\u0434\u043e\u043a, \u201cten years more\u201d, \u0441\u0443\u0449\u0435\u0441\u0442\u0432\u0443\u0435\u0442, \u043d\u043e \u043e\u043d \u043a\u043d\u0438\u0436\u043d\u044b\u0439 \u0438 " +

      "\u0440\u0443\u0441\u0441\u043a\u043e\u0433\u043e. \u041f\u0438\u0448\u0438\u0442\u0435 \u201cten more years\u201d.",

  {

      "\u0432 \u0447\u044c\u044e-\u0442\u043e \u043f\u043e\u043b\u044c\u0437\u0443\u00bb. \u0414\u043b\u044f \u044d\u0442\u043e\u0433\u043e \u0441\u043c\u044b\u0441\u043b\u0430 \u043d\u0443\u0436\u043d\u043e \u0434\u0440\u0443\u0433\u043e\u0435 \u0441\u043b\u043e\u0432\u043e (favourable, " +

  {
    id: "calque-prepositions",
    category: "word-choice",
    title: "\u041a\u0430\u043b\u044c\u043a\u0430 \u0440\u0443\u0441\u0441\u043a\u0438\u0445 \u043f\u0440\u0435\u0434\u043b\u043e\u0436\u043d\u044b\u0445 \u043a\u043e\u043d\u0441\u0442\u0440\u0443\u043a\u0446\u0438\u0439",
    explanation:
      "\u0420\u0443\u0441\u0441\u043a\u0438\u0435 \u043f\u0430\u0434\u0435\u0436\u0438 \u043b\u0435\u0433\u043a\u043e \u043f\u0440\u0435\u0432\u0440\u0430\u0449\u0430\u044e\u0442\u0441\u044f \u0432 \u0446\u0435\u043f\u043e\u0447\u043a\u0443 \u0430\u043d\u0433\u043b\u0438\u0439\u0441\u043a\u0438\u0445 \u201cof\u201d/\u201cwith\u201d/\u201cfor\u201d. \u0410\u043d\u0433\u043b\u0438\u0439\u0441\u043a\u0438\u0439 " +
      "\u043e\u0431\u044b\u0447\u043d\u043e \u043f\u0440\u0435\u0434\u043f\u043e\u0447\u0438\u0442\u0430\u0435\u0442 \u043a\u043e\u043c\u043f\u0430\u043a\u0442\u043d\u043e\u0435 \u043f\u0440\u0438\u043b\u0430\u0433\u0430\u0442\u0435\u043b\u044c\u043d\u043e\u0435 + \u0441\u0443\u0449\u0435\u0441\u0442\u0432\u0438\u0442\u0435\u043b\u044c\u043d\u043e\u0435 \u0432\u043c\u0435\u0441\u0442\u043e \u0442\u0430\u043a\u043e\u0439 \u0446\u0435\u043f\u043e\u0447\u043a\u0438: " +
      "\u00ab\u043f\u0440\u0438\u0437\u043d\u0430\u043a\u0438 \u0434\u043b\u044f \u043d\u0438\u0445\u00bb \u2014 \u044d\u0442\u043e \u043d\u0435 \u201cmarkers of them\u201d (\u043f\u0440\u0438\u043d\u0430\u0434\u043b\u0435\u0436\u043d\u043e\u0441\u0442\u044c), \u0430 \u201cmarkers for them\u201d " +
      "(\u043d\u0430\u0437\u043d\u0430\u0447\u0435\u043d\u0438\u0435); \u00ab\u0447\u0438\u0441\u043b\u043e \u0431\u043b\u0430\u0433\u043e\u043f\u043e\u043b\u0443\u0447\u0430\u0442\u0435\u043b\u0435\u0439\u00bb \u2014 \u043d\u0435 \u201cbeneficiaries number\u201d, \u0430 \u201cthe number of " +
      "beneficiaries\u201d: \u0440\u0443\u0441\u0441\u043a\u0438\u0439 \u0440\u043e\u0434\u0438\u0442\u0435\u043b\u044c\u043d\u044b\u0439 \u043f\u0430\u0434\u0435\u0436 (\u00ab\u0431\u043b\u0430\u0433\u043e\u043f\u043e\u043b\u0443\u0447\u0430\u0442\u0435\u043b\u0435\u0439\u00bb) \u0437\u0434\u0435\u0441\u044c \u043f\u0435\u0440\u0435\u0434\u0430\u0451\u0442\u0441\u044f " +
      "\u043f\u0440\u0435\u0434\u043b\u043e\u0433\u043e\u043c \u201cof\u201d, \u0430 \u043d\u0435 \u043f\u043e\u0441\u0442\u0430\u043d\u043e\u0432\u043a\u043e\u0439 \u0434\u0432\u0443\u0445 \u0441\u0443\u0449\u0435\u0441\u0442\u0432\u0438\u0442\u0435\u043b\u044c\u043d\u044b\u0445 \u043f\u043e\u0434\u0440\u044f\u0434, \u043a\u0430\u043a \u0432 \u0440\u0443\u0441\u0441\u043a\u043e\u043c.",
    example: {

    registers: ["work"],

  },
  {
    id: "concerned-with",
    category: "word-choice",
    title: "\u201cConcerned with\u201d, \u0430 \u043d\u0435 \u201cconcerned in\u201d",
    explanation:
      "\u201cConcerned with\u201d \u0437\u043d\u0430\u0447\u0438\u0442 \u00ab\u0437\u0430\u0438\u043d\u0442\u0435\u0440\u0435\u0441\u043e\u0432\u0430\u043d \u0432 / \u0441\u043e\u0441\u0440\u0435\u0434\u043e\u0442\u043e\u0447\u0435\u043d \u043d\u0430\u00bb (\u0442\u043e, \u0447\u0442\u043e \u0432\u0430\u0436\u043d\u043e \u0434\u043b\u044f \u043a\u043e\u0433\u043e-\u0442\u043e). " +
      "\u201cConcerned about\u201d \u0437\u043d\u0430\u0447\u0438\u0442 \u00ab\u043e\u0431\u0435\u0441\u043f\u043e\u043a\u043e\u0435\u043d\u00bb. \u201cConcerned in\u201d \u0437\u043d\u0430\u0447\u0438\u0442 \u0442\u0440\u0435\u0442\u044c\u0435: \u00ab\u0437\u0430\u043c\u0435\u0448\u0430\u043d, " +
      "\u0443\u0447\u0430\u0441\u0442\u0432\u043e\u0432\u0430\u043b\u00bb (\u201cthe officers concerned in the inquiry\u201d), \u0438 \u0437\u0432\u0443\u0447\u0438\u0442 \u0444\u043e\u0440\u043c\u0430\u043b\u044c\u043d\u043e, \u043f\u043e\u0447\u0442\u0438 " +
      "\u044e\u0440\u0438\u0434\u0438\u0447\u0435\u0441\u043a\u0438. \u041f\u043e\u044d\u0442\u043e\u043c\u0443 \u0432 \u0437\u043d\u0430\u0447\u0435\u043d\u0438\u0438 \u00ab\u0437\u0430\u0431\u043e\u0442\u0438\u0442\u0441\u044f \u043e / \u043e\u0431\u0440\u0430\u0449\u0430\u0435\u0442 \u0432\u043d\u0438\u043c\u0430\u043d\u0438\u0435 \u043d\u0430\u00bb \u043d\u0443\u0436\u0435\u043d \u201cwith\u201d: " +
      "\u201cin\u201d \u0437\u0434\u0435\u0441\u044c \u043d\u0435 \u0441\u0442\u0438\u043b\u0438\u0441\u0442\u0438\u0447\u0435\u0441\u043a\u0430\u044f \u0448\u0435\u0440\u043e\u0445\u043e\u0432\u0430\u0442\u043e\u0441\u0442\u044c, \u0430 \u0434\u0440\u0443\u0433\u043e\u0435 \u0443\u0442\u0432\u0435\u0440\u0436\u0434\u0435\u043d\u0438\u0435.",
    plainNote: "\u201cConcerned in\u201d \u2014 \u0442\u043e\u0436\u0435 \u0430\u043d\u0433\u043b\u0438\u0439\u0441\u043a\u0438\u0439, \u043f\u0440\u043e\u0441\u0442\u043e \u043f\u0440\u043e \u0434\u0440\u0443\u0433\u043e\u0435.",

    topics: ["course-word-choice"],

  {
    id: "noticed-vs-pointed-out",
    category: "word-choice",
    title: "\u201cNoticed\u201d vs \u201cpointed out\u201d \u043f\u0440\u0438 \u0446\u0438\u0442\u0438\u0440\u043e\u0432\u0430\u043d\u0438\u0438 \u0447\u0443\u0436\u0438\u0445 \u0441\u043b\u043e\u0432",
    explanation:
      "\u201cNoticed\u201d \u043f\u043e\u0434\u0440\u0430\u0437\u0443\u043c\u0435\u0432\u0430\u0435\u0442 \u0437\u0440\u0438\u0442\u0435\u043b\u044c\u043d\u043e\u0435 \u0438\u043b\u0438 \u0438\u043d\u043e\u0435 \u0447\u0443\u0432\u0441\u0442\u0432\u0435\u043d\u043d\u043e\u0435 \u043d\u0430\u0431\u043b\u044e\u0434\u0435\u043d\u0438\u0435. \u0427\u0442\u043e\u0431\u044b \u0441\u043e\u0441\u043b\u0430\u0442\u044c\u0441\u044f \u043d\u0430 " +
      "\u0443\u0441\u0442\u043d\u043e\u0435 \u0432\u044b\u0441\u043a\u0430\u0437\u044b\u0432\u0430\u043d\u0438\u0435 \u0438\u043b\u0438 \u0430\u0440\u0433\u0443\u043c\u0435\u043d\u0442, \u0438\u0441\u043f\u043e\u043b\u044c\u0437\u0443\u0439\u0442\u0435 \u201cpointed out\u201d, \u201cnoted\u201d, \u201cmentioned\u201d \u0438\u043b\u0438 " +
      "\u201cobserved\u201d (\u0432 \u0438\u043d\u0442\u0435\u043b\u043b\u0435\u043a\u0442\u0443\u0430\u043b\u044c\u043d\u043e\u043c \u0441\u043c\u044b\u0441\u043b\u0435).",
    example: {
      wrong: "as Theo noticed",
      right: "as Theo pointed out",
    },
    registers: ["work"],
    topics: ["course-word-choice"],
  },
  {

    category: "word-choice",
    title: "Perspective \u0438 prospective",
    explanation:
      "\u201cPerspective\u201d \u2014 \u044d\u0442\u043e \u0442\u043e\u0447\u043a\u0430 \u0437\u0440\u0435\u043d\u0438\u044f, \u0440\u0430\u043a\u0443\u0440\u0441 \u0440\u0430\u0441\u0441\u043c\u043e\u0442\u0440\u0435\u043d\u0438\u044f \u0442\u0435\u043c\u044b (\u201cfrom a sociological " +
      "perspective\u201d). \u201cProspective\u201d \u2014 \u0431\u0443\u0434\u0443\u0449\u0438\u0439, \u043f\u043e\u0442\u0435\u043d\u0446\u0438\u0430\u043b\u044c\u043d\u044b\u0439, \u043e\u0436\u0438\u0434\u0430\u0435\u043c\u044b\u0439 (\u201ca prospective " +
      "student\u201d, \u201cprospective clients\u201d). \u0422\u0430\u043a\u0436\u0435 \u043e\u0431\u0440\u0430\u0442\u0438\u0442\u0435 \u0432\u043d\u0438\u043c\u0430\u043d\u0438\u0435 \u043d\u0430 \u043f\u0440\u0435\u0434\u043b\u043e\u0433: \u201cknowledge of\u201d " +
      "\u0447\u0435\u0433\u043e-\u043b\u0438\u0431\u043e, \u0430 \u043d\u0435 \u201cknowledge on\u201d.",

    topics: ["course-word-choice"],
  },
  {
    id: "overview-not-verb",
    category: "word-choice",
    title: "\u0421\u0443\u0449\u0435\u0441\u0442\u0432\u0438\u0442\u0435\u043b\u044c\u043d\u044b\u0435, \u0438\u0441\u043f\u043e\u043b\u044c\u0437\u0443\u0435\u043c\u044b\u0435 \u043a\u0430\u043a \u0433\u043b\u0430\u0433\u043e\u043b\u044b: \u201coverview\u201d",
    explanation:
      "\u201cOverview\u201d \u0432 \u0431\u0440\u0438\u0442\u0430\u043d\u0441\u043a\u043e\u0439 \u043d\u043e\u0440\u043c\u0435 \u2014 \u0441\u0443\u0449\u0435\u0441\u0442\u0432\u0438\u0442\u0435\u043b\u044c\u043d\u043e\u0435; \u0433\u043b\u0430\u0433\u043e\u043b \u201cto " +
      "overview\u201d \u0447\u0430\u0441\u0442\u044c \u0441\u043b\u043e\u0432\u0430\u0440\u0435\u0439 \u0432\u0441\u0451 \u0436\u0435 \u0444\u0438\u043a\u0441\u0438\u0440\u0443\u0435\u0442, \u043d\u043e \u0441 \u043f\u043e\u043c\u0435\u0442\u043e\u0439 \u00ab\u0440\u0435\u0434\u043a\u043e\u0435\u00bb, \u0438 \u0432 \u043e\u0431\u044b\u0447\u043d\u043e\u043c " +
      "\u0442\u0435\u043a\u0441\u0442\u0435 \u043e\u043d \u0447\u0438\u0442\u0430\u0435\u0442\u0441\u044f \u043a\u0430\u043a \u043e\u0448\u0438\u0431\u043a\u0430. \u0418\u0441\u043f\u043e\u043b\u044c\u0437\u0443\u0439\u0442\u0435 " +
      "\u201creview\u201d, \u201cgo over\u201d, \u201clook through\u201d, \u201cskim\u201d. \u0420\u044f\u0434\u043e\u043c \u0441\u0442\u043e\u0438\u0442 \u201cto " +
      "insight\u201d, \u043a\u043e\u0442\u043e\u0440\u043e\u0433\u043e \u043d\u0435\u0442 \u0432\u043e\u0432\u0441\u0435. \u0410 \u201cto feed back\u201d \u043a\u0430\u043a \u0440\u0430\u0437 \u0441\u0443\u0449\u0435\u0441\u0442\u0432\u0443\u0435\u0442 \u0438 \u0432 " +
      "\u0431\u0440\u0438\u0442\u0430\u043d\u0441\u043a\u043e\u0439 \u0440\u0435\u0447\u0438 \u043e\u0431\u044b\u0447\u0435\u043d (\u201cI\u2019ll feed back to the team\u201d), \u043d\u043e \u043f\u0438\u0448\u0435\u0442\u0441\u044f \u0432 \u0434\u0432\u0430 " +
      "\u0441\u043b\u043e\u0432\u0430 \u0438 \u0432 \u043e\u0442\u0447\u0451\u0442\u0435 \u0437\u0432\u0443\u0447\u0438\u0442 \u043a\u0430\u043d\u0446\u0435\u043b\u044f\u0440\u0441\u043a\u0438. \u041f\u0440\u0430\u0432\u0438\u043b\u043e \u043e\u0434\u043d\u043e: \u043f\u0440\u0435\u0436\u0434\u0435 \u0447\u0435\u043c \u0434\u0435\u043b\u0430\u0442\u044c \u0433\u043b\u0430\u0433\u043e\u043b \u0438\u0437 " +
      "\u0437\u043d\u0430\u043a\u043e\u043c\u043e\u0433\u043e \u0441\u0443\u0449\u0435\u0441\u0442\u0432\u0438\u0442\u0435\u043b\u044c\u043d\u043e\u0433\u043e, \u043f\u0440\u043e\u0432\u0435\u0440\u044c\u0442\u0435, \u0447\u0442\u043e \u0442\u0430\u043a\u043e\u0439 \u0433\u043b\u0430\u0433\u043e\u043b \u0435\u0441\u0442\u044c.",
    example: {
      wrong: "so I can quickly overview all of this later",
      right: "so I can quickly look back over all of it later",
    },
    registers: ["work", "everyday"],
    topics: ["course-word-choice"],
  },
  {

  {

      "\u043f\u043e\u0434\u0434\u0435\u0440\u0436\u043a\u0435\u00bb. \u201cAt the need\u201d \u043d\u0435 \u0430\u043d\u0433\u043b\u0438\u0439\u0441\u043a\u0438\u0439 \u0432\u043e\u0432\u0441\u0435; \u201cat need\u201d \u0441\u0443\u0449\u0435\u0441\u0442\u0432\u0443\u0435\u0442, \u043d\u043e " +

      "\u201cscreen reader\u201d, \u201cmind map\u201d. \u041e\u0431\u0449\u0435\u0433\u043e \u043f\u0440\u0430\u0432\u0438\u043b\u0430 \u0437\u0434\u0435\u0441\u044c \u043d\u0435\u0442: \u043d\u0430\u043f\u0438\u0441\u0430\u043d\u0438\u0435 \u0430\u043d\u0433\u043b\u0438\u0439\u0441\u043a\u0438\u0445 \u0441\u043e\u0441\u0442\u0430\u0432\u043d\u044b\u0445 " +
      "\u0441\u043b\u043e\u0432 \u043d\u0435 \u0432\u044b\u0432\u043e\u0434\u0438\u0442\u0441\u044f \u043b\u043e\u0433\u0438\u0447\u0435\u0441\u043a\u0438, \u0430 \u0444\u0438\u043a\u0441\u0438\u0440\u043e\u0432\u0430\u043d\u043e \u043e\u0442\u0434\u0435\u043b\u044c\u043d\u043e \u0434\u043b\u044f \u043a\u0430\u0436\u0434\u043e\u0433\u043e \u0441\u043b\u043e\u0432\u0430 \u0438 \u0435\u0433\u043e \u043d\u0443\u0436\u043d\u043e " +

      "\u0442\u0440\u0430\u043d\u0441\u043b\u0438\u0442\u0435\u0440\u0438\u0440\u043e\u0432\u0430\u043d\u043d\u043e\u0435 \u0437\u0430\u0438\u043c\u0441\u0442\u0432\u043e\u0432\u0430\u043d\u0438\u0435 (\u00ab\u0441\u043a\u0440\u0438\u043d\u0440\u0438\u0434\u0435\u0440\u00bb, \u00ab\u043c\u0430\u0439\u043d\u0434\u043c\u044d\u043f\u00bb), \u043a\u043e\u0442\u043e\u0440\u043e\u0435 \u0432 \u0440\u0443\u0441\u0441\u043a\u043e\u043c \u043f\u0438\u0448\u0435\u0442\u0441\u044f " +

    explanation:
      "\u042d\u0442\u043e \u043d\u0435 \u043e\u0448\u0438\u0431\u043a\u0430 \u0432 \u0443\u0441\u0442\u043d\u043e\u0439 \u0440\u0435\u0447\u0438, \u043d\u043e \u201cgonna\u201d, \u201cwanna\u201d, \u201cgotta\u201d, \u201ckinda\u201d " +
      "\u0432\u044b\u0433\u043b\u044f\u0434\u044f\u0442 \u043d\u0435\u0443\u043c\u0435\u0441\u0442\u043d\u043e \u0432 \u0444\u043e\u0440\u0443\u043c\u043d\u043e\u043c \u043f\u043e\u0441\u0442\u0435, \u043d\u0430\u043f\u0438\u0441\u0430\u043d\u043d\u043e\u043c \u0432 \u043e\u0441\u0442\u0430\u043b\u044c\u043d\u043e\u043c \u0432 \u043d\u0435\u0439\u0442\u0440\u0430\u043b\u044c\u043d\u043e\u043c " +
      "\u0440\u0435\u0433\u0438\u0441\u0442\u0440\u0435. \u041e\u0431\u044b\u0447\u043d\u044b\u0435 \u0441\u043e\u043a\u0440\u0430\u0449\u0435\u043d\u0438\u044f (\u201cit\u2019s\u201d, \u201cdon\u2019t\u201d, \u201cI\u2019d\u201d, \u201chaven\u2019t\u201d) " +
      "\u0443\u043c\u0435\u0441\u0442\u043d\u044b \u0438 \u0441\u043e\u043e\u0442\u0432\u0435\u0442\u0441\u0442\u0432\u0443\u044e\u0442 \u0433\u043e\u043b\u043e\u0441\u0443 \u0442\u0435\u043a\u0441\u0442\u0430, \u0430 \u044d\u0442\u0438 \u0447\u0435\u0442\u044b\u0440\u0435 \u0444\u043e\u0440\u043c\u044b \u0441\u043b\u0438\u0448\u043a\u043e\u043c \u0440\u0430\u0437\u0433\u043e\u0432\u043e\u0440\u043d\u044b\u0435 " +
      "\u0434\u043b\u044f \u043f\u0438\u0441\u044c\u043c\u0435\u043d\u043d\u043e\u0433\u043e \u0441\u0442\u0438\u043b\u044f.",
    example: {
      wrong: "I\u2019m gonna find some papers",
      right: "I\u2019m going to find some papers",
    },
    registers: ["everyday"],
    topics: ["course-word-choice"],
  },
  {
    id: "article-abstract-activity",
    category: "style",
    title: "\u0410\u0440\u0442\u0438\u043a\u043b\u044c \u043f\u0435\u0440\u0435\u0434 \u0430\u0431\u0441\u0442\u0440\u0430\u043a\u0442\u043d\u044b\u043c\u0438 \u0441\u0443\u0449\u0435\u0441\u0442\u0432\u0438\u0442\u0435\u043b\u044c\u043d\u044b\u043c\u0438 \u0434\u0435\u044f\u0442\u0435\u043b\u044c\u043d\u043e\u0441\u0442\u0438",
    explanation:
      "\u041a\u043e\u0433\u0434\u0430 \u0440\u0435\u0447\u044c \u0438\u0434\u0451\u0442 \u043e \u0434\u0435\u044f\u0442\u0435\u043b\u044c\u043d\u043e\u0441\u0442\u0438 \u0432 \u0446\u0435\u043b\u043e\u043c (\u043d\u0435 \u043e \u043a\u043e\u043d\u043a\u0440\u0435\u0442\u043d\u043e\u043c \u0441\u043b\u0443\u0447\u0430\u0435), \u0430\u0440\u0442\u0438\u043a\u043b\u044c " +
      "\u043e\u043f\u0443\u0441\u043a\u0430\u0435\u0442\u0441\u044f: \u201cmeasure performance\u201d, \u201ctrack impact\u201d, \u201cimprove accessibility\u201d. " +
      "\u201cThe\u201d \u043f\u043e\u044f\u0432\u043b\u044f\u0435\u0442\u0441\u044f, \u043a\u043e\u0433\u0434\u0430 \u0441\u043b\u0443\u0447\u0430\u0439 \u043a\u043e\u043d\u043a\u0440\u0435\u0442\u0435\u043d: \u043e \u043d\u0451\u043c \u0443\u0436\u0435 \u0448\u043b\u0430 " +
      "\u0440\u0435\u0447\u044c \u0438\u043b\u0438 \u0435\u0433\u043e \u0443\u0442\u043e\u0447\u043d\u044f\u0435\u0442 \u0442\u043e, \u0447\u0442\u043e \u0441\u0442\u043e\u0438\u0442 \u0440\u044f\u0434\u043e\u043c: \u201cthe performance of the new build\u201d.",
    plainNote: "\u041e\u0431\u0430 \u0432\u0430\u0440\u0438\u0430\u043d\u0442\u0430 \u0433\u0440\u0430\u043c\u043c\u0430\u0442\u0438\u0447\u0435\u0441\u043a\u0438 \u0432\u0435\u0440\u043d\u044b: \u0440\u0430\u0437\u043d\u0438\u0446\u0430 \u0432 \u0442\u043e\u043c, \u043e \u0447\u0451\u043c \u0438\u0434\u0451\u0442 \u0440\u0435\u0447\u044c.",
    example: {
      wrong: "measure the performance",
      right: "measure performance",
    },
    registers: ["work", "everyday"],
    topics: ["course-articles"],
  },
  {
    id: "inversion-negative-frequency",
    category: "grammar",
    title: "\u0418\u043d\u0432\u0435\u0440\u0441\u0438\u044f \u043f\u043e\u0441\u043b\u0435 \u043e\u0442\u0440\u0438\u0446\u0430\u0442\u0435\u043b\u044c\u043d\u044b\u0445 \u043d\u0430\u0440\u0435\u0447\u0438\u0439 \u0447\u0430\u0441\u0442\u043e\u0442\u043d\u043e\u0441\u0442\u0438",
    explanation:
      "\u041f\u043e\u0441\u043b\u0435 never, rarely, seldom, hardly ever \u0432 \u043d\u0430\u0447\u0430\u043b\u0435 \u043f\u0440\u0435\u0434\u043b\u043e\u0436\u0435\u043d\u0438\u044f \u043f\u043e\u0434\u043b\u0435\u0436\u0430\u0449\u0435\u0435 \u0438 " +
      "\u0432\u0441\u043f\u043e\u043c\u043e\u0433\u0430\u0442\u0435\u043b\u044c\u043d\u044b\u0439 \u0433\u043b\u0430\u0433\u043e\u043b \u043c\u0435\u043d\u044f\u044e\u0442\u0441\u044f \u043c\u0435\u0441\u0442\u0430\u043c\u0438, \u043a\u0430\u043a \u0432 \u0432\u043e\u043f\u0440\u043e\u0441\u0435: never have I felt, rarely does " +
      "she agree. \u0415\u0441\u043b\u0438 \u0432\u0441\u043f\u043e\u043c\u043e\u0433\u0430\u0442\u0435\u043b\u044c\u043d\u043e\u0433\u043e \u0433\u043b\u0430\u0433\u043e\u043b\u0430 \u043d\u0435\u0442, \u043f\u043e\u044f\u0432\u043b\u044f\u0435\u0442\u0441\u044f do. \u0420\u0430\u0437\u043d\u0438\u0446\u0430 \u0442\u043e\u043b\u044c\u043a\u043e \u0432 \u0441\u0438\u043b\u0435 " +
      "\u0430\u043a\u0446\u0435\u043d\u0442\u0430 \u0438 \u0432 \u0440\u0435\u0433\u0438\u0441\u0442\u0440\u0435: \u043f\u0440\u0438\u0451\u043c \u043a\u043d\u0438\u0436\u043d\u044b\u0439 \u0438 \u043f\u0438\u0441\u044c\u043c\u0435\u043d\u043d\u044b\u0439, \u0432 \u0440\u0430\u0437\u0433\u043e\u0432\u043e\u0440\u0435 \u0438\u043b\u0438 \u0432 \u0444\u043e\u0440\u0443\u043c\u043d\u043e\u043c \u043f\u043e\u0441\u0442\u0435 \u043e\u043d " +
      "\u0437\u0432\u0443\u0447\u0438\u0442 \u0432\u044b\u0447\u0443\u0440\u043d\u043e.",
    plainNote: "\u041e\u0431\u044b\u0447\u043d\u044b\u0439 \u043f\u043e\u0440\u044f\u0434\u043e\u043a \u0441\u043b\u043e\u0432 \u0437\u0434\u0435\u0441\u044c \u0442\u043e\u0436\u0435 \u0441\u043e\u0432\u0435\u0440\u0448\u0435\u043d\u043d\u043e \u043f\u0440\u0430\u0432\u0438\u043b\u0435\u043d.",
    example: {
      wrong: "I have never seen a research design fall apart so quickly.",
      right: "Never have I seen a research design fall apart so quickly.",
    },
    registers: ["work"],
    topics: ["tutor-inversion"],
    emphasis: true,
    goal: "emphatic",
  },
  {
    id: "inversion-negative-expression",
    category: "grammar",
    title: "\u0418\u043d\u0432\u0435\u0440\u0441\u0438\u044f \u043f\u043e\u0441\u043b\u0435 \u043e\u0442\u0440\u0438\u0446\u0430\u0442\u0435\u043b\u044c\u043d\u044b\u0445 \u043e\u0431\u043e\u0440\u043e\u0442\u043e\u0432",
    explanation:
      "\u041e\u0431\u043e\u0440\u043e\u0442\u044b under no circumstances, on no account, by no means, in no way, at no time, " +
      "nowhere, not once, \u0432\u044b\u043d\u0435\u0441\u0435\u043d\u043d\u044b\u0435 \u0432 \u043d\u0430\u0447\u0430\u043b\u043e, \u0442\u044f\u043d\u0443\u0442 \u0437\u0430 \u0441\u043e\u0431\u043e\u0439 \u0442\u043e\u0442 \u0436\u0435 \u043e\u0431\u043c\u0435\u043d \u043c\u0435\u0441\u0442\u0430\u043c\u0438 " +
      "\u043f\u043e\u0434\u043b\u0435\u0436\u0430\u0449\u0435\u0433\u043e \u0438 \u0432\u0441\u043f\u043e\u043c\u043e\u0433\u0430\u0442\u0435\u043b\u044c\u043d\u043e\u0433\u043e \u0433\u043b\u0430\u0433\u043e\u043b\u0430. \u0415\u0441\u043b\u0438 \u0441\u0432\u043e\u0435\u0433\u043e \u0432\u0441\u043f\u043e\u043c\u043e\u0433\u0430\u0442\u0435\u043b\u044c\u043d\u043e\u0433\u043e \u0433\u043b\u0430\u0433\u043e\u043b\u0430 \u043d\u0435\u0442, \u0435\u0433\u043e " +
      "\u0440\u043e\u043b\u044c \u0431\u0435\u0440\u0451\u0442 do: \u201cAt no time did the committee ask\u201d. \u0418\u043d\u0432\u0435\u0440\u0442\u0438\u0440\u043e\u0432\u0430\u043d\u043d\u044b\u0439 \u0432\u0430\u0440\u0438\u0430\u043d\u0442 \u0437\u0432\u0443\u0447\u0438\u0442 \u043a\u0430\u0442\u0435\u0433\u043e\u0440\u0438\u0447\u043d\u0435\u0435 \u0438 " +
      "\u0443\u043c\u0435\u0441\u0442\u0435\u043d \u0432 \u0440\u0435\u0433\u043b\u0430\u043c\u0435\u043d\u0442\u0430\u0445, \u043f\u043e\u043b\u0438\u0442\u0438\u043a\u0430\u0445 \u0438 \u044e\u0440\u0438\u0434\u0438\u0447\u0435\u0441\u043a\u0438\u0445 \u0442\u0435\u043a\u0441\u0442\u0430\u0445. \u0412 \u0440\u0443\u0441\u0441\u043a\u043e\u043c \u0432\u044b\u043d\u043e\u0441 \u043e\u0442\u0440\u0438\u0446\u0430\u043d\u0438\u044f " +
      "\u0432\u043f\u0435\u0440\u0451\u0434 (\u00ab\u043d\u0438 \u043f\u0440\u0438 \u043a\u0430\u043a\u0438\u0445 \u043e\u0431\u0441\u0442\u043e\u044f\u0442\u0435\u043b\u044c\u0441\u0442\u0432\u0430\u0445 \u043c\u044b \u043d\u0435\u2026\u00bb) \u043f\u043e\u0440\u044f\u0434\u043e\u043a \u0441\u043b\u043e\u0432 \u043d\u0435 \u043c\u0435\u043d\u044f\u0435\u0442, \u043f\u043e\u044d\u0442\u043e\u043c\u0443 " +
      "\u043f\u043e\u0434\u0441\u043a\u0430\u0437\u043a\u0438 \u0438\u0437\u043d\u0443\u0442\u0440\u0438 \u0440\u0443\u0441\u0441\u043a\u043e\u0433\u043e \u0437\u0434\u0435\u0441\u044c \u043d\u0435\u0442. \u041a\u043e\u043d\u0441\u0442\u0440\u0443\u043a\u0446\u0438\u044e \u043d\u0443\u0436\u043d\u043e \u0441\u0442\u0430\u0432\u0438\u0442\u044c \u0441\u043e\u0437\u043d\u0430\u0442\u0435\u043b\u044c\u043d\u043e.",
    plainNote: "\u041e\u0431\u0430 \u0432\u0430\u0440\u0438\u0430\u043d\u0442\u0430 \u0433\u0440\u0430\u043c\u043c\u0430\u0442\u0438\u0447\u043d\u044b.",
    example: {
      wrong: "We must under no circumstances pass the participants\u2019 recordings to the client.",
      right: "Under no circumstances must we pass the participants\u2019 recordings to the client.",
    },
    registers: ["work"],
    topics: ["tutor-inversion"],

    goal: "emphatic",
  },
  {
    id: "inversion-only-adverbial",
    category: "grammar",
    title: "\u0418\u043d\u0432\u0435\u0440\u0441\u0438\u044f \u043f\u043e\u0441\u043b\u0435 \u201conly\u201d \u0441 \u043e\u0431\u0441\u0442\u043e\u044f\u0442\u0435\u043b\u044c\u0441\u0442\u0432\u043e\u043c",
    explanation:
      "\u0418\u043d\u0432\u0435\u0440\u0441\u0438\u044f \u0441\u0440\u0430\u0431\u0430\u0442\u044b\u0432\u0430\u0435\u0442, \u043a\u043e\u0433\u0434\u0430 \u0432 \u043d\u0430\u0447\u0430\u043b\u043e \u0432\u044b\u043d\u0435\u0441\u0435\u043d\u043e \u201conly\u201d \u0432\u043c\u0435\u0441\u0442\u0435 \u0441 \u043e\u0431\u0441\u0442\u043e\u044f\u0442\u0435\u043b\u044c\u0441\u0442\u0432\u043e\u043c \u0432\u0440\u0435\u043c\u0435\u043d\u0438, " +
      "\u043c\u0435\u0441\u0442\u0430 \u0438\u043b\u0438 \u0441\u043f\u043e\u0441\u043e\u0431\u0430: only then, only later, only in 2019, only after the third round, " +
      "only by asking. \u0421\u0430\u043c\u043e \u043f\u043e \u0441\u0435\u0431\u0435 \u201conly\u201d \u043f\u0435\u0440\u0435\u0434 \u043f\u043e\u0434\u043b\u0435\u0436\u0430\u0449\u0438\u043c \u043d\u0438\u0447\u0435\u0433\u043e \u043d\u0435 \u043c\u0435\u043d\u044f\u0435\u0442: \u201cOnly the " +
      "deadline moved\u201d \u2014 \u043e\u0431\u044b\u0447\u043d\u043e\u0435 \u043f\u0440\u0435\u0434\u043b\u043e\u0436\u0435\u043d\u0438\u0435. \u0414\u0430\u043b\u044c\u0448\u0435 \u043f\u043e\u0440\u044f\u0434\u043e\u043a \u0432\u043e\u043f\u0440\u043e\u0441\u043d\u044b\u0439: \u0432\u0441\u043f\u043e\u043c\u043e\u0433\u0430\u0442\u0435\u043b\u044c\u043d\u044b\u0439 " +
      "\u0433\u043b\u0430\u0433\u043e\u043b \u043f\u0435\u0440\u0435\u0434 \u043f\u043e\u0434\u043b\u0435\u0436\u0430\u0449\u0438\u043c, \u0430 \u0435\u0441\u043b\u0438 \u0441\u0432\u043e\u0435\u0433\u043e \u0432\u0441\u043f\u043e\u043c\u043e\u0433\u0430\u0442\u0435\u043b\u044c\u043d\u043e\u0433\u043e \u043d\u0435\u0442, \u043f\u043e\u044f\u0432\u043b\u044f\u0435\u0442\u0441\u044f do \u2014 " +
      "\u201cdid we understand\u201d, \u0430 \u043d\u0435 \u201cwe did understand\u201d. \u0417\u0434\u0435\u0441\u044c \u0438 \u043f\u0440\u043e\u0445\u043e\u0434\u0438\u0442 \u0433\u0440\u0430\u043d\u0438\u0446\u0430 \u0441 \u0432\u044b\u043d\u043e\u0441\u043e\u043c " +
      "\u043e\u0431\u0441\u0442\u043e\u044f\u0442\u0435\u043b\u044c\u0441\u0442\u0432\u0430 \u043c\u0435\u0441\u0442\u0430 (\u201cInto the room came the cohort\u201d), \u0433\u0434\u0435 do \u043d\u0435 \u043f\u043e\u044f\u0432\u043b\u044f\u0435\u0442\u0441\u044f \u043d\u0438\u043a\u043e\u0433\u0434\u0430. " +
      "\u0418\u043d\u0432\u0435\u0440\u0441\u0438\u044f \u043b\u0438\u0448\u044c \u0443\u0441\u0438\u043b\u0438\u0432\u0430\u0435\u0442 \u043c\u044b\u0441\u043b\u044c \u00ab\u0438 \u043d\u0438\u043a\u0430\u043a \u0438\u043d\u0430\u0447\u0435\u00bb, \u0438 \u0434\u0435\u043b\u0430\u0435\u0442 \u044d\u0442\u043e \u0432 \u043a\u043d\u0438\u0436\u043d\u043e\u043c \u0440\u0435\u0433\u0438\u0441\u0442\u0440\u0435.",
    example: {
      wrong: "We understood what the toolbar cost blind users only after the third round of testing.",
      right: "Only after the third round of testing did we understand what the toolbar cost blind users.",
    },
    registers: ["work"],
    topics: ["tutor-inversion"],
    emphasis: true,
    goal: "emphatic",
  },
  {
    id: "inversion-so-such",
    category: "grammar",
    title: "\u0418\u043d\u0432\u0435\u0440\u0441\u0438\u044f \u0441 \u201cso\u201d \u0438 \u201csuch\u201d",
    explanation:
      "\u0414\u0432\u0430 \u0440\u043e\u0434\u0441\u0442\u0432\u0435\u043d\u043d\u044b\u0445 \u043e\u0431\u043e\u0440\u043e\u0442\u0430: \u201cSo + \u043f\u0440\u0438\u043b\u0430\u0433\u0430\u0442\u0435\u043b\u044c\u043d\u043e\u0435 \u0438\u043b\u0438 \u043d\u0430\u0440\u0435\u0447\u0438\u0435 + be/do + \u043f\u043e\u0434\u043b\u0435\u0436\u0430\u0449\u0435\u0435 \u2026 that\u201d " +
      "\u0438 \u201cSuch + be + \u043f\u043e\u0434\u043b\u0435\u0436\u0430\u0449\u0435\u0435 \u2026 that\u201d. \u041e\u0431\u0430 \u0432\u044b\u043d\u043e\u0441\u044f\u0442 \u0432\u043f\u0435\u0440\u0451\u0434 \u0441\u0442\u0435\u043f\u0435\u043d\u044c \u043f\u0440\u0438\u0437\u043d\u0430\u043a\u0430 \u0438 \u043e\u0431\u0435\u0449\u0430\u044e\u0442 " +
      "\u0441\u043b\u0435\u0434\u0441\u0442\u0432\u0438\u0435 \u0447\u0435\u0440\u0435\u0437 that. \u0418\u043d\u0432\u0435\u0440\u0441\u0438\u044f \u043d\u0443\u0436\u043d\u0430 \u0442\u043e\u043b\u044c\u043a\u043e \u0434\u043b\u044f \u043d\u0430\u0436\u0438\u043c\u0430 \u0438 \u0442\u043e\u043b\u044c\u043a\u043e \u0432 \u043f\u0438\u0441\u044c\u043c\u0435\u043d\u043d\u043e\u043c \u0442\u0435\u043a\u0441\u0442\u0435.",
    plainNote:
      "\u041e\u0431\u044b\u0447\u043d\u044b\u0435 \u0432\u0430\u0440\u0438\u0430\u043d\u0442\u044b (\u201cThe gap was so wide that\u2026\u201d, \u201cThe demand was such that\u2026\u201d) \u0430\u0431\u0441\u043e\u043b\u044e\u0442\u043d\u043e " +
      "\u043f\u0440\u0430\u0432\u0438\u043b\u044c\u043d\u044b.",
    example: {
      wrong: "The gap between the two cohorts was so wide that we rewrote the sampling plan.",
      right: "So wide was the gap between the two cohorts that we rewrote the sampling plan.",
    },
    registers: ["work"],
    topics: ["tutor-inversion"],
    emphasis: true,
    goal: "emphatic",
  },
  {
    id: "inversion-no-sooner-hardly",
    category: "grammar",
    title: "\u201cNo sooner \u2026 than\u201d \u0438 \u201cHardly \u2026 when\u201d",
    explanation:
      "\u041e\u0431\u043e\u0440\u043e\u0442 \u043e\u043f\u0438\u0441\u044b\u0432\u0430\u0435\u0442 \u0432\u0442\u043e\u0440\u043e\u0435 \u0441\u043e\u0431\u044b\u0442\u0438\u0435, \u043d\u0430\u0441\u0442\u0443\u043f\u0438\u0432\u0448\u0435\u0435 \u0441\u0440\u0430\u0437\u0443 \u0437\u0430 \u043f\u0435\u0440\u0432\u044b\u043c. \u041f\u0435\u0440\u0432\u0430\u044f \u0447\u0430\u0441\u0442\u044c \u2014 past " +
      "perfect \u0441 \u0438\u043d\u0432\u0435\u0440\u0441\u0438\u0435\u0439 (no sooner had we published, hardly had we published), \u0432\u0442\u043e\u0440\u0430\u044f \u2014 " +
      "past simple. \u041f\u0430\u0440\u044b \u0441\u043e\u044e\u0437\u043e\u0432 \u0436\u0451\u0441\u0442\u043a\u0438\u0435: \u201cno sooner\u201d \u0441\u043e\u0447\u0435\u0442\u0430\u0435\u0442\u0441\u044f \u0442\u043e\u043b\u044c\u043a\u043e \u0441 \u201cthan\u201d, \u0430 \u201chardly\u201d \u0438 " +
      "\u201cscarcely\u201d \u2014 \u0441 \u201cwhen\u201d (\u0432 \u043f\u0438\u0441\u044c\u043c\u0435\u043d\u043d\u043e\u043c \u0442\u0435\u043a\u0441\u0442\u0435 \u0432\u0441\u0442\u0440\u0435\u0447\u0430\u0435\u0442\u0441\u044f \u0438 \u201cbefore\u201d, \u043d\u043e \u201cthan\u201d \u043f\u043e\u0441\u043b\u0435 \u043d\u0438\u0445 " +
      "\u043d\u0435\u0432\u043e\u0437\u043c\u043e\u0436\u043d\u043e); \u201cno sooner \u2026 when\u201d \u2014 \u0440\u0430\u0441\u043f\u0440\u043e\u0441\u0442\u0440\u0430\u043d\u0451\u043d\u043d\u0430\u044f \u043e\u0448\u0438\u0431\u043a\u0430.",
    plainNote:
      "\u041e\u0431\u044b\u0447\u043d\u043e\u0435 \u201cAs soon as we published\u2026\u201d \u2014 \u043d\u0435 \u043e\u0448\u0438\u0431\u043a\u0430, \u0430 \u043d\u0435\u0439\u0442\u0440\u0430\u043b\u044c\u043d\u044b\u0439 \u0432\u0430\u0440\u0438\u0430\u043d\u0442 \u0442\u043e\u0433\u043e \u0436\u0435 \u0441\u043c\u044b\u0441\u043b\u0430.",
    example: {
      wrong: "As soon as we published the accessibility audit, the support queue doubled.",
      right: "No sooner had we published the accessibility audit than the support queue doubled.",
    },
    registers: ["work"],
    topics: ["tutor-inversion"],
    emphasis: true,
    goal: "emphatic",
  },
  {
    id: "inversion-little",
    category: "grammar",
    title: "\u0418\u043d\u0432\u0435\u0440\u0441\u0438\u044f \u043f\u043e\u0441\u043b\u0435 \u201clittle\u201d",
    explanation:
      "\u201cLittle\u201d \u0432 \u043d\u0430\u0447\u0430\u043b\u0435 \u043f\u0440\u0435\u0434\u043b\u043e\u0436\u0435\u043d\u0438\u044f \u0437\u043d\u0430\u0447\u0438\u0442 \u043d\u0435 \u00ab\u043c\u0430\u043b\u043e\u00bb, \u0430 \u00ab\u0441\u043e\u0432\u0441\u0435\u043c \u043d\u0435 \u043f\u043e\u0434\u043e\u0437\u0440\u0435\u0432\u0430\u043b\u00bb \u0438 \u0440\u0430\u0431\u043e\u0442\u0430\u0435\u0442 \u0441 " +
      "\u0443\u0437\u043a\u0438\u043c \u043a\u0440\u0443\u0433\u043e\u043c \u0433\u043b\u0430\u0433\u043e\u043b\u043e\u0432: know, realise, think, suspect, imagine, dream. \u0414\u0430\u043b\u044c\u0448\u0435 \u0438\u0434\u0451\u0442 " +
      "\u0438\u043d\u0432\u0435\u0440\u0441\u0438\u044f: little did we realise, little did she know. \u041f\u043e\u0440\u044f\u0434\u043e\u043a \u043f\u0440\u0438 \u044d\u0442\u043e\u043c \u0432\u043e\u043f\u0440\u043e\u0441\u043d\u044b\u0439: \u0432 " +
      "\u043f\u0440\u043e\u0441\u0442\u043e\u043c \u043f\u0440\u043e\u0448\u0435\u0434\u0448\u0435\u043c \u043f\u043e\u044f\u0432\u043b\u044f\u0435\u0442\u0441\u044f did, \u0430 \u0441\u043c\u044b\u0441\u043b\u043e\u0432\u043e\u0439 \u0433\u043b\u0430\u0433\u043e\u043b \u0432\u043e\u0437\u0432\u0440\u0430\u0449\u0430\u0435\u0442\u0441\u044f \u0432 \u043d\u0430\u0447\u0430\u043b\u044c\u043d\u0443\u044e \u0444\u043e\u0440\u043c\u0443 \u2014 " +
      "realise, \u043d\u0435 realised. \u0422\u0430\u043a \u0443\u0441\u0442\u0440\u043e\u0435\u043d \u043b\u044e\u0431\u043e\u0439 \u0432\u044b\u043d\u043e\u0441 \u0441 \u043e\u0442\u0440\u0438\u0446\u0430\u0442\u0435\u043b\u044c\u043d\u044b\u043c \u0438\u043b\u0438 \u043e\u0433\u0440\u0430\u043d\u0438\u0447\u0438\u0442\u0435\u043b\u044c\u043d\u044b\u043c " +
      "\u0441\u043c\u044b\u0441\u043b\u043e\u043c; \u0432\u044b\u043d\u043e\u0441 \u043e\u0431\u0441\u0442\u043e\u044f\u0442\u0435\u043b\u044c\u0441\u0442\u0432\u0430 \u043c\u0435\u0441\u0442\u0430 (\u201cDown the corridor ran the volunteers\u201d) \u043d\u0430\u043e\u0431\u043e\u0440\u043e\u0442 " +
      "\u043e\u0431\u0445\u043e\u0434\u0438\u0442\u0441\u044f \u0431\u0435\u0437 do. \u041f\u0440\u0438\u0451\u043c \u043f\u043e\u0432\u0435\u0441\u0442\u0432\u043e\u0432\u0430\u0442\u0435\u043b\u044c\u043d\u044b\u0439: \u043e\u043d \u043e\u0431\u0435\u0449\u0430\u0435\u0442, \u0447\u0442\u043e \u0434\u0430\u043b\u044c\u0448\u0435 \u0431\u0443\u0434\u0435\u0442 \u043e\u0442\u043a\u0440\u044b\u0442\u0438\u0435.",
    plainNote: "\u0412\u0430\u0440\u0438\u0430\u043d\u0442 \u201cWe did not realise\u2026\u201d \u0442\u043e\u0436\u0435 \u0432\u0435\u0440\u0435\u043d: \u043e\u043d \u043f\u0440\u043e\u0441\u0442\u043e \u043d\u0438\u0447\u0435\u0433\u043e \u043d\u0435 \u043e\u0431\u0435\u0449\u0430\u0435\u0442.",
    example: {
      wrong: "We did not realise at the time how much the pilot would change the funding model.",
      right: "Little did we realise at the time how much the pilot would change the funding model.",
    },
    registers: ["work"],
    topics: ["tutor-inversion"],
    emphasis: true,
    goal: "emphatic",
  },
  {
    id: "inversion-second-clause",
    category: "grammar",
    title: "\u0418\u043d\u0432\u0435\u0440\u0441\u0438\u044f \u0432\u043e \u0432\u0442\u043e\u0440\u043e\u0439 \u0447\u0430\u0441\u0442\u0438: \u201cnot until\u201d, \u201conly when\u201d",
    explanation:
      "\u041a\u043e\u0433\u0434\u0430 \u0432 \u043d\u0430\u0447\u0430\u043b\u043e \u0432\u044b\u043d\u0435\u0441\u0435\u043d\u043e \u043d\u0435 \u043d\u0430\u0440\u0435\u0447\u0438\u0435, \u0430 \u0446\u0435\u043b\u043e\u0435 \u043f\u0440\u0438\u0434\u0430\u0442\u043e\u0447\u043d\u043e\u0435 \u2014 not until the grant closed, " +
      "only when we ran the interviews, only if the board agrees, only after the audit \u2014 \u0441\u0430\u043c\u043e " +
      "\u043f\u0440\u0438\u0434\u0430\u0442\u043e\u0447\u043d\u043e\u0435 \u0441\u043e\u0445\u0440\u0430\u043d\u044f\u0435\u0442 \u043e\u0431\u044b\u0447\u043d\u044b\u0439 \u043f\u043e\u0440\u044f\u0434\u043e\u043a \u0441\u043b\u043e\u0432, \u0430 \u0438\u043d\u0432\u0435\u0440\u0441\u0438\u044f \u043f\u0430\u0434\u0430\u0435\u0442 \u043d\u0430 \u0433\u043b\u0430\u0432\u043d\u043e\u0435 \u043f\u0440\u0435\u0434\u043b\u043e\u0436\u0435\u043d\u0438\u0435, " +
      "\u0438\u0434\u0443\u0449\u0435\u0435 \u0441\u043b\u0435\u0434\u043e\u043c. \u0422\u0430\u043c \u0434\u0435\u0439\u0441\u0442\u0432\u0443\u0435\u0442 \u0432\u043e\u043f\u0440\u043e\u0441\u043d\u044b\u0439 \u043f\u043e\u0440\u044f\u0434\u043e\u043a, \u0438, \u0435\u0441\u043b\u0438 \u0441\u0432\u043e\u0435\u0433\u043e \u0432\u0441\u043f\u043e\u043c\u043e\u0433\u0430\u0442\u0435\u043b\u044c\u043d\u043e\u0433\u043e " +
      "\u0433\u043b\u0430\u0433\u043e\u043b\u0430 \u043d\u0435\u0442, \u043f\u043e\u044f\u0432\u043b\u044f\u0435\u0442\u0441\u044f do: \u201cdid we see\u201d, \u0430 \u043d\u0435 \u201cwe did see\u201d. \u042d\u0442\u043e \u0433\u043b\u0430\u0432\u043d\u0430\u044f \u043b\u043e\u0432\u0443\u0448\u043a\u0430 " +
      "\u043a\u043e\u043d\u0441\u0442\u0440\u0443\u043a\u0446\u0438\u0438: \u043f\u0435\u0440\u0435\u0441\u0442\u0430\u0432\u043b\u044f\u0442\u044c \u0441\u043b\u043e\u0432\u0430 \u0445\u043e\u0447\u0435\u0442\u0441\u044f \u0432 \u043f\u0435\u0440\u0432\u043e\u0439 " +
      "\u0447\u0430\u0441\u0442\u0438, \u0430 \u043d\u0443\u0436\u043d\u043e \u0432\u043e \u0432\u0442\u043e\u0440\u043e\u0439: \u201cOnly when did we run the interviews, we saw\u2026\u201d \u043d\u0435\u0432\u0435\u0440\u043d\u043e. " +
      "\u0411\u0435\u0440\u0443\u0442 \u0435\u0451 \u0440\u0430\u0434\u0438 \u0442\u043e\u0433\u043e, \u0447\u0442\u043e\u0431\u044b \u0432\u044b\u043d\u0435\u0441\u0442\u0438 \u0443\u0441\u043b\u043e\u0432\u0438\u0435 \u0432\u043f\u0435\u0440\u0451\u0434 \u0438 \u043f\u043e\u0434\u0447\u0435\u0440\u043a\u043d\u0443\u0442\u044c \u00ab\u0438 \u043d\u0435 \u0440\u0430\u043d\u044c\u0448\u0435\u00bb: " +
      "\u043e\u0431\u044b\u0447\u043d\u043e\u0435 \u043f\u0440\u0435\u0434\u043b\u043e\u0436\u0435\u043d\u0438\u0435 \u0441 only \u0432\u043d\u0443\u0442\u0440\u0438 (\u201cWe only saw \u2026 when we ran\u2026\u201d) \u044d\u0442\u043e\u0433\u043e \u043d\u0435 \u0434\u0435\u043b\u0430\u0435\u0442.",
    example: {
      wrong: "We only saw how the survey had been misread when we ran the interviews in British Sign Language.",
      right: "Only when we ran the interviews in British Sign Language did we see how the survey had been misread.",
    },
    registers: ["work"],
    topics: ["tutor-inversion"],
    emphasis: true,
    goal: "emphatic",
  },
  {
    id: "cleft-what-all",
    category: "grammar",
    title: "\u0420\u0430\u0441\u0449\u0435\u043f\u043b\u0435\u043d\u0438\u0435 \u0447\u0435\u0440\u0435\u0437 \u201cwhat\u201d \u0438 \u201call\u201d",
    explanation:
      "\u041a\u043e\u043d\u0441\u0442\u0440\u0443\u043a\u0446\u0438\u044f \u201cWhat + \u043f\u0440\u0438\u0434\u0430\u0442\u043e\u0447\u043d\u043e\u0435 + be + \u0432\u044b\u0434\u0435\u043b\u044f\u0435\u043c\u0430\u044f \u0447\u0430\u0441\u0442\u044c\u201d \u043f\u0435\u0440\u0435\u043d\u043e\u0441\u0438\u0442 \u0444\u043e\u043a\u0443\u0441 \u043d\u0430 \u0442\u043e, \u0447\u0442\u043e " +
      "\u0441\u0442\u043e\u0438\u0442 \u043f\u043e\u0441\u043b\u0435 be: What the panel wanted was a single number. \u0421 \u201call\u201d \u0434\u043e\u0431\u0430\u0432\u043b\u044f\u0435\u0442\u0441\u044f \u043e\u0442\u0442\u0435\u043d\u043e\u043a " +
      "\u00ab\u0442\u043e\u043b\u044c\u043a\u043e \u044d\u0442\u043e \u0438 \u043d\u0438\u0447\u0435\u0433\u043e \u0431\u043e\u043b\u044c\u0448\u0435\u00bb: All we need is one more interview. \u0420\u0430\u0441\u0449\u0435\u043f\u043b\u0435\u043d\u0438\u0435 \u043d\u0443\u0436\u043d\u043e, " +
      "\u0447\u0442\u043e\u0431\u044b \u0437\u0430\u0434\u0430\u0442\u044c \u043a\u043e\u043d\u0442\u0440\u0430\u0441\u0442 \u0438\u043b\u0438 \u043e\u0442\u0432\u0435\u0442\u0438\u0442\u044c \u043d\u0430 \u043d\u0435\u0432\u044b\u0441\u043a\u0430\u0437\u0430\u043d\u043d\u044b\u0439 \u0432\u043e\u043f\u0440\u043e\u0441. \u0423 \u0440\u0443\u0441\u0441\u043a\u043e\u0433\u043e \u0435\u0441\u0442\u044c \u043f\u043e\u0445\u043e\u0436\u0438\u0439 " +
      "\u043e\u0431\u043e\u0440\u043e\u0442 (\u00ab\u0427\u0435\u0433\u043e \u043e\u043d\u0438 \u0445\u043e\u0442\u0435\u043b\u0438, \u0442\u0430\u043a \u044d\u0442\u043e\u2026\u00bb), \u043d\u043e \u0432 \u0430\u043d\u0433\u043b\u0438\u0439\u0441\u043a\u043e\u043c \u043f\u0438\u0441\u044c\u043c\u0435 \u043e\u043d \u0432\u0441\u0442\u0440\u0435\u0447\u0430\u0435\u0442\u0441\u044f \u0437\u0430\u043c\u0435\u0442\u043d\u043e " +
      "\u0447\u0430\u0449\u0435.",
    plainNote: "\u041e\u0431\u044b\u0447\u043d\u043e\u0435 \u043f\u0440\u0435\u0434\u043b\u043e\u0436\u0435\u043d\u0438\u0435 \u043f\u0440\u0438 \u044d\u0442\u043e\u043c \u043d\u0435 \u0445\u0443\u0436\u0435 \u043f\u043e \u0433\u0440\u0430\u043c\u043c\u0430\u0442\u0438\u043a\u0435.",
    example: {
      wrong: "The panel wanted a single number for social return.",
      right: "What the panel wanted was a single number for social return.",
    },
    registers: ["work"],
    topics: ["tutor-cleft"],
    emphasis: true,
    goal: "emphatic",
  },
  {
    id: "cleft-what-happened",
    category: "grammar",
    title: "\u0420\u0430\u0441\u0449\u0435\u043f\u043b\u0435\u043d\u0438\u0435 \u0447\u0435\u0440\u0435\u0437 \u201cwhat happens is\u201d",
    explanation:
      "\u0412\u0430\u0440\u0438\u0430\u043d\u0442 \u0440\u0430\u0441\u0449\u0435\u043f\u043b\u0435\u043d\u0438\u044f, \u043a\u043e\u0442\u043e\u0440\u044b\u0439 \u0432\u044b\u0434\u0435\u043b\u044f\u0435\u0442 \u043d\u0435 \u043e\u0442\u0434\u0435\u043b\u044c\u043d\u043e\u0435 \u0441\u043b\u043e\u0432\u043e, \u0430 \u0446\u0435\u043b\u043e\u0435 \u0441\u043e\u0431\u044b\u0442\u0438\u0435: \u201cWhat " +
      "happens is (that) \u2026\u201d \u0434\u043b\u044f \u043d\u0430\u0441\u0442\u043e\u044f\u0449\u0435\u0433\u043e \u0438 \u201cWhat happened was (that) \u2026\u201d \u0434\u043b\u044f \u043f\u0440\u043e\u0448\u043b\u043e\u0433\u043e. " +
      "\u041e\u0431\u043e\u0440\u043e\u0442 \u0441\u0438\u0433\u043d\u0430\u043b\u0438\u0442, \u0447\u0442\u043e \u0441\u0435\u0439\u0447\u0430\u0441 \u0431\u0443\u0434\u0435\u0442 \u043e\u0431\u044a\u044f\u0441\u043d\u0435\u043d\u0438\u0435 \u043c\u0435\u0445\u0430\u043d\u0438\u043a\u0438, \u0438 \u043f\u043e\u0442\u043e\u043c\u0443 \u0443\u0434\u043e\u0431\u0435\u043d \u0432 \u043e\u043f\u0438\u0441\u0430\u043d\u0438\u0438 " +
      "\u043f\u043e\u043b\u044c\u0437\u043e\u0432\u0430\u0442\u0435\u043b\u044c\u0441\u043a\u0438\u0445 \u0441\u0446\u0435\u043d\u0430\u0440\u0438\u0435\u0432 \u0438 \u0432 \u0443\u0441\u0442\u043d\u043e\u043c \u0440\u0430\u0437\u0431\u043e\u0440\u0435 \u043a\u0435\u0439\u0441\u0430.",

  {
    id: "cleft-it-was",
    category: "grammar",
    title: "\u0420\u0430\u0441\u0449\u0435\u043f\u043b\u0435\u043d\u0438\u0435 \u0447\u0435\u0440\u0435\u0437 \u201cIt is / It was\u201d",
    explanation:
      "\u201cIt is / It was + \u0432\u044b\u0434\u0435\u043b\u044f\u0435\u043c\u0430\u044f \u0447\u0430\u0441\u0442\u044c + \u043f\u0440\u0438\u0434\u0430\u0442\u043e\u0447\u043d\u043e\u0435\u201d \u043f\u043e\u0437\u0432\u043e\u043b\u044f\u0435\u0442 \u043f\u043e\u0434\u0447\u0435\u0440\u043a\u043d\u0443\u0442\u044c \u043f\u043e\u0447\u0442\u0438 \u043b\u044e\u0431\u043e\u0439 " +
      "\u0447\u043b\u0435\u043d \u043f\u0440\u0435\u0434\u043b\u043e\u0436\u0435\u043d\u0438\u044f, \u043a\u0440\u043e\u043c\u0435 \u0441\u043a\u0430\u0437\u0443\u0435\u043c\u043e\u0433\u043e: \u043f\u043e\u0434\u043b\u0435\u0436\u0430\u0449\u0435\u0435, \u0434\u043e\u043f\u043e\u043b\u043d\u0435\u043d\u0438\u0435, \u043e\u0431\u0441\u0442\u043e\u044f\u0442\u0435\u043b\u044c\u0441\u0442\u0432\u043e. \u041e \u043b\u044e\u0434\u044f\u0445 \u2014 " +
      "who \u0438\u043b\u0438 that; \u0435\u0441\u043b\u0438 \u0432\u044b\u0434\u0435\u043b\u0435\u043d\u043e \u0441\u0443\u0449\u0435\u0441\u0442\u0432\u0438\u0442\u0435\u043b\u044c\u043d\u043e\u0435 \u2014 that \u0438\u043b\u0438 which; \u0430 \u0435\u0441\u043b\u0438 \u0432\u044b\u0434\u0435\u043b\u0435\u043d\u043e " +
      "\u043e\u0431\u0441\u0442\u043e\u044f\u0442\u0435\u043b\u044c\u0441\u0442\u0432\u043e, \u0440\u0430\u0431\u043e\u0442\u0430\u0435\u0442 \u0442\u043e\u043b\u044c\u043a\u043e that: \u201cIt was then that we came across it\u201d, \u043d\u043e \u043d\u0435 " +
      "\u201cIt was then which\u2026\u201d. " +
      "\u0412\u0441\u0451, \u0447\u0442\u043e \u043d\u0435 \u0432\u044b\u0434\u0435\u043b\u044f\u0435\u0442\u0441\u044f, \u0443\u0445\u043e\u0434\u0438\u0442 \u0432 \u043f\u0440\u0438\u0434\u0430\u0442\u043e\u0447\u043d\u043e\u0435. \u041e\u0431\u043e\u0440\u043e\u0442 \u043e\u0441\u043e\u0431\u0435\u043d\u043d\u043e \u0445\u043e\u0440\u043e\u0448, \u043a\u043e\u0433\u0434\u0430 \u043d\u0443\u0436\u043d\u043e " +
      "\u043f\u043e\u043f\u0440\u0430\u0432\u0438\u0442\u044c \u0447\u0443\u0436\u043e\u0435 \u043f\u043e\u043d\u0438\u043c\u0430\u043d\u0438\u0435, \u043f\u043e\u044d\u0442\u043e\u043c\u0443 \u0440\u044f\u0434\u043e\u043c \u0447\u0430\u0441\u0442\u043e \u0441\u0442\u043e\u0438\u0442 \u201cnot\u201d, \u0438 \u0435\u0433\u043e \u043c\u043e\u0436\u043d\u043e \u043f\u043e\u0441\u0442\u0430\u0432\u0438\u0442\u044c \u043a\u0430\u043a " +
      "\u0441\u0440\u0430\u0437\u0443 \u0437\u0430 \u0432\u044b\u0434\u0435\u043b\u0435\u043d\u043d\u043e\u0439 \u0447\u0430\u0441\u0442\u044c\u044e, \u0442\u0430\u043a \u0438 \u0432 \u043a\u043e\u043d\u0446\u0435: It was the procurement rules, not the " +
      "developers, that blocked the change / It was the procurement rules that blocked the " +
      "change, not the developers.",
    plainNote:
      "\u041e\u0431\u0430 \u0432\u0430\u0440\u0438\u0430\u043d\u0442\u0430 \u0432\u0435\u0440\u043d\u044b; \u0440\u0430\u0441\u0449\u0435\u043f\u043b\u0435\u043d\u0438\u0435 \u2014 \u044d\u0442\u043e \u0438\u043d\u0441\u0442\u0440\u0443\u043c\u0435\u043d\u0442 \u0430\u043a\u0446\u0435\u043d\u0442\u0430, \u0430 \u043d\u0435 \u0438\u0441\u043f\u0440\u0430\u0432\u043b\u0435\u043d\u0438\u0435 \u043e\u0448\u0438\u0431\u043a\u0438. " +
      "\u041a\u043e\u0433\u0434\u0430 \u0432\u044b\u0434\u0435\u043b\u0435\u043d\u043e \u0441\u0443\u0449\u0435\u0441\u0442\u0432\u0438\u0442\u0435\u043b\u044c\u043d\u043e\u0435, \u201cthat\u201d \u0438 \u201cwhich\u201d \u043e\u0431\u0430 \u043d\u043e\u0440\u043c\u0430\u043b\u044c\u043d\u044b: \u201cIt was the wording " +
      "that produced it\u201d \u0438 \u201c\u2026which produced it\u201d, \u043f\u0440\u043e\u0441\u0442\u043e that \u043f\u0440\u0438\u0432\u044b\u0447\u043d\u0435\u0435.",
    example: {

  {
    id: "fronting-though-as",
    category: "grammar",
    title: "\u0412\u044b\u043d\u043e\u0441 \u043f\u0440\u0438\u043b\u0430\u0433\u0430\u0442\u0435\u043b\u044c\u043d\u043e\u0433\u043e \u0432\u043f\u0435\u0440\u0451\u0434: \u201c\u2026 though\u201d \u0438 \u201c\u2026 as\u201d",
    explanation:
      "\u0423\u0441\u0442\u0443\u043f\u043a\u0430 \u043c\u043e\u0436\u0435\u0442 \u0441\u0442\u0440\u043e\u0438\u0442\u044c\u0441\u044f \u043d\u0435 \u0447\u0435\u0440\u0435\u0437 although, \u0430 \u0432\u044b\u043d\u043e\u0441\u043e\u043c \u043f\u0440\u0438\u043b\u0430\u0433\u0430\u0442\u0435\u043b\u044c\u043d\u043e\u0433\u043e \u0438\u043b\u0438 \u043d\u0430\u0440\u0435\u0447\u0438\u044f \u0432 " +
      "\u043d\u0430\u0447\u0430\u043b\u043e: \u201cSmall though the sample was, \u2026\u201d, \u201cHard as we tried, \u2026\u201d. \u041f\u043e\u0441\u043b\u0435 \u0432\u044b\u043d\u0435\u0441\u0435\u043d\u043d\u043e\u0433\u043e " +
      "\u0441\u043b\u043e\u0432\u0430 \u0438\u0434\u0451\u0442 though \u0438\u043b\u0438 as, \u0437\u0430\u0442\u0435\u043c \u043f\u043e\u0434\u043b\u0435\u0436\u0430\u0449\u0435\u0435 \u0441\u043e \u0441\u043a\u0430\u0437\u0443\u0435\u043c\u044b\u043c. \u0421 \u201cas\u201d \u043e\u0431\u043e\u0440\u043e\u0442 \u0438\u043d\u043e\u0433\u0434\u0430 \u0434\u0432\u043e\u0438\u0442\u0441\u044f " +
      "\u0441 \u043f\u0440\u0438\u0447\u0438\u043d\u043d\u044b\u043c \u0437\u043d\u0430\u0447\u0435\u043d\u0438\u0435\u043c as, \u043f\u043e\u044d\u0442\u043e\u043c\u0443 \u0432 \u043d\u0435\u043e\u0434\u043d\u043e\u0437\u043d\u0430\u0447\u043d\u043e\u043c \u043a\u043e\u043d\u0442\u0435\u043a\u0441\u0442\u0435 \u0431\u0435\u0437\u043e\u043f\u0430\u0441\u043d\u0435\u0435 though. \u0412\u044b\u043d\u043e\u0441 " +
      "\u0437\u0432\u0443\u0447\u0438\u0442 \u043b\u0438\u0442\u0435\u0440\u0430\u0442\u0443\u0440\u043d\u043e \u0438 \u0432 \u043f\u0435\u0440\u0435\u043f\u0438\u0441\u043a\u0435 \u0441\u043c\u043e\u0442\u0440\u0438\u0442\u0441\u044f \u043d\u0430\u0440\u043e\u0447\u0438\u0442\u043e.",
    plainNote: "\u0412\u0430\u0440\u0438\u0430\u043d\u0442 \u0441 although \u043d\u0438\u0447\u0435\u043c \u043d\u0435 \u0445\u0443\u0436\u0435 \u0433\u0440\u0430\u043c\u043c\u0430\u0442\u0438\u0447\u0435\u0441\u043a\u0438: \u043f\u0440\u043e\u0441\u0442\u043e \u043e\u043d \u043d\u0435\u0439\u0442\u0440\u0430\u043b\u0435\u043d.",

  {

      "\u0433\u0440\u0443\u043f\u043f\u043e\u0439, \u0438 \u0442\u043e\u0433\u0434\u0430 \u0437\u0430 \u043d\u0438\u043c \u0438\u0434\u0451\u0442 be, \u0430 \u0441\u043b\u0435\u0434\u043e\u043c \u043f\u043e\u0434\u043b\u0435\u0436\u0430\u0449\u0435\u0435: \u201cAttached to the same email was " +

  {

      "\u043f\u043e\u0440\u044f\u0434\u043e\u043a \u043e\u0441\u0442\u0430\u0451\u0442\u0441\u044f \u043e\u0431\u044b\u0447\u043d\u044b\u043c (\u201cDown the corridor they ran\u201d). \u0413\u043b\u0430\u0433\u043e\u043b \u043f\u0435\u0440\u0435\u0435\u0437\u0436\u0430\u0435\u0442 \u0432\u043f\u0435\u0440\u0451\u0434 " +
      "\u0446\u0435\u043b\u0438\u043a\u043e\u043c \u0438 \u0432 \u0441\u0432\u043e\u0435\u0439 \u043e\u0431\u044b\u0447\u043d\u043e\u0439 \u0444\u043e\u0440\u043c\u0435: \u201cInto the seminar room came the whole cohort\u201d, \u043d\u043e \u043d\u0435 " +
      "\u201cdid the whole cohort come\u201d. Do \u0437\u0434\u0435\u0441\u044c \u0432\u0437\u044f\u0442\u044c\u0441\u044f \u043d\u0435\u043e\u0442\u043a\u0443\u0434\u0430: \u0432\u0441\u043f\u043e\u043c\u043e\u0433\u0430\u0442\u0435\u043b\u044c\u043d\u043e\u0435 do \u043f\u043e\u044f\u0432\u043b\u044f\u0435\u0442\u0441\u044f " +
      "\u0442\u043e\u043b\u044c\u043a\u043e \u0432 \u0432\u043e\u043f\u0440\u043e\u0441\u0435, \u0432 \u043e\u0442\u0440\u0438\u0446\u0430\u043d\u0438\u0438 \u0438 \u0432 \u044d\u043c\u0444\u0430\u0442\u0438\u0447\u0435\u0441\u043a\u043e\u043c \u201cwe did ask\u201d. \u0421\u0431\u0438\u0432\u0430\u0435\u0442 \u0441\u043e\u0441\u0435\u0434\u043d\u044f\u044f " +
      "\u043a\u043e\u043d\u0441\u0442\u0440\u0443\u043a\u0446\u0438\u044f: \u043f\u043e\u0441\u043b\u0435 \u043e\u0442\u0440\u0438\u0446\u0430\u0442\u0435\u043b\u044c\u043d\u043e\u0433\u043e \u0438\u043b\u0438 \u043e\u0433\u0440\u0430\u043d\u0438\u0447\u0438\u0442\u0435\u043b\u044c\u043d\u043e\u0433\u043e \u043d\u0430\u0447\u0430\u043b\u0430 \u2014 never, rarely, " +
      "only then, little \u2014 do \u043a\u0430\u043a \u0440\u0430\u0437 \u043e\u0431\u044f\u0437\u0430\u0442\u0435\u043b\u044c\u043d\u043e: \u201cNever did we imagine\u2026\u201d, \u201cOnly then did " +
      "the pattern appear\u2026\u201d. \u041f\u0440\u0438\u0451\u043c \u0447\u0438\u0441\u0442\u043e " +
      "\u043f\u043e\u0432\u0435\u0441\u0442\u0432\u043e\u0432\u0430\u0442\u0435\u043b\u044c\u043d\u044b\u0439: \u043e\u043d \u043e\u0436\u0438\u0432\u043b\u044f\u0435\u0442 \u0441\u0446\u0435\u043d\u0443, \u043d\u043e \u0432 \u0434\u0435\u043b\u043e\u0432\u043e\u043c \u043f\u0438\u0441\u044c\u043c\u0435 \u043d\u0435\u0443\u043c\u0435\u0441\u0442\u0435\u043d.",

  {
    id: "article-generalization-the",
    category: "grammar",
    title: "\u201cThe\u201d \u0441 \u0435\u0434\u0438\u043d\u0441\u0442\u0432\u0435\u043d\u043d\u044b\u043c \u0447\u0438\u0441\u043b\u043e\u043c \u0434\u043b\u044f \u0446\u0435\u043b\u043e\u0433\u043e \u043a\u043b\u0430\u0441\u0441\u0430",
    explanation:
      "\u201cThe\u201d \u0441 \u0441\u0443\u0449\u0435\u0441\u0442\u0432\u0438\u0442\u0435\u043b\u044c\u043d\u044b\u043c \u0432 \u0435\u0434\u0438\u043d\u0441\u0442\u0432\u0435\u043d\u043d\u043e\u043c \u0447\u0438\u0441\u043b\u0435 \u043c\u043e\u0436\u0435\u0442 \u043e\u0431\u043e\u0437\u043d\u0430\u0447\u0430\u0442\u044c \u0432\u0435\u0441\u044c \u043a\u043b\u0430\u0441\u0441 \u0446\u0435\u043b\u0438\u043a\u043e\u043c: the " +
      "smartphone, the wheelchair, the novel, the honeybee. \u0422\u0430\u043a \u0433\u043e\u0432\u043e\u0440\u044f\u0442 \u043e\u0431 \u0438\u0437\u043e\u0431\u0440\u0435\u0442\u0435\u043d\u0438\u044f\u0445, " +
      "\u0438\u043d\u0441\u0442\u0440\u0443\u043c\u0435\u043d\u0442\u0430\u0445, \u0432\u0438\u0434\u0430\u0445 \u0436\u0438\u0432\u043e\u0442\u043d\u044b\u0445 \u0438 \u0436\u0430\u043d\u0440\u0430\u0445, \u0438 \u0437\u0432\u0443\u0447\u0438\u0442 \u044d\u0442\u043e \u0444\u043e\u0440\u043c\u0430\u043b\u044c\u043d\u043e \u0438 \u043e\u0442\u0432\u043b\u0435\u0447\u0451\u043d\u043d\u043e: \u0442\u0438\u043f\u0438\u0447\u043d\u044b\u0439 " +
      "\u0430\u043a\u0430\u0434\u0435\u043c\u0438\u0447\u0435\u0441\u043a\u0438\u0439 \u0445\u043e\u0434. \u0421\u044e\u0434\u0430 \u0436\u0435 \u043e\u0442\u043d\u043e\u0441\u0438\u0442\u0441\u044f \u201cthe\u201d \u0441 \u043f\u0440\u0438\u043b\u0430\u0433\u0430\u0442\u0435\u043b\u044c\u043d\u044b\u043c \u0434\u043b\u044f \u0441\u043e\u0446\u0438\u0430\u043b\u044c\u043d\u043e\u0439 \u0433\u0440\u0443\u043f\u043f\u044b: the " +
      "elderly, the visually impaired, the unemployed (\u0433\u043b\u0430\u0433\u043e\u043b \u043f\u0440\u0438 \u044d\u0442\u043e\u043c \u0432\u043e \u043c\u043d\u043e\u0436\u0435\u0441\u0442\u0432\u0435\u043d\u043d\u043e\u043c " +
      "\u0447\u0438\u0441\u043b\u0435).",
    plainNote:
      "\u041c\u043d\u043e\u0436\u0435\u0441\u0442\u0432\u0435\u043d\u043d\u043e\u0435 \u0431\u0435\u0437 \u0430\u0440\u0442\u0438\u043a\u043b\u044f \u0442\u043e\u0436\u0435 \u0432\u0435\u0440\u043d\u043e; \u0432\u044b\u0431\u043e\u0440 \u2014 \u0432\u043e\u043f\u0440\u043e\u0441 \u0440\u0435\u0433\u0438\u0441\u0442\u0440\u0430, \u0430 \u043d\u0435 \u043f\u0440\u0430\u0432\u0438\u043b\u044c\u043d\u043e\u0441\u0442\u0438.",
    example: {

    topics: ["tutor-articles"],
    emphasis: true,
    goal: "formal",

  {
    id: "article-generalization-a",
    category: "grammar",
    title: "\u201cA / an\u201d \u043a\u0430\u043a \u043e\u0434\u0438\u043d \u043f\u0440\u0435\u0434\u0441\u0442\u0430\u0432\u0438\u0442\u0435\u043b\u044c \u043a\u043b\u0430\u0441\u0441\u0430",
    explanation:
      "\u201cA / an\u201d \u043f\u0440\u0438 \u043e\u0431\u043e\u0431\u0449\u0435\u043d\u0438\u0438 \u0437\u043d\u0430\u0447\u0438\u0442 \u00ab\u043b\u044e\u0431\u043e\u0439 \u043e\u0442\u0434\u0435\u043b\u044c\u043d\u043e \u0432\u0437\u044f\u0442\u044b\u0439 \u043f\u0440\u0435\u0434\u0441\u0442\u0430\u0432\u0438\u0442\u0435\u043b\u044c\u00bb: \u201cA " +
      "researcher has to declare a conflict of interest\u201d. \u041d\u043e \u0438\u043c\u0435\u043d\u043d\u043e \u043f\u043e\u0442\u043e\u043c\u0443, \u0447\u0442\u043e \u0440\u0435\u0447\u044c " +
      "\u043e\u0431 \u043e\u0434\u043d\u043e\u043c \u044d\u043a\u0437\u0435\u043c\u043f\u043b\u044f\u0440\u0435, \u044d\u0442\u043e\u0442 \u0430\u0440\u0442\u0438\u043a\u043b\u044c \u043d\u0435 \u0433\u043e\u0434\u0438\u0442\u0441\u044f \u0434\u043b\u044f \u0443\u0442\u0432\u0435\u0440\u0436\u0434\u0435\u043d\u0438\u0439 \u043e \u0433\u0440\u0443\u043f\u043f\u0435, \u0432\u0437\u044f\u0442\u043e\u0439 " +
      "\u0446\u0435\u043b\u0438\u043a\u043e\u043c, \u2014 \u043e \u0434\u043e\u043b\u044f\u0445, \u0447\u0438\u0441\u043b\u0435\u043d\u043d\u043e\u0441\u0442\u0438, \u0440\u0430\u0441\u043f\u0440\u043e\u0441\u0442\u0440\u0430\u043d\u0451\u043d\u043d\u043e\u0441\u0442\u0438, \u0432\u044b\u043c\u0438\u0440\u0430\u043d\u0438\u0438. \u041d\u0435\u043b\u044c\u0437\u044f \u0441\u043a\u0430\u0437\u0430\u0442\u044c " +
      "\u201cA wheelchair user is twelve per cent of our users\u201d: \u0437\u0434\u0435\u0441\u044c \u043d\u0443\u0436\u043d\u043e " +
      "\u043c\u043d\u043e\u0436\u0435\u0441\u0442\u0432\u0435\u043d\u043d\u043e\u0435 \u0447\u0438\u0441\u043b\u043e. \u041e\u0431\u043e\u0431\u0449\u0430\u044e\u0449\u0435\u0435 \u201cthe\u201d \u0442\u043e\u0436\u0435 \u043d\u0435 \u0432\u044b\u0440\u0443\u0447\u0430\u0435\u0442: \u201cThe wheelchair " +
      "user is twelve per cent\u2026\u201d \u0442\u0430\u043a \u0436\u0435 \u043d\u0435\u0432\u0435\u0440\u043d\u043e, \u043f\u043e\u0442\u043e\u043c\u0443 \u0447\u0442\u043e \u0434\u043e\u043b\u044f \u0441\u0447\u0438\u0442\u0430\u0435\u0442\u0441\u044f \u043f\u043e \u043b\u044e\u0434\u044f\u043c, " +
      "\u0430 \u043d\u0435 \u043f\u043e \u043a\u043b\u0430\u0441\u0441\u0443 \u043a\u0430\u043a \u0446\u0435\u043b\u043e\u043c\u0443. \u042d\u0442\u043e \u0443\u0436\u0435 \u043d\u0435 \u043e\u0442\u0442\u0435\u043d\u043e\u043a, \u0430 \u043e\u0448\u0438\u0431\u043a\u0430.",

  {
    id: "article-singular-needs-determiner",
    category: "grammar",
    title: "\u0418\u0441\u0447\u0438\u0441\u043b\u044f\u0435\u043c\u043e\u0435 \u0432 \u0435\u0434\u0438\u043d\u0441\u0442\u0432\u0435\u043d\u043d\u043e\u043c \u0447\u0438\u0441\u043b\u0435 \u0442\u0440\u0435\u0431\u0443\u0435\u0442 \u043e\u043f\u0440\u0435\u0434\u0435\u043b\u0438\u0442\u0435\u043b\u044f",
    explanation:
      "\u0418\u0441\u0447\u0438\u0441\u043b\u044f\u0435\u043c\u043e\u0435 \u0441\u0443\u0449\u0435\u0441\u0442\u0432\u0438\u0442\u0435\u043b\u044c\u043d\u043e\u0435 \u0432 \u0435\u0434\u0438\u043d\u0441\u0442\u0432\u0435\u043d\u043d\u043e\u043c \u0447\u0438\u0441\u043b\u0435 \u043d\u0435 \u043c\u043e\u0436\u0435\u0442 \u0441\u0442\u043e\u044f\u0442\u044c \u0433\u043e\u043b\u044b\u043c: \u043f\u0435\u0440\u0435\u0434 " +
      "\u043d\u0438\u043c \u043e\u0431\u044f\u0437\u0430\u0442\u0435\u043b\u0435\u043d \u043e\u043f\u0440\u0435\u0434\u0435\u043b\u0438\u0442\u0435\u043b\u044c: a, the, my, this, each, every. \u0418\u0441\u043a\u043b\u044e\u0447\u0435\u043d\u0438\u044f " +
      "\u043d\u0435\u043c\u043d\u043e\u0433\u043e\u0447\u0438\u0441\u043b\u0435\u043d\u043d\u044b \u0438 \u0437\u0430\u0443\u0447\u0438\u0432\u0430\u044e\u0442\u0441\u044f \u0441\u043f\u0438\u0441\u043a\u043e\u043c: \u043f\u0440\u0438\u0451\u043c\u044b \u043f\u0438\u0449\u0438 (before lunch, after " +
      "dinner), \u0442\u0440\u0430\u043d\u0441\u043f\u043e\u0440\u0442 \u0441 \u201cby\u201d (by train, by bus, by car) \u0438 \u0443\u0447\u0440\u0435\u0436\u0434\u0435\u043d\u0438\u044f \u0432 \u0438\u0445 " +
      "\u043f\u0440\u044f\u043c\u043e\u0439 \u0444\u0443\u043d\u043a\u0446\u0438\u0438 (at school, at university, in hospital, in prison, to church). " +
      "\u0420\u0430\u0437\u043d\u0438\u0446\u0430 \u0441\u043c\u044b\u0441\u043b\u043e\u0432\u0430\u044f: \u201cin hospital\u201d \u2014 \u043b\u0435\u0436\u0438\u0442 \u043a\u0430\u043a \u043f\u0430\u0446\u0438\u0435\u043d\u0442, \u201cin the hospital\u201d \u2014 " +
      "\u043d\u0430\u0445\u043e\u0434\u0438\u0442\u0441\u044f \u0432 \u0437\u0434\u0430\u043d\u0438\u0438.",
    example: {

    topics: ["tutor-articles"],

  {

    title: "\u201cThe\u201d \u0441 \u0434\u0435\u0441\u044f\u0442\u0438\u043b\u0435\u0442\u0438\u044f\u043c\u0438, \u0438\u043d\u0441\u0442\u0438\u0442\u0443\u0442\u0430\u043c\u0438 \u0438 \u0443\u043d\u0438\u043a\u0430\u043b\u044c\u043d\u044b\u043c\u0438 \u044f\u0432\u043b\u0435\u043d\u0438\u044f\u043c\u0438",
    explanation:
      "\u201cThe\u201d \u043e\u0431\u044f\u0437\u0430\u0442\u0435\u043b\u0435\u043d \u0441 \u0434\u0435\u0441\u044f\u0442\u0438\u043b\u0435\u0442\u0438\u044f\u043c\u0438 \u0438 \u0432\u0435\u043a\u0430\u043c\u0438 (the 1990s, the twentieth century), " +
      "\u0441 \u0443\u043d\u0438\u043a\u0430\u043b\u044c\u043d\u044b\u043c\u0438 \u043e\u0431\u044a\u0435\u043a\u0442\u0430\u043c\u0438 \u0438 \u0433\u043b\u043e\u0431\u0430\u043b\u044c\u043d\u044b\u043c\u0438 \u044f\u0432\u043b\u0435\u043d\u0438\u044f\u043c\u0438 (the environment, the internet, " +
      "the equator, the climate), \u0441 \u043d\u0430\u0446\u0438\u043e\u043d\u0430\u043b\u044c\u043d\u044b\u043c\u0438 \u0438\u043d\u0441\u0442\u0438\u0442\u0443\u0442\u0430\u043c\u0438 (the government, the " +
      "police, the NHS, the House of Commons) \u0438 \u0441\u043e \u0441\u0442\u0440\u0430\u043d\u0430\u043c\u0438, \u0447\u044c\u0451 \u043d\u0430\u0437\u0432\u0430\u043d\u0438\u0435 " +
      "\u043c\u043d\u043e\u0436\u0435\u0441\u0442\u0432\u0435\u043d\u043d\u043e\u0435 \u0438\u043b\u0438 \u0441\u043e\u0434\u0435\u0440\u0436\u0438\u0442 \u043d\u0430\u0440\u0438\u0446\u0430\u0442\u0435\u043b\u044c\u043d\u043e\u0435 \u0441\u043b\u043e\u0432\u043e (the UK, the Netherlands, the " +
      "United States). \u0412 \u0440\u0443\u0441\u0441\u043a\u043e\u043c \u0430\u0440\u0442\u0438\u043a\u043b\u0435\u0439 \u043d\u0435\u0442 \u0432\u043e\u0432\u0441\u0435, \u043f\u043e\u044d\u0442\u043e\u043c\u0443 \u0446\u0435\u043b\u044b\u0439 \u043f\u043b\u0430\u0441\u0442 \u0442\u0430\u043a\u0438\u0445 " +
      "\u0432\u044b\u0440\u0430\u0436\u0435\u043d\u0438\u0439 \u0442\u0435\u0440\u044f\u0435\u0442 \u201cthe\u201d \u043f\u0440\u0438 \u043f\u0435\u0440\u0435\u0432\u043e\u0434\u0435 \u0430\u0432\u0442\u043e\u043c\u0430\u0442\u0438\u0447\u0435\u0441\u043a\u0438.",
    example: {
      wrong: "In 1990s, disability policy in UK moved from charity to rights.",
      right: "In the 1990s, disability policy in the UK moved from charity to rights.",
    },
    registers: ["work"],
