function renderTypedCard(item, rule) {
  return (
    `<div class="card card-typed" data-mode="typed" data-item="${escapeHtml(item.id)}" data-rule="${escapeHtml(item.rule)}">` +
    `<p class="task">${taskLineHtml(rule, item)}</p>` +
    `<p class="sentence">${escapeHtml(brokenSentence(item))}</p>` +
    `<label class="answer-label" for="answer">\u0412\u0430\u0448 \u0432\u0430\u0440\u0438\u0430\u043d\u0442</label>` +
    // `autocapitalize` is on because an English sentence starts with a capital
    // and reaching for shift on every card is a tax. `autocorrect` and
    // `spellcheck` stay off: this app exists to catch her mistakes, and a
    // keyboard that repairs them first is answering the card for her.
    `<input type="text" id="answer" class="answer" autocomplete="off" autocapitalize="sentences"` +
    ` autocorrect="off" spellcheck="false" enterkeyhint="done">` +
    `<button type="button" id="check" class="check">\u041f\u0440\u043e\u0432\u0435\u0440\u0438\u0442\u044c</button>` +
    `</div>`
  );
}

function renderDiff(diff) {
  if (!Array.isArray(diff) || diff.length === 0) return "";
  const words = diff
    .map((d) => `<span class="diff-${escapeHtml(d.type)}">${escapeHtml(d.text)}</span>`)
    .join(" ");
  return `<p class="diff">${words}</p>`;
}

// Word keys for comparing two sentences as multisets: normalised, with the
// punctuation that travels with a word stripped, because a comma moving with a
// fronted phrase must not make the two sides look different.
function diffWordKey(text) {
  return normalizeText(text).replace(/^[^\p{L}\p{N}]+|[^\p{L}\p{N}]+$/gu, "");
}

function diffShape(diff) {
  let adds = 0;
  let dels = 0;
  for (const d of diff) {
    if (d.type === "add") adds += 1;
    else if (d.type === "del") dels += 1;
  }
  const segments = adds + dels;
  let shape = "complex";
  if (segments === 0) shape = "none";
  else if (dels === 0) shape = "insertion";
  else if (adds === 0) shape = "deletion";
  else if (adds === 1 && dels === 1) shape = "substitution";
  return { shape, segments };
}

// At and above this many changed segments a reordering stops reading as a
// sentence: the moved span and its replacement end up far enough apart that the
// unchanged words between them belong to both, and the line renders as a clause
// said twice. Below it \u2014 a comma, an apostrophe, a relocated article, a local
// inversion swap \u2014 the marked-up line is honest and useful.
const REORDER_LIMIT = 5;

// A word-level diff is the wrong instrument when the two sentences are the same
// words in a different order \u2014 which is exactly what fronting, inversion and
// clefting are. It interleaves them into a third sentence that neither side
// wrote and that reads as broken English, and under the plain-ok banner it
// contradicts the banner. Sorting the two word multisets is enough to spot it.
function isReordering(diff) {
  const before = [];
  const after = [];
  let changed = 0;
  for (const d of diff) {
    const key = diffWordKey(d.text);
    if (d.type === "same") {
      before.push(key);
      after.push(key);
    } else if (d.type === "del") {
      before.push(key);
      changed += 1;
    } else if (d.type === "add") {
      after.push(key);
      changed += 1;
    }
  }
  if (changed === 0 || before.length !== after.length) return false;
  before.sort();
  after.sort();
  return before.every((w, i) => w === after[i]);
}

// True when the learner simply wrote the plain version of an emphasis rule:
// the whole sentence in typed mode, the bare span in choice mode.
function isPlainVersion(rule, item, given) {
  if (given === undefined || given === null) return false;
  if (!rule || !rule.emphasis) return false;
  if (!item || item.forced) return false;
  const answer = normalizeText(given);
  if (answer.length === 0) return false;
  return answer === normalizeText(item.wrong) || answer === normalizeText(brokenSentence(item));
}

// The rule's own logged example, written once: the feedback panel wraps it, the
// rules list and the progress rows print it bare.
//
// Under an emphasis rule the pair is not right and wrong. `example.wrong` is the
// plain version, which several of these rules call correct in their own
// explanation two lines above, so a cross beside it contradicts the rule. The
// pair is marked as a contrast instead, and the marks are words rather than
// symbols so they carry their meaning without leaning on colour.
// `omit` is optional and is only ever passed by the feedback panel, which uses
// it for one thing only: dropping the half that repeats what *she* wrote, since
// \u00ab\u0412\u044b \u043d\u0430\u043f\u0438\u0441\u0430\u043b\u0438:\u00bb is a claim the pair's own marks cannot make and so the echo is
// the line that stays. Everywhere else \u2014 the rules list, the progress rows, and
// every collision with the panel's own model sentence \u2014 the pair is drawn
// whole, because half a contrast is not a contrast.
function examplePair(rule, omit) {
  const example = rule.example;
  const skip = typeof omit === "function" ? omit : () => false;
  const halves = [];
  if (rule.emphasis) {
    const goal = goalOf(rule);
    if (!skip(example.wrong)) {
      halves.push(
        `<p class="example example-plain"><span class="example-mark">\u043e\u0431\u044b\u0447\u043d\u043e</span> ` +
          `${escapeHtml(example.wrong)}</p>`
      );
    }
    if (!skip(example.right)) {
      halves.push(
        `<p class="example example-goal" data-goal="${goal}">` +
          `<span class="example-mark">${escapeHtml(GOAL_COPY[goal].mark)}</span> ` +
          `${escapeHtml(example.right)}</p>`
      );
    }
    return halves.join("");
  }
  if (!skip(example.wrong)) {
    halves.push(
      `<p class="example example-bad"><span class="example-mark">\u2717</span> ${escapeHtml(example.wrong)}</p>`
    );
  }
  if (!skip(example.right)) {
    halves.push(
      `<p class="example example-good"><span class="example-mark">\u2713</span> ${escapeHtml(example.right)}</p>`
    );
  }
  return halves.join("");
}

// In the panel the pair needs saying whose sentences these are. Unlabelled, a
// contrast marked \u043e\u0431\u044b\u0447\u043d\u043e/\u0432\u044b\u0440\u0430\u0437\u0438\u0442\u0435\u043b\u044c\u043d\u0435\u0435 sits directly under a verdict about the
// sentence she just answered and reads as a ruling on it \u2014 two acceptable
// variants of a sentence she never wrote, printed under \u00ab\u041d\u0435\u0432\u0435\u0440\u043d\u043e\u00bb. The label
// makes it the rule's example again.
function renderExample(rule, omit) {
  const pair = examplePair(rule, omit);
  // Both halves already on the screen: the label would introduce nothing.
  if (!pair) return "";
  return (
    `<div class="feedback-example">` +
    `<p class="feedback-example-label">\u041f\u0440\u0438\u043c\u0435\u0440 \u0438\u0437 \u043f\u0440\u0430\u0432\u0438\u043b\u0430:</p>` +
    pair +
    `</div>`
  );
}

// The sentence that says the plain variant is also correct, when the rule
// carries it as a field of its own. It is true of the rule and false of a flat
// \u00ab\u041d\u0435\u0432\u0435\u0440\u043d\u043e\u00bb, where she wrote or tapped something that was neither variant, so
// the panel would end by endorsing it \u2014 which is what the playthrough saw.
//
// This was briefly done by matching the sentence inside `rule.explanation` and
// dropping it. That was wrong and is gone: it fired on wording rather than on
// meaning, so it caught seven rules and missed thirteen more that say the same
// thing as \u00ab\u0442\u043e\u0436\u0435 \u0432\u0435\u0440\u0435\u043d\u00bb or \u00ab\u043e\u0431\u0430 \u043d\u043e\u0440\u043c\u0430\u043b\u044c\u043d\u044b\u00bb, and where it did fire it deleted
// teaching prose around the clause and left one explanation with an orphaned
// \u00ab\u0420\u0430\u0437\u043b\u0438\u0447\u0438\u0435 \u0440\u0435\u0433\u0438\u0441\u0442\u0440\u043e\u0432\u043e\u0435\u2026\u00bb whose subject had been removed. Mutating the content
// bank's Russian by pattern can never be complete. A rule with no `plainNote`
// therefore renders its explanation whole and untouched, which is honest;
// making the distinction available at all is a data change, not a render one.
function plainNoteOf(rule) {
  const note = rule && typeof rule.plainNote === "string" ? rule.plainNote.trim() : "";
  return note.length > 0 ? note : "";
}

// The spans this card can be answered with by tapping. An answer that is one of
// them came from the choice card, where the option she picked is still on the
// screen above the panel; anything else she wrote out herself, and a panel that
// does not show it makes her reconstruct her own sentence from memory.
function isTappedSpan(item, given) {
  const answer = normalizeText(given);
  const spans = [item.right, item.wrong, ...(item.distractors || []), ...(item.accepts || [])];
  return spans.some((s) => normalizeText(String(s)) === answer);
}

// Why *this* option is wrong, where the item has been written one. The rule's
// explanation teaches the rule; it does not answer the option she chose, and on
// her first real session that gap was the whole complaint: she tapped \u00abIt was
// then when\u00bb and read a paragraph about who/that/which that never mentions
// `when`.
//
// The key is the distractor's own string, matched exactly \u2014 the bank's test
// pins every key to one of that item's distractors, so an inexact match here
// would only ever paper over a key that has drifted. `given` arrives from the
// card's `data-choice` attribute, i.e. from the DOM, so the lookup goes through
// hasOwnProperty: `notes["constructor"]` is a function, not a note.
function optionNote(item, given) {
  const notes = item && item.notes;
  if (!notes || typeof notes !== "object") return "";
  const key = typeof given === "string" ? given.trim() : "";
  if (key.length === 0) return "";
  if (!Object.prototype.hasOwnProperty.call(notes, key)) return "";
  const note = typeof notes[key] === "string" ? notes[key].trim() : "";
  if (note.length === 0) return "";
  // Labelled, because three kinds of prose now share this panel: this one is
  // about the answer she gave, the explanation is about the rule, and the plain
  // note is about the rule's other variant. Position alone would not say which.
  return (
    `<p class="feedback-option-note">` +
    `<span class="feedback-label">\u041f\u0440\u043e \u0432\u0430\u0448 \u0432\u0430\u0440\u0438\u0430\u043d\u0442:</span> ` +
    `<span class="option-note-text">${escapeHtml(note)}</span></p>`
  );
}

// A plain container rather than a <ul>: every row inside is a <details>
// disclosure, and a list marker beside a thing you open is noise. The rows keep
// their own semantics from <details>/<summary>, so nothing is lost with it gone.
// `id` is given only on the rules screen, which is the one that needs somewhere
// for its jump links to land. The progress screen draws the same sections and
// must not claim the same ids: two elements with one id is a broken link.
function categorySection(category, listClass, rows, id) {
  return (
    `<section class="category"${id ? ` id="${escapeHtml(id)}"` : ""} data-category="${escapeHtml(category)}">` +
    `<h3 class="category-title">${escapeHtml(categoryLabel(category))}</h3>` +
    `<div class="${listClass}">${rows}</div>` +
    `</section>`
  );
}

// `given` is optional: called with three arguments the panel behaves exactly as
// it always has, which is why the grader never had to learn about emphasis.
function renderFeedback(result, rule, item, given) {
  const plainVersion = result.verdict !== "correct" && isPlainVersion(rule, item, given);
  // A result built by hand, or by an older grader, may not carry the field at
  // all; absent and null mean the same thing here.
  const accepted = result.accepted ? result.accepted : null;
  const expected = result.expected || expectedSentence(item);
  const answer = typeof given === "string" ? given.trim() : "";
  const typedAnswer = answer.length > 0 && !isTappedSpan(item, answer);

  // The card asked for a marked form and she wrote a different sentence. The
  // renderer cannot tell a valid cleft of the wrong constituent from bad
  // English \u2014 nothing here can \u2014 so it says the one thing it does know: this is
  // not the form the card asked for. Calling it \u00ab\u041d\u0435\u0432\u0435\u0440\u043d\u043e\u00bb claims the other
  // thing, and on this rule family that claim was wrong four times out of four.
  const offGoal =
    result.verdict === "wrong" &&
    !plainVersion &&
    !accepted &&
    typedAnswer &&
    Boolean(rule && rule.emphasis) &&
    !(item && item.forced);

  let head = "";
  let label = "";
  let showDiff = true;
  let note = "";
  // The one panel whose verdict says her sentence was wrong. Set in the branch
  // that draws it rather than restated as the negation of the other five: a
  // seventh branch added later would silently not update a restatement.
  let flatWrong = false;
  if (plainVersion) {
    // Not congratulated, not corrected: told that her sentence is correct
    // English which did not do what the card asked.
    head =
      `<p class="feedback-verdict">\u0412\u0435\u0440\u043d\u043e, \u043d\u043e \u043d\u0435 \u043e\u0442\u0432\u0435\u0447\u0430\u0435\u0442 \u0437\u0430\u0434\u0430\u043d\u0438\u044e</p>` +
      `<p class="feedback-note">\u042d\u0442\u043e \u043d\u0435 \u043e\u0448\u0438\u0431\u043a\u0430: \u0432\u0430\u0448\u0435 \u043f\u0440\u0435\u0434\u043b\u043e\u0436\u0435\u043d\u0438\u0435 \u2014 \u043f\u0440\u0430\u0432\u0438\u043b\u044c\u043d\u044b\u0439 \u0430\u043d\u0433\u043b\u0438\u0439\u0441\u043a\u0438\u0439.</p>`;
    label = "\u041f\u0440\u0435\u0434\u043b\u043e\u0436\u0435\u043d\u0438\u0435 \u0441 \u043a\u0430\u0440\u0442\u043e\u0447\u043a\u0438:";
    note = "plain-ok";
  } else if (result.verdict === "correct") {
    head = `<p class="feedback-verdict">\u0412\u0435\u0440\u043d\u043e</p>`;
    // Her own sentence, whole and finished. Until now this was the one case
    // where she never saw it: the gap stayed empty and the panel showed a pair
    // of sentences from somewhere else, while the *wrong* panel printed the
    // completed sentence in full. Completing it is what fixes it in memory.
    label = "\u041f\u0440\u0435\u0434\u043b\u043e\u0436\u0435\u043d\u0438\u0435 \u0446\u0435\u043b\u0438\u043a\u043e\u043c:";
    showDiff = false;
  } else if (offGoal) {
    const focus = focusOf(item);
    const wanted = focus ? `\u0432\u044b\u0434\u0435\u043b\u0438\u0442\u044c ${focus}` : GOAL_COPY[goalOf(rule, item)].wanted;
    head =
      `<p class="feedback-verdict">\u041d\u0435 \u0442\u0430 \u0444\u043e\u0440\u043c\u0430, \u043a\u043e\u0442\u043e\u0440\u0443\u044e \u043f\u0440\u043e\u0441\u0438\u043b\u0430 \u043a\u0430\u0440\u0442\u043e\u0447\u043a\u0430</p>` +
      `<p class="feedback-note">\u0417\u0430\u0434\u0430\u043d\u0438\u0435 \u0431\u044b\u043b\u043e \u2014 ${escapeHtml(wanted)}. ` +
      `\u041f\u0440\u043e \u0432\u0430\u0448 \u0430\u043d\u0433\u043b\u0438\u0439\u0441\u043a\u0438\u0439 \u043a\u0430\u0440\u0442\u043e\u0447\u043a\u0430 \u043d\u0438\u0447\u0435\u0433\u043e \u043d\u0435 \u0433\u043e\u0432\u043e\u0440\u0438\u0442.</p>`;
    label = "\u041f\u0440\u0435\u0434\u043b\u043e\u0436\u0435\u043d\u0438\u0435 \u0441 \u043a\u0430\u0440\u0442\u043e\u0447\u043a\u0438:";
    // The diff goes for the reason it goes on the accepted panel: drawn against
    // the card's own sentence it paints her wording as a deletion and the
    // card's as a repair, which is exactly the claim this branch refuses.
    showDiff = false;
    note = "off-goal";
  } else if (accepted) {
    // She wrote correct English in a wording the card accepts. Nothing was
    // almost-right and nothing needs repairing, so the panel neither grades the
    // attempt nor corrects it: it states that her wording is also correct and
    // then shows what the card happens to record. The diff is dropped here on
    // purpose \u2014 drawn against the card's own span it would paint her wording as
    // a deletion and the card's as an addition, which is the repair framing this
    // branch exists to avoid.
    head =
      `<p class="feedback-verdict">\u0412\u0435\u0440\u043d\u043e, \u043d\u043e \u043d\u0430 \u043a\u0430\u0440\u0442\u043e\u0447\u043a\u0435 \u0434\u0440\u0443\u0433\u0430\u044f \u0444\u043e\u0440\u043c\u0443\u043b\u0438\u0440\u043e\u0432\u043a\u0430</p>` +
      `<p class="feedback-note">\u0412\u0430\u0448 \u0432\u0430\u0440\u0438\u0430\u043d\u0442 \u2014 \u0442\u043e\u0436\u0435 \u043f\u0440\u0430\u0432\u0438\u043b\u044c\u043d\u044b\u0439 \u0430\u043d\u0433\u043b\u0438\u0439\u0441\u043a\u0438\u0439.</p>`;
    label = "\u041f\u0440\u0435\u0434\u043b\u043e\u0436\u0435\u043d\u0438\u0435 \u0441 \u043a\u0430\u0440\u0442\u043e\u0447\u043a\u0438:";
    showDiff = false;
    note = "accepted";
  } else if (result.verdict === "typo") {
    // What is left under this verdict once an accepted wording has been split
    // off: the target span was repaired with the card's own wording, and only
    // the writing came out different.
    head =
      `<p class="feedback-verdict">\u041f\u043e\u0447\u0442\u0438</p>` +
      `<p class="feedback-note">\u041f\u0440\u0430\u0432\u0438\u043b\u043e \u0432\u044b \u043f\u0440\u0438\u043c\u0435\u043d\u0438\u043b\u0438 \u0432\u0435\u0440\u043d\u043e. \u041f\u043e\u0445\u043e\u0436\u0435 \u043d\u0430 \u043e\u043f\u0435\u0447\u0430\u0442\u043a\u0443.</p>`;
    label = "\u041f\u0440\u0435\u0434\u043b\u043e\u0436\u0435\u043d\u0438\u0435 \u0441 \u043a\u0430\u0440\u0442\u043e\u0447\u043a\u0438:";
  } else {
    head = `<p class="feedback-verdict">\u041d\u0435\u0432\u0435\u0440\u043d\u043e</p>`;
    label = "\u041f\u0440\u0430\u0432\u0438\u043b\u044c\u043d\u044b\u0439 \u0432\u0430\u0440\u0438\u0430\u043d\u0442:";
    flatWrong = true;
  }

  // The diff *is* the correct sentence with the change marked inside it, so a
  // plain copy of the same sentence above it is repetition \u2014 and on an insertion
  // card (the article rules, missing-subject, the quantifiers, there-is-are) it
  // is the identical string twice over. Where there is a diff, the label goes on
  // the diff; where there is none \u2014 the accepted panel, and anything graded by
  // gradeChoice, which never builds one \u2014 the labelled sentence is all there is.
  // A diff earns its place only if it marks something and marks it honestly.
  // A reordering is dropped outright under the not-a-mistake banner \u2014 there the
  // whole claim is that nothing was wrong, and striking her words through says
  // the opposite whatever the words are. Elsewhere a reordering is kept while it
  // still reads as a sentence, and dropped once it garbles; either way the
  // labelled sentence stands on its own, as it already does on the choice card
  // and the accepted panel.
  const shape = Array.isArray(result.diff) ? diffShape(result.diff) : { shape: "none", segments: 0 };
  const reordering = shape.segments > 0 && isReordering(result.diff);
  const dropReordering = reordering && (plainVersion || shape.segments >= REORDER_LIMIT);
  const usableDiff =
    showDiff && shape.segments > 0 && !dropReordering ? result.diff : null;
  const diffHtml = usableDiff ? renderDiff(usableDiff) : "";
  const sentenceLine = diffHtml
    ? `<p class="feedback-label">${escapeHtml(label)}</p>${diffHtml}`
    : `<p class="feedback-expected">` +
      `<span class="feedback-label">${escapeHtml(label)}</span> ` +
      `<span class="sentence">${escapeHtml(expected)}</span></p>`;

  // What she actually wrote, above the model, so the objection can be read off
  // the screen rather than reconstructed from memory. Only for an answer she
  // wrote out: the option she tapped is still on the card just above. And
  // withheld when it would repeat the model sentence directly under it.
  const echo =
    typedAnswer && result.verdict !== "correct" && normalizeText(answer) !== normalizeText(expected)
      ? `<p class="feedback-given"><span class="feedback-label">\u0412\u044b \u043d\u0430\u043f\u0438\u0441\u0430\u043b\u0438:</span> ` +
        `<span class="sentence">${escapeHtml(answer)}</span></p>`
      : "";

  // WHAT STANDS DOWN WHEN THE CARD'S SENTENCE IS ALSO THE RULE'S EXAMPLE. On 56
  // items in the bank the card's sentence *is* the rule's logged `example.right`,
  // so printing both would put one string on the panel twice under two labels \u2014
  // \u00ab\u041f\u0440\u0435\u0434\u043b\u043e\u0436\u0435\u043d\u0438\u0435 \u0446\u0435\u043b\u0438\u043a\u043e\u043c: If we measure performance\u2026\u00bb and \u00ab\u2713 If we measure
  // performance\u2026\u00bb \u2014 which reads as a rendering fault.
  //
  // Until this round the pair gave way and the panel's own line stayed. That was
  // right on paper \u2014 the labelled line is the \u2713 half, so the contrast survives \u2014
  // and wrong on a phone, which is where it was reported: the line sits at the
  // top of the panel, the well sits below a full paragraph of Russian, the eye
  // never joins them, and what is left in the well is a solitary \u00ab\u043e\u0431\u044b\u0447\u043d\u043e X\u00bb
  // under a \u00ab\u0412\u0435\u0440\u043d\u043e\u00bb verdict.
  //
  // So it is the other way round now. The pair is the element whose whole job is
  // to hold a contrast, and it keeps both halves; the panel's standalone copy of
  // the same sentence goes instead. Nothing leaves the screen \u2014 the sentence is
  // still there, inside the pair, beside its counterpart and under a mark.
  //
  // Two exceptions, and they are the two labels a mark cannot replace:
  //
  // - The echo. \u00ab\u0412\u044b \u043d\u0430\u043f\u0438\u0441\u0430\u043b\u0438:\u00bb says the sentence is *hers*, which \u00ab\u043e\u0431\u044b\u0447\u043d\u043e\u00bb does
  //   not, so the echo stays and the half it repeats is the one that goes.
  // - The diff. It is not a copy of the sentence but the sentence with the
  //   repair marked inside it, which the pair cannot express either \u2014 so it
  //   never counts as printing the sentence, and neither line stands down.
  const same = (a, b) => normalizeText(String(a)) === normalizeText(String(b));
  const example = (rule && rule.example) || { wrong: "", right: "" };
  const echoes = (s) => Boolean(echo) && same(answer, s);
  const modelLine = (s) => !diffHtml && same(expected, s);
  // A diff never makes a line stand down, but it does put the sentence on the
  // screen, and that has to count when the question is whether the well would be
  // a second copy of a contrast the panel is already drawing. Without this the
  // echo takes one half away and the other is left alone, saying in plain text
  // exactly what the diff two lines above says with the repair marked: 28 panels,
  // 18 of them emphasis rules, every one of them an `-01` item.
  const diffHolds = (s) => Boolean(diffHtml) && same(expected, s);
  const heldPlain = echoes(example.wrong) || modelLine(example.wrong) || diffHolds(example.wrong);
  const heldGoal = echoes(example.right) || modelLine(example.right) || diffHolds(example.right);
  // Both halves already on the panel under labels of their own: there the panel
  // is printing the pair itself, more specifically than the pair does, and the
  // well would be a second copy of the same contrast.
  const dropWell = heldPlain && heldGoal;
  const dropModelLine = !dropWell && (modelLine(example.wrong) || modelLine(example.right));
  const exampleHtml = dropWell ? "" : renderExample(rule, echoes);
  // The note about the option she tapped, on the one panel that claims she got
  // it wrong. Every other shape either says her English was fine (plain-ok,
  // off-goal, accepted) or that the rule was applied (correct, typo), and a
  // paragraph explaining why her option fails would contradict all five. No
  // mode gate beyond that: in typed mode the match needs what she typed to be
  // the distractor's own string, which is rare rather than impossible, and
  // where it happens the note is true of what she wrote.
  const optionNoteHtml = flatWrong ? optionNote(item, answer) : "";
  const body = echo + (dropModelLine ? "" : sentenceLine);

  // The rule's own sentence saying the plain variant is correct too, where the
  // rule carries one. Withheld twice over.
  //
  // From the flat \u00ab\u041d\u0435\u0432\u0435\u0440\u043d\u043e\u00bb panel: that is the panel where she wrote or tapped
  // something that was neither variant, so a closing line endorsing both would
  // be endorsing what she did.
  //
  // And from every panel of a `forced` item, whatever the verdict. `forced` is
  // the flag saying the plain version of *this* sentence is ungrammatical, so
  // the rule's general note is false of the card in front of her. The plain-ok
  // and off-goal branches already exclude forced items and were never the
  // exposure; the correct, typo and accepted panels are, and five rules carry
  // both forced items and an explanation that endorses the plain variant.
  const plainNote = plainNoteOf(rule);
  const plainNoteHtml =
    plainNote && !flatWrong && !(item && item.forced)
      ? `<p class="feedback-plain-note">${escapeHtml(plainNote)}</p>`
      : "";

  const noteAttr = note ? ` data-note="${escapeHtml(note)}"` : "";
  // What the diff looks like, for the stylesheet to gate its correction gesture
  // on: a one-for-one substitution is the case the three-phase gesture was drawn
  // for, an insertion has nothing to strike, a deletion strikes without
  // repairing, and a complex diff would sweep half the sentence at once.
  // `data-gesture` is the editorial half of the same question, and it is
  // withheld from the typo panel deliberately: the one animated moment in the
  // product should not be spent on a spelling slip.
  const shapeAttr = usableDiff
    ? ` data-diff-shape="${shape.shape}" data-diff-segments="${shape.segments}"`
    : "";
  const gestureAttr =
    usableDiff && result.verdict === "wrong" && !plainVersion ? ` data-gesture="correction"` : "";
  return (
    `<div class="feedback" data-verdict="${escapeHtml(result.verdict)}"${noteAttr}${shapeAttr}${gestureAttr}>` +
    head +
    optionNoteHtml +
    body +
    `<p class="feedback-explanation">${escapeHtml(rule.explanation)}</p>` +
    plainNoteHtml +
    exampleHtml +
    `</div>`
  );
}

function topicsById(topics) {
  const map = {};
  for (const t of topics || []) map[t.id] = t;
  return map;
}

function deckOrder(topics) {
  const seen = [];
  for (const t of topics || []) {
    if (!seen.includes(t.deck)) seen.push(t.deck);
  }
  return seen;
}

// The decks a rule belongs to, in the order the decks appear in the topic list.
function decksOf(rule, topics) {
  const byId = topicsById(topics);
  const decks = [];
  for (const id of rule.topics || []) {
    const topic = byId[id];
    if (topic && !decks.includes(topic.deck)) decks.push(topic.deck);
  }
  const order = deckOrder(topics);
  decks.sort((a, b) => order.indexOf(a) - order.indexOf(b));
  return decks;
}

// The same thing as an attribute value: "course", "tutor" or "course tutor".
function deckMarker(rule, topics) {
  return decksOf(rule, topics).join(" ");
}

// Mastery as something the stylesheet can draw. The value is on the element
// three ways so it can be styled, read and asserted on: custom properties for
// the fill width, data attributes for selectors, and an aria-label for a screen
// reader, which sees the bar as one image rather than an empty box.
function renderMeter(level) {
  return (
    `<span class="rule-meter" role="img" aria-label="\u0423\u0440\u043e\u0432\u0435\u043d\u044c ${level} \u0438\u0437 ${MAX_LEVEL}"` +
    ` data-value="${level}" data-max="${MAX_LEVEL}" style="--level:${level};--max:${MAX_LEVEL}">` +
    `<span class="rule-meter-fill"></span></span>`
  );
}

function groupByCategory(rules) {
  const groups = [];
  for (const rule of rules) {
    let group = null;
    for (const g of groups) {
      if (g.category === rule.category) group = g;
    }
    if (!group) {
      group = { category: rule.category, rules: [] };
      groups.push(group);
    }
    group.rules.push(rule);
  }
  return groups;
}

// How many rules the shortlist names. Five is a list she can act on in one
// twenty-card session; past that it stops being a shortlist and starts being
// the flat hundred rows again, which is the screen she said could not answer
// her question.
const MISSED_LIMIT = 5;

// Both numbers, on every row, always. Written as words rather than as a colour
// or a ratio: \u00ab0/5\u00bb read the same on the two rules she had actually got wrong
// as on the hundred she had never seen, and that identity was the complaint.
// The attributes carry the same two numbers for the stylesheet and the tests.
function renderCounts(counts) {
  return (
    `<span class="rule-counts" data-right="${count(counts.right)}" data-wrong="${count(counts.wrong)}">` +
    // Labels with a colon rather than \u00ab\u043e\u0448\u0438\u0431\u043e\u043a 1\u00bb: as a label the genitive is
    // invariant and needs no agreement with the number after it, which is what
    // \u00ab\u0432\u0435\u0440\u043d\u043e 3 \u00b7 \u043e\u0448\u0438\u0431\u043e\u043a 1\u00bb was quietly getting wrong two lines below a stats
    // block that does decline.
    `<span class="count count-right">\u0432\u0435\u0440\u043d\u043e: ${count(counts.right)}</span>` +
    `<span class="count count-wrong">\u043e\u0448\u0438\u0431\u043e\u043a: ${count(counts.wrong)}</span>` +
    `</span>`
  );
}

// The block she opens the screen for. Ids come out of the store here rather
// than out of the bank \u2014 the only rendering in the app that goes that way \u2014 so
// a rule that has been renamed since she last trained is dropped rather than
// followed to a title that no longer exists. `mostMissed` now prunes the same
// ids itself; the map below is what makes that guarantee visible where it is
// relied on, and it is what turns an id into a title in any case.
function renderMissed(rules, progress) {
  const byId = {};
  for (const rule of rules || []) byId[rule.id] = rule;
  const rows = mostMissed(progress, MISSED_LIMIT, Object.keys(byId))
    .filter((row) => byId[row.ruleId])
    .map((row) => {
      const rule = byId[row.ruleId];
      return (
        `<li class="missed-row" data-rule="${escapeHtml(rule.id)}">` +
        `<a class="missed-rule" href="#rule-${escapeHtml(rule.id)}">${escapeHtml(rule.title)}</a>` +
        renderCounts(row) +
        `</li>`
      );
    })
    .join("");

  // A first run has no misses, and an empty box with nothing in it is one more
  // thing to interpret. The line says what will appear here instead.
  const body = rows
    ? `<ul class="missed-list">${rows}</ul>`
    : `<p class="missed-empty">\u041e\u0448\u0438\u0431\u043e\u043a \u043f\u043e\u043a\u0430 \u043d\u0435\u0442. \u0417\u0434\u0435\u0441\u044c \u043f\u043e\u044f\u0432\u044f\u0442\u0441\u044f \u043f\u0440\u0430\u0432\u0438\u043b\u0430, \u0432 \u043a\u043e\u0442\u043e\u0440\u044b\u0445 \u0432\u044b \u043e\u0448\u0438\u0431\u0430\u0435\u0442\u0435\u0441\u044c \u0447\u0430\u0449\u0435 \u0432\u0441\u0435\u0433\u043e.</p>`;

  return (
    `<section class="missed">` +
    `<h3 class="missed-heading">\u0427\u0430\u0449\u0435 \u0432\u0441\u0435\u0433\u043e \u043e\u0448\u0438\u0431\u0430\u0435\u0442\u0435\u0441\u044c</h3>` +
    body +
    `</section>`
  );
}

function renderProgress(rules, progress, todayIso, topics) {
  const today = count(cardsToday(progress, todayIso));
  const streak = progress.streak && progress.streak.count ? progress.streak.count : 0;

  const stats =
    `<ul class="stats">` +
    `<li class="stat"><span class="stat-value">${today}</span> ` +
    `<span class="stat-label">${plural(today, "\u043a\u0430\u0440\u0442\u043e\u0447\u043a\u0430", "\u043a\u0430\u0440\u0442\u043e\u0447\u043a\u0438", "\u043a\u0430\u0440\u0442\u043e\u0447\u0435\u043a")} \u0441\u0435\u0433\u043e\u0434\u043d\u044f</span></li>` +
    `<li class="stat"><span class="stat-value">${streak}</span> ` +
    `<span class="stat-label">${plural(streak, "\u0434\u0435\u043d\u044c", "\u0434\u043d\u044f", "\u0434\u043d\u0435\u0439")} \u043f\u043e\u0434\u0440\u044f\u0434</span></li>` +
    `</ul>`;

  const groups = groupByCategory(rules)
    .map((group) => {
      const rows = group.rules
        .map((rule) => {
          const level = count(levelOf(progress, rule.id));
          const due = isDue(progress, rule.id, todayIso);
          const chips = decksOf(rule, topics)
            .map((d) => `<span class="deck-chip" data-deck="${escapeHtml(d)}">${escapeHtml(deckLabel(d))}</span>`)
            .join("");
          // The dot that used to stand here alone read as a status light and
          // meant nothing she could name. A marker that has to be guessed at
          // either earns a label or goes; this one says what it is. `data-due`
          // stays for the stylesheet, which no longer needs to draw the dot.
          const dueLabel = due ? `<span class="rule-due">\u043d\u0430 \u0441\u0435\u0433\u043e\u0434\u043d\u044f</span>` : "";
          // The order she reads: which rule, how it has gone, how far in it is,
          // whether it is up today, which deck it came from.
          return (
            `<details class="rule-row" id="rule-${escapeHtml(rule.id)}"` +
            ` data-rule="${escapeHtml(rule.id)}" data-level="${level}"` +
            ` data-decks="${escapeHtml(deckMarker(rule, topics))}" data-due="${due ? "true" : "false"}">` +
            `<summary class="rule-head">` +
            `<span class="rule-title">${escapeHtml(rule.title)}</span>` +
            renderCounts(ruleCounts(progress, rule.id)) +
            renderMeter(level) +
            `<span class="rule-level">${level}/${MAX_LEVEL}</span>` +
            dueLabel +
            chips +
            `</summary>` +
            `<div class="rule-body">` +
            `<p class="rule-explanation">${escapeHtml(rule.explanation)}</p>` +
            examplePair(rule) +
            `</div>` +
            `</details>`
          );
        })
        .join("");
      return categorySection(group.category, "rule-list", rows);
    })
    .join("");

  // The two buttons on one row, as she asked. Behind them, two boxes rather
  // than one: sharing a single text area meant \u0417\u0430\u0433\u0440\u0443\u0437\u0438\u0442\u044c cleared the export you
  // were about to copy, so tapping the wrong button destroyed the thing you
  // came for. The export box is read-only and has a copy control of its own,
  // because getting 1412 characters of JSON out of an editable six-row box with
  // a thumb is a long-press and a prayer. On a phone there is no file dialog, so
  // copy and paste is still the whole mechanism.
  //
  // Everything here starts visible; the wiring decides when to show what.
  const io =
    `<div class="io">` +
    `<div class="io-buttons">` +
    `<button type="button" id="export" class="export">\u0412\u044b\u0433\u0440\u0443\u0437\u0438\u0442\u044c</button>` +
    `<button type="button" id="import" class="import">\u0417\u0430\u0433\u0440\u0443\u0437\u0438\u0442\u044c</button>` +
    `</div>` +
    `<div class="io-group io-group-out">` +
    `<label class="io-label" for="io-out">\u0412\u044b\u0433\u0440\u0443\u0436\u0435\u043d\u043d\u044b\u0439 \u043f\u0440\u043e\u0433\u0440\u0435\u0441\u0441</label>` +
    `<textarea id="io-out" class="io-text io-out" rows="6" readonly spellcheck="false"></textarea>` +
    `<button type="button" id="io-copy" class="io-copy">\u0421\u043a\u043e\u043f\u0438\u0440\u043e\u0432\u0430\u0442\u044c</button>` +
    `</div>` +
    `<div class="io-group io-group-in">` +
    `<label class="io-label" for="io-text">\u0412\u0441\u0442\u0430\u0432\u044c\u0442\u0435 \u0432\u044b\u0433\u0440\u0443\u0437\u043a\u0443 \u0441\u044e\u0434\u0430</label>` +
    `<textarea id="io-text" class="io-text io-in" rows="6" spellcheck="false"></textarea>` +
    `<button type="button" id="io-apply" class="io-apply">\u041f\u0440\u0438\u043c\u0435\u043d\u0438\u0442\u044c</button>` +
    `</div>` +
    `<p id="io-note" class="io-note"></p>` +
    `</div>`;

  return (
    `<section class="screen screen-progress">` +
    `<h2>\u041f\u0440\u043e\u0433\u0440\u0435\u0441\u0441</h2>` +
    stats +
    renderMissed(rules, progress) +
    io +
    groups +
    `</section>`
  );
}

function renderRulesList(rules) {
  const groups = groupByCategory(rules);

  // The screen is 66 000 characters on one scroll, so finding the rule you have
  // just failed means going past a hundred others. Four anchors are not a
  // search box, but they are the whole of the change: no script, no state, and
  // the browser's own in-page navigation does the work.
  const jump =
    groups.length > 1
      ? `<nav class="rule-jump" aria-label="\u0420\u0430\u0437\u0434\u0435\u043b\u044b \u043f\u0440\u0430\u0432\u0438\u043b">` +
        groups
          .map(
            (group) =>
              `<a class="rule-jump-link" href="#rules-${escapeHtml(group.category)}">` +
              `${escapeHtml(categoryLabel(group.category))}</a>`
          )
          .join("") +
        `</nav>`
      : "";

  const sections = groups
    .map((group) => {
      const cards = group.rules
        .map(
          (rule) =>
            `<article class="rule-card" data-rule="${escapeHtml(rule.id)}">` +
            `<h4 class="rule-title">${escapeHtml(rule.title)}</h4>` +
            `<p class="rule-explanation">${escapeHtml(rule.explanation)}</p>` +
            examplePair(rule) +
            `</article>`
        )
        .join("");
      return categorySection(group.category, "rule-cards", cards, `rules-${group.category}`);
    })
    .join("");

  return `<section class="screen screen-rules"><h2>\u041f\u0440\u0430\u0432\u0438\u043b\u0430</h2>${jump}${sections}</section>`;
}

function uniqueSelection(selected) {
  if (!Array.isArray(selected)) return [];
  return [...new Set(selected.filter((s) => typeof s === "string"))];
}

function deckTopicIds(topics, deck) {
  return (topics || []).filter((t) => t.deck === deck).map((t) => t.id);
}

function isWholeDeck(topics, selection, deck) {
  const ids = deckTopicIds(topics, deck);
  if (ids.length === 0 || ids.length !== selection.length) return false;
  return ids.every((id) => selection.includes(id));
}

// An empty selection means everything, so that is what the control reads.
function filterSummary(topics, selected) {
  const selection = uniqueSelection(selected);
  if (selection.length === 0) return "\u0412\u0441\u0451";
  for (const deck of deckOrder(topics)) {
    if (isWholeDeck(topics, selection, deck)) return deckLabel(deck);
  }
  if (selection.length === 1) {
    const topic = (topics || []).find((t) => t.id === selection[0]);
    return topic ? topic.title : selection[0];
  }
  return `${selection.length} ${plural(selection.length, "\u0442\u0435\u043c\u0430", "\u0442\u0435\u043c\u044b", "\u0442\u0435\u043c")}`;
}

function renderFilterButton(topics, selected) {
  return (
    `<button type="button" id="filter" class="filter" aria-haspopup="true" aria-expanded="false">` +
    `<span class="filter-label">\u0422\u0435\u043c\u044b:</span> ` +
    `<span class="filter-summary">${escapeHtml(filterSummary(topics, selected))}</span>` +
    `</button>`
  );
}

// The theme is passed in rather than read from anywhere, like every other piece
// of state this module renders. `aria-pressed` carries it: pressed means dark.
function renderThemeToggle(dark) {
  const on = dark ? "true" : "false";
  const label = dark ? "\u0422\u0451\u043c\u043d\u0430\u044f \u0442\u0435\u043c\u0430 \u0432\u043a\u043b\u044e\u0447\u0435\u043d\u0430" : "\u0412\u043a\u043b\u044e\u0447\u0438\u0442\u044c \u0442\u0451\u043c\u043d\u0443\u044e \u0442\u0435\u043c\u0443";
  return (
    `<button type="button" id="theme" class="theme-toggle" aria-pressed="${on}"` +
    ` aria-label="${escapeHtml(label)}"><span class="theme-icon" aria-hidden="true">\u25d0</span></button>`
  );
}

// The two controls she asked to have together in the top right.
function renderControls(topics, selected, dark) {
  return (
    `<div class="controls">` +
    renderFilterButton(topics, selected) +
    renderThemeToggle(dark) +
    `</div>`
  );
}

// Sixteen topics do not fit in a row of buttons on a 375 px screen, so the
// picker is a list behind the filter button. State lives in attributes rather
// than classes: one delegated click handler in the wiring module, and screen
// readers get the selection for free. Several topics can be chosen at once, so
// aria-pressed="true" may appear on many rows.
function renderTopicPicker(topics, rules, progress, selected, todayIso) {
  const selection = uniqueSelection(selected);
  const pressed = (on) => (on ? "true" : "false");

  const all =
    `<button type="button" class="preset preset-all" data-preset="all"` +
    ` aria-pressed="${pressed(selection.length === 0)}">\u0412\u0441\u0451</button>`;

  const sections = deckOrder(topics)
    .map((deck) => {
      // The deck heading is the deck's preset control, which is also why the
      // deck label is written exactly once per picker.
      const heading =
        `<button type="button" class="preset preset-deck" data-preset="${escapeHtml(deck)}"` +
        ` aria-pressed="${pressed(isWholeDeck(topics, selection, deck))}">${escapeHtml(deckLabel(deck))}</button>`;

      const rows = (topics || [])
        .filter((t) => t.deck === deck)
        .map((topic) => {
          const inTopic = (rules || []).filter((r) => (r.topics || []).includes(topic.id));
          const dueCount = inTopic.filter((r) => isDue(progress, r.id, todayIso)).length;
          const dueSpan =
            dueCount > 0 ? `<span class="topic-due">${dueCount} \u043d\u0430 \u0441\u0435\u0433\u043e\u0434\u043d\u044f</span>` : "";
          return (
            `<li class="topic-item">` +
            `<button type="button" class="topic-row" data-topic="${escapeHtml(topic.id)}"` +
            ` aria-pressed="${pressed(selection.includes(topic.id))}">` +
            `<span class="topic-title">${escapeHtml(topic.title)}</span>` +
            `<span class="topic-counts">` +
            `<span class="topic-rules">${inTopic.length} ${plural(inTopic.length, "\u043f\u0440\u0430\u0432\u0438\u043b\u043e", "\u043f\u0440\u0430\u0432\u0438\u043b\u0430", "\u043f\u0440\u0430\u0432\u0438\u043b")}</span>` +
            dueSpan +
            `</span></button></li>`
          );
        })
        .join("");

      return (
        `<section class="deck" data-deck="${escapeHtml(deck)}">` +
        heading +
        `<ul class="topic-list">${rows}</ul>` +
        `</section>`
      );
    })
    .join("");

  return `<div class="picker" id="topic-picker">${all}${sections}</div>`;
}
// --- src/app.mjs ---

// The entry point, and the only file in the project that touches the DOM.
// Everything below is wiring: it holds the session in a variable, asks the
// pure modules what to show, writes their HTML into the three hosts the
// template provides, and listens for taps. No grading, no scheduling and no
// markup-building happens here \u2014 where this file looks like it is deciding
// something, it is choosing which function to call.

const appState = {
  progress: null,
  session: null,
  today: null,
  // A monotonically increasing counter for `recordShown`. It lives in
  // `progress.items` rather than in a field of its own, because storage's
  // hydrate keeps exactly five keys and would drop anything else on the next
  // reload; the highest tick already stored is where the next session resumes.
  tick: 0,
  // The card on screen, or null between cards.
  current: null,
  // True while the feedback panel is up and the next card has not been asked
  // for. Guards against a second tap grading the same card twice.
  awaiting: false,
  screen: "session",
  pickerOpen: false,
  // Session tally, kept here rather than in the session object: switchTopics
  // rebuilds the queue and carries `answered` forward, but the summary also
  // wants how many were right and which rules went back to zero.
  answered: 0,
  right: 0,
  reset: [],
};

// How many reset rules the end-of-session summary names before it counts the
// rest instead.
const SUMMARY_RESET_LIMIT = 5;

// The theme is a property of the device, not of what she has learned, so it
// lives beside the progress rather than inside it: exporting her progress on
// the phone and importing it on the laptop must not drag the phone's theme
// across, and a theme change must not rewrite the progress record.
const THEME_KEY = "english-trainer-theme";

function elem(id) {
  return document.getElementById(id);
}

function ruleById(id) {
  return RULES.find((r) => r.id === id) || null;
}

function itemById(id) {
  return ITEMS.find((i) => i.id === id) || null;
}

// The tick to hand the next `recordShown`. Values arriving from an imported
// file are not trusted to be numbers, which is the same check pickItemId makes.
function nextTick(progress) {
  let max = -1;
  for (const key of Object.keys(progress.items || {})) {
    const v = progress.items[key];
    if (typeof v === "number" && v > max) max = v;
  }
  return max + 1;
}

// storage.mjs deliberately knows nothing about the taxonomy, so a stored
// selection can name a topic that has since been renamed or removed. Dropping
// the unknown ids here is what keeps the rest of the selection working; if
// nothing survives, the empty array is the honest answer, because empty means
// every topic rather than no topic.
function pruneTopics(selected) {
  const known = TOPICS.map((t) => t.id);
  if (!Array.isArray(selected)) return [];
  return selected.filter((id) => known.includes(id));
}

function persist() {
  save(window.localStorage, appState.progress, STORAGE_KEY);
}

// Every write that moves the session forward goes through here, so the meter on
// \u0422\u0440\u0435\u043d\u0438\u0440\u043e\u0432\u043a\u0430 and the card count on \u041f\u0440\u043e\u0433\u0440\u0435\u0441\u0441 are always saved in the same
// operation. That is the point: they were able to disagree about the same day
// only because one of them was written to storage and the other was not written
// at all. `right` and `reset` ride along because they are the summary, and the
// summary is the one place that names what she got wrong \u2014 losing it to a
// backgrounded tab is losing the reason the session happened.
function storeSession() {
  const session = appState.session;
  if (!session) return;
  appState.progress = recordSession(appState.progress, {
    day: appState.today,
    queue: session.queue,
    cap: session.cap,
    answered: session.answered,
    mode: session.mode,
    topics: session.topics,
    right: appState.right,
    reset: appState.reset,
  });
  persist();
}

/* \u2500\u2500 the theme \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */

// Two states, and only two. This app is dark by default: until she touches the
// toggle nothing is stored, and nothing stored means dark regardless of what
// the OS asks for. There is no follow-the-system state any more, which is what
// makes the binary `aria-pressed` control the renderer emits honest \u2014 it now
// has exactly as many states as the theme does, and it can no longer report
// "light" to a screen reader while she looks at a dark screen.
//
// The root element therefore always carries an explicit `data-theme`, "dark" or
// "light", stamped before the first paint. The stylesheet's contract is the
// mirror of that: the dark tokens are the bare `:root` defaults, so an untouched
// page is already correct even in the instant before this script runs, and
// `:root[data-theme="light"]` is the only override needed. `prefers-color-scheme`
// is not consulted anywhere.

function storedTheme() {
  try {
    const value = window.localStorage.getItem(THEME_KEY);
    return value === "dark" || value === "light" ? value : null;
  } catch (e) {
    return null;
  }
}

// What she is looking at. Anything other than an explicit "light" is dark,
// which covers the untouched case, an unreadable localStorage and a junk value
// alike. This is what the toggle's pressed state must reflect.
function themeIsDark() {
  return storedTheme() !== "light";
}

function activeTheme() {
  return themeIsDark() ? "dark" : "light";
}

// The standalone build (docs/index.html) carries two <meta name="theme-color">
// tags, each gated by `media="(prefers-color-scheme: \u2026)"` and read from the
// same --bg tokens the stylesheet uses (see build.py). The page itself no
// longer answers that query at all, so left alone the metas would hand the
// status bar and home indicator a colour the page never uses \u2014 light chrome
// over a dark screen for anyone whose phone is set to light, which is now the
// default case rather than the exotic one.
//
// Fixing the `content` is not enough: a meta whose `media` does not match the
// current OS scheme is inert no matter what its `content` says. The `media`
// attribute itself has to move \u2014 the meta matching the active theme becomes
// unconditional ("all") and the other is made never to match ("not all"), so
// exactly one is ever current regardless of what the OS is doing. This is now
// called on load as well as on every tap, because even the untouched page has
// a theme to assert.
//
// Which meta is which has to be recorded once and kept, not re-read from
// `media` on every call: the first call overwrites it to "all" / "not all",
// and neither of those contains "dark" or "light" \u2014 a second tap reading the
// already-rewritten attribute would see two light-looking metas and stop
// telling them apart. `dataset.scheme` is written once per element, the first
// time it is seen, and every later call trusts that instead.
//
// app.html has no <head> and therefore no theme-color metas \u2014 querySelectorAll
// returns an empty list there rather than throwing, so this is a no-op on
// that build.
function applyThemeMeta(theme) {
  for (const meta of document.querySelectorAll('meta[name="theme-color"]')) {
    if (!meta.dataset.scheme) {
      meta.dataset.scheme = (meta.getAttribute("media") || "").includes("dark")
        ? "dark"
        : "light";
    }
    meta.setAttribute("media", theme === meta.dataset.scheme ? "all" : "not all");
  }
}

// Called at module top level rather than from boot(): the stamp has to be on
// the root element before the first paint. With dark as the bare `:root`
// default an untouched page cannot flash, but a page she has set to light
// would, so the attribute still goes on as early as the script can run.
function applyStoredTheme() {
  const theme = activeTheme();
  document.documentElement.dataset.theme = theme;
  applyThemeMeta(theme);
}

function toggleTheme() {
  const next = themeIsDark() ? "light" : "dark";
  try {
    window.localStorage.setItem(THEME_KEY, next);
  } catch (e) {
    // A preference that cannot be stored is still worth applying for this
    // visit; nothing else here depends on the write having succeeded.
  }
  document.documentElement.dataset.theme = next;
  applyThemeMeta(next);
  renderControlsHost();
}

/* \u2500\u2500 the session screen \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */

function updateMeter() {
  const meter = elem("session-meter");
  const fill = elem("session-meter-fill");
  const count = elem("session-count");
  const session = appState.session;
  const cap = session.cap > 0 ? session.cap : 1;
  const done = Math.min(session.answered, session.cap);
  fill.style.width = `${Math.round((done / cap) * 100)}%`;
  count.textContent = `${done}/${session.cap}`;
  meter.hidden = false;
}

function setStatus(html) {
  const status = elem("session-status");
  if (!html) {
    status.hidden = true;
    status.innerHTML = "";
    return;
  }
  status.innerHTML = html;
  status.hidden = false;
}

function clearFeedback() {
  const host = elem("feedback-host");
  host.hidden = true;
  host.innerHTML = "";
}

// The end of a session: what was answered, what was right, and which rules
// went back to level 0 \u2014 the last of these because a reset is the one thing
// that costs her a week of intervals, and she should not have to hunt for it
// on the progress screen.
function showSummary() {
  appState.current = null;
  appState.awaiting = false;
  elem("card-host").innerHTML = "";
  clearFeedback();
  const total = appState.answered;
  const right = appState.right;
  let text =
    `<span class="stat-value">${total}</span> ` +
    `${total === 1 ? "\u043a\u0430\u0440\u0442\u043e\u0447\u043a\u0430" : total >= 2 && total <= 4 ? "\u043a\u0430\u0440\u0442\u043e\u0447\u043a\u0438" : "\u043a\u0430\u0440\u0442\u043e\u0447\u0435\u043a"}, ` +
    `\u0432\u0435\u0440\u043d\u043e ${right}.`;
  if (appState.reset.length > 0) {
    // A bad session can reset seventeen rules, and seventeen titles in a
    // centred paragraph is a wall rather than a summary. The names are here to
    // be recognised, not enumerated; the progress screen has the full list.
    const shown = appState.reset.slice(0, SUMMARY_RESET_LIMIT);
    const rest = appState.reset.length - shown.length;
    const titles = shown
      .map((id) => {
        const rule = ruleById(id);
        return escapeHtml(rule ? rule.title : id);
      })
      .join(", ");
    text +=
      `<br>\u0421\u0431\u0440\u043e\u0448\u0435\u043d\u044b \u043d\u0430 \u043d\u0430\u0447\u0430\u043b\u043e: ${titles}` +
      (rest > 0 ? ` \u0438 \u0435\u0449\u0451 ${rest}.` : ".");
  } else if (total > 0) {
    text += "<br>\u041d\u0438 \u043e\u0434\u043d\u043e \u043f\u0440\u0430\u0432\u0438\u043b\u043e \u043d\u0435 \u0441\u0431\u0440\u043e\u0448\u0435\u043d\u043e.";
  }
  setStatus(text);
  updateMeter();
  const next = elem("next");
  next.textContent = "\u0415\u0449\u0451 \u0440\u0430\u0437";
  next.hidden = false;
  // A session can end without a card having been drawn \u2014 nothing due, or the
  // queue emptied of rules with no sentences behind them \u2014 so the finished
  // state is stored here as well, and reloading on the summary shows the
  // summary again rather than starting a fresh twenty.
  storeSession();
}

function showCard() {
  clearFeedback();
  const next = elem("next");
  next.hidden = true;
  const session = appState.session;

  if (isSessionOver(session)) {
    showSummary();
    return;
  }
  const ruleId = nextRuleId(session);
  const rule = ruleId ? ruleById(ruleId) : null;
  const itemId = rule ? pickItemId(ITEMS, ruleId, appState.progress.items) : null;
  const item = itemId ? itemById(itemId) : null;
  if (!item) {
    // A rule with no sentences behind it cannot be asked. Drop it from the
    // queue without charging her a card and take the next one.
    if (!ruleId) {
      showSummary();
      return;
    }
    appState.session = { ...session, queue: session.queue.slice(1) };
    showCard();
    return;
  }

  appState.progress = recordShown(appState.progress, item.id, appState.tick);
  appState.tick += 1;
  storeSession();

  const mode = formatForLevel(levelOf(appState.progress, rule.id));
  appState.current = { rule, item, mode };
  appState.awaiting = false;
  // Both cards get the rule, and for the same reason the feedback panel does:
  // under an emphasis rule the card is asking for the more emphatic version,
  // not for a repair, and without the rule it would say \u00ab\u0418\u0441\u043f\u0440\u0430\u0432\u044c\u0442\u0435 \u043e\u0448\u0438\u0431\u043a\u0443.\u00bb
  // over two options that are both correct English.
  elem("card-host").innerHTML =
    mode === "typed"
      ? renderTypedCard(item, rule)
      : renderChoiceCard(item, buildOptions(item, Math.random), rule);

  updateMeter();
  setStatus(
    session.mode === "free"
      ? "\u041d\u0430 \u0441\u0435\u0433\u043e\u0434\u043d\u044f \u0432\u0441\u0451 \u043f\u043e\u0432\u0442\u043e\u0440\u0435\u043d\u043e. \u0421\u0432\u043e\u0431\u043e\u0434\u043d\u0430\u044f \u043f\u0440\u0430\u043a\u0442\u0438\u043a\u0430: \u043a\u0430\u0440\u0442\u043e\u0447\u043a\u0438 \u0438\u0434\u0443\u0442 \u043f\u043e \u0441\u0430\u043c\u044b\u043c \u0441\u043b\u0430\u0431\u044b\u043c \u043f\u0440\u0430\u0432\u0438\u043b\u0430\u043c."
      : ""
  );
}

// One answer, whichever card it came from. `given` \u2014 the option she tapped or
// the text she typed \u2014 goes to renderFeedback as well as to the grader: it is
// what lets the panel tell a plain-but-correct sentence under an emphasis rule
// from a real mistake. Scheduling never sees it.
function submitAnswer(given) {
  if (!appState.current || appState.awaiting) return;
  const { rule, item, mode } = appState.current;
  const result = mode === "typed" ? grade(item, given) : gradeChoice(item, given);
  // A typo repaired the rule, so mastery treats it exactly as a correct answer.
  // Only the wording of the panel differs.
  const wasRight = result.verdict === "correct" || result.verdict === "typo";

  appState.progress = applyAnswer(appState.progress, rule.id, wasRight, appState.today);
  appState.progress = recordDay(appState.progress, appState.today);
  // Separately from the level, and cumulatively: the level says where she is
  // now, and after a correct answer a rule she has missed nine times is
  // indistinguishable from one she has never seen. This is the difference.
  appState.progress = recordVerdict(appState.progress, rule.id, wasRight);

  appState.answered += 1;
  if (wasRight) appState.right += 1;
  else if (!appState.reset.includes(rule.id)) appState.reset.push(rule.id);

  // The session advances before anything is drawn, so that the single write
  // below carries the day count, the mastery, the counters and the meter
  // together. Split across two writes they could be a card apart on reload,
  // which is the disagreement this was supposed to end.
  appState.session = recordAnswer(appState.session, wasRight);
  storeSession();

  const host = elem("feedback-host");
  host.innerHTML = renderFeedback(result, rule, item, given);
  host.hidden = false;

  // Freeze the card she just answered: the options stay legible with the one
  // she chose marked, and neither the field nor the buttons can fire again.
  const card = elem("card-host");
  for (const option of card.querySelectorAll(".option")) {
    option.disabled = true;
    if (option.getAttribute("data-choice") === given) option.setAttribute("data-picked", "true");
  }
  const field = card.querySelector("#answer");
  if (field) field.disabled = true;
  const check = card.querySelector("#check");
  if (check) check.disabled = true;

  appState.awaiting = true;
  updateMeter();
  const next = elem("next");
  next.textContent = isSessionOver(appState.session) ? "\u0418\u0442\u043e\u0433\u0438" : "\u0414\u0430\u043b\u044c\u0448\u0435";
  next.hidden = false;
  revealFeedback();
}

// On a 375 px screen the card alone fills the viewport, so the panel opens
// below the fold and she would have to scroll to find out whether she was
// right. `#next` is no longer where this scroll can be computed from: the
// stylesheet now pins it above the tab bar with `position: sticky`, so its own
// rect stays put regardless of scroll position \u2014 a scroll computed from it
// would never fire. The panel is what actually needs to move, so this scrolls
// from the panel's own top, and only as far as it has to:
//
//   - enough to bring the panel's bottom up to the button's floor, if the
//     panel is short enough that doing so still leaves its top on screen \u2014
//     that shows the whole panel, and no more of the card above it is
//     cropped than has to be;
//   - otherwise, exactly enough to bring the panel's top to the very edge of
//     the viewport and no further, so the beginning she needs to start
//     reading from can never itself scroll past out of view. This is what a
//     panel taller than the room below the fold falls back to.
//
// The two share one line \u2014 `Math.min` picks whichever bound is tighter \u2014 and
// scrolling further than either would either hide the start of the panel or
// move it for no reason once it already fits. It also matters for the
// button: over-scrolling past what the panel needs can walk the page past
// its own natural end, and a sticky-positioned element that has run out of
// room below it to stay pinned in stops being pinned \u2014 still clear of the
// tab bar, just not sitting where the stylesheet put it. Asking for no more
// scroll than the panel needs is what keeps the two independent.
function revealFeedback() {
  const panel = elem("feedback-host");
  const next = elem("next");
  const rect = panel.getBoundingClientRect();
  if (rect.top <= 0) return; // already at, or past, the top edge
  const floor = next.getBoundingClientRect().top - 8;
  if (rect.bottom <= floor) return; // the whole panel already fits above the button
  const delta = Math.min(rect.top, rect.bottom - floor);
  const reduceMotion =
    window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  window.scrollBy({ top: delta, left: 0, behavior: reduceMotion ? "auto" : "smooth" });
}

function restartSession() {
  appState.session = startSession(
    appState.progress,
    RULES,
    appState.today,
    SESSION_CAP,
    appState.progress.topics
  );
  appState.answered = 0;
  appState.right = 0;
  appState.reset = [];
  storeSession();
  showCard();
}

// A reload is not a decision to start over. If a session was stored for today,
// it comes back exactly as she left it \u2014 how far into the cap she is, what she
// got right, and which rules went back to zero, so the summary survives the
// backgrounded tab that iOS Safari discards while the phone is in her pocket.
// A session stored on any earlier day is not resumed: yesterday's nine cards
// would otherwise be charged against today's twenty, and the day counter on
// \u041f\u0440\u043e\u0433\u0440\u0435\u0441\u0441, which is keyed by date, would go on disagreeing with the meter.
function resumeSession() {
  const stored = sessionFor(appState.progress, appState.today);
  if (!stored) {
    restartSession();
    return;
  }
  appState.session = {
    queue: stored.queue,
    cap: stored.cap,
    answered: stored.answered,
    mode: stored.mode,
    topics: stored.topics,
  };
  appState.answered = stored.answered;
  appState.right = stored.right;
  appState.reset = stored.reset.slice();
  showCard();
}

/* \u2500\u2500 the topic filter \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */

// #filter-host takes the whole control cluster \u2014 the filter button and the
// theme toggle \u2014 because renderControls emits them together.
function renderControlsHost() {
  elem("filter-host").innerHTML = renderControls(
    TOPICS,
    appState.progress.topics,
    themeIsDark()
  );
  const button = elem("filter");
  if (button) button.setAttribute("aria-expanded", appState.pickerOpen ? "true" : "false");
}

function renderPicker() {
  const host = elem("picker-host");
  if (!appState.pickerOpen) {
    host.hidden = true;
    host.innerHTML = "";
    return;
  }
  host.innerHTML = renderTopicPicker(
    TOPICS,
    RULES,
    appState.progress,
    appState.progress.topics,
    appState.today
  );
  host.hidden = false;
}

// Live mid-session on purpose: switchTopics carries the answered count and the
// cap forward, so changing the filter can neither escape the cap nor hand out a
// card that was already answered. A card already on screen and graded keeps its
// feedback \u2014 the new queue takes effect when she asks for the next one.
function applyTopics(selection) {
  appState.progress = setTopics(appState.progress, selection);
  persist();
  appState.session = switchTopics(
    appState.session,
    appState.progress,
    RULES,
    appState.today,
    appState.progress.topics
  );
  storeSession();
  renderControlsHost();
  renderPicker();
  if (appState.awaiting) updateMeter();
  else showCard();
}

function toggleTopic(id) {
  const selection = appState.progress.topics.slice();
  const at = selection.indexOf(id);
  if (at === -1) selection.push(id);
  else selection.splice(at, 1);
  applyTopics(selection);
}

function applyPreset(preset) {
  applyTopics(preset === "all" ? [] : topicIdsForDeck(TOPICS, preset));
}

/* \u2500\u2500 the other two screens \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */

// The shortlist at the top of \u041f\u0440\u043e\u0433\u0440\u0435\u0441\u0441 links to `#rule-<id>`, which is the id
// of a <details> further down the same screen. A native fragment jump only
// auto-expands a <details> when the id sits on content inside it; here the id
// is on the <details> itself, so the browser just scrolls to the closed
// summary and stops. Opening it by hand is the whole fix.
//
// This is called from two places, not one, because a `hashchange` event only
// fires when the hash actually changes. The tab bar's screen switch does not
// touch the hash, so returning to \u041f\u0440\u043e\u0433\u0440\u0435\u0441\u0441 with the same `#rule-<id>` still in
// the address bar \u2014 the ordinary case, since every visit rebuilds the row list
// from scratch and starts it closed again \u2014 fires no event at all. Calling
// this once after that rebuild, using whatever hash is already there, is what
// catches that case, and it is also what catches a page loaded directly onto
// a rule's hash before any tap happened. A stale hash or a removed rule id
// just finds nothing, which is why the lookup is checked rather than trusted.
function openHashTarget() {
  const hash = window.location.hash;
  if (hash.length < 2) return;
  const target = document.getElementById(hash.slice(1));
  if (target && "open" in target) target.open = true;
}

function renderProgressScreen() {
  const screen = elem("screen-progress");
  screen.innerHTML = renderProgress(RULES, appState.progress, appState.today, TOPICS);
  setIoOpen(null);
  openHashTarget();
}

function renderRulesScreen() {
  elem("screen-rules").innerHTML = renderRulesList(RULES);
}

function showScreen(name) {
  appState.screen = name;
  for (const id of ["session", "progress", "rules"]) {
    elem(`screen-${id}`).hidden = id !== name;
  }
  for (const tab of document.querySelectorAll(".tab")) {
    if (tab.getAttribute("data-screen") === name) tab.setAttribute("aria-current", "page");
    else tab.removeAttribute("aria-current");
  }
  if (name === "progress") renderProgressScreen();
  if (name === "rules") renderRulesScreen();
  window.scrollTo(0, 0);
}

// renderProgress emits the whole data block visible and leaves the showing to
// the wiring. There are now two independent boxes \u2014 #io-out, read-only, holds
// what was exported; #io-text is where a paste goes \u2014 each inside its own
// labelled group (.io-group-out / .io-group-in), so hiding one never touches
// the other's markup or value. Three states: `null` \u2014 nothing asked for yet,
// so only the two buttons; "export" \u2014 the out group is shown, with nothing to
// apply; "import" \u2014 the in group is shown, empty, waiting for a paste. Hiding
// a group hides its label and button along with it, since both live inside it.
//
// `failed` is the third argument because #io-note carries several different
// kinds of message \u2014 instruction lines, a copy or import success line, and a
// thrown error \u2014 and nothing in the markup tells them apart. The stylesheet
// therefore keeps the element quiet by default and paints only
// `data-state="error"`, so the alarm is ours to raise and, just as
// importantly, ours to clear: every other call removes the attribute rather
// than leaving the last failure coloured under a new message.
function setIoOpen(mode, note, failed) {
  const outGroup = document.querySelector("#screen-progress .io-group-out");
  const inGroup = document.querySelector("#screen-progress .io-group-in");
  const line = elem("io-note");
  if (!outGroup || !inGroup || !line) return;
  outGroup.hidden = mode !== "export";
  inGroup.hidden = mode !== "import";
  line.textContent = note || "";
  line.hidden = !note;
  if (failed) line.setAttribute("data-state", "error");
  else line.removeAttribute("data-state");
}

// Writes into #io-out, the read-only export box \u2014 never into #io-text, which
// is the import box and gets cleared every time \u00ab\u0417\u0430\u0433\u0440\u0443\u0437\u0438\u0442\u044c\u00bb opens it. The two
// used to be the same element, which meant opening the import box wiped an
// export she had not yet copied. Keeping them apart is what fixes that: this
// box's value is untouched by anything the import side does.
function handleExport() {
  const data = exportJSON(appState.progress);
  const fallback = () => {
    elem("io-out").value = data;
    setIoOpen("export", "\u0421\u043a\u043e\u043f\u0438\u0440\u0443\u0439\u0442\u0435 \u0442\u0435\u043a\u0441\u0442 \u0438 \u0441\u043e\u0445\u0440\u0430\u043d\u0438\u0442\u0435 \u0435\u0433\u043e \u0432 \u0444\u0430\u0439\u043b.");
  };
  const downloads = window.claude && window.claude.downloads;
  if (downloads && typeof downloads.save === "function") {
    try {
      const result = downloads.save({ filename: "english-trainer.json", data });
      if (result && typeof result.catch === "function") result.catch(fallback);
      return;
    } catch (e) {
      fallback();
      return;
    }
  }
  fallback();
}

function handleImportOpen() {
  elem("io-text").value = "";
  setIoOpen("import", "\u0412\u0441\u0442\u0430\u0432\u044c\u0442\u0435 \u0441\u044e\u0434\u0430 \u0432\u044b\u0433\u0440\u0443\u0436\u0435\u043d\u043d\u044b\u0439 JSON \u0438 \u043d\u0430\u0436\u043c\u0438\u0442\u0435 \u00ab\u041f\u0440\u0438\u043c\u0435\u043d\u0438\u0442\u044c\u00bb.");
  elem("io-text").focus();
}

// Unlike load(), an import is a deliberate act, so storage throws a message
// meant to be read and this is where it gets shown.
function handleImportApply() {
  let imported;
  try {
    imported = importJSON(elem("io-text").value);
  } catch (e) {
    // The message is written for her, so it belongs on the page and not in the
    // console. The pasted text stays where it is so she can fix it.
    setIoOpen("import", e.message, true);
    return;
  }
  appState.progress = setTopics(imported, pruneTopics(imported.topics));
  appState.tick = nextTick(appState.progress);
  persist();
  // resume rather than restart: an import that carries today's day count must
  // not land her on a fresh 0/20 beside it. A session from another day in the
  // file is dropped by the same rule as any other stale one.
  resumeSession();
  renderControlsHost();
  renderProgressScreen();
  setIoOpen(null, "\u041f\u0440\u043e\u0433\u0440\u0435\u0441\u0441 \u0437\u0430\u0433\u0440\u0443\u0436\u0435\u043d.");
}

// Getting 1412 characters of JSON out of a six-row box with a thumb is a
// long-press and a prayer, hence the button. navigator.clipboard needs a
// secure context, and the standalone build's file:// origin is not one in
// Safari, so it may simply not exist \u2014 this falls back to a selection-based
// copy rather than failing silently. Either way the note is only ever told
// success once a copy mechanism has actually reported success; an empty box
// or a failed copy gets an honest line instead, never a false "copied".
function legacySelectCopy(box) {
  try {
    box.focus();
    box.select();
    box.setSelectionRange(0, box.value.length);
    return typeof document.execCommand === "function" && document.execCommand("copy");
  } catch (e) {
    return false;
  }
}

function handleCopy() {
  const box = elem("io-out");
  if (!box) return;
  const text = box.value;
  if (!text) {
    // Nothing has been exported yet (or the box is somehow empty): say so
    // rather than reporting success or throwing.
    setIoOpen("export", "\u0421\u043d\u0430\u0447\u0430\u043b\u0430 \u043d\u0430\u0436\u043c\u0438\u0442\u0435 \u00ab\u0412\u044b\u0433\u0440\u0443\u0437\u0438\u0442\u044c\u00bb.", true);
    return;
  }
  const report = (ok) => {
    setIoOpen(
      "export",
      ok ? "\u0421\u043a\u043e\u043f\u0438\u0440\u043e\u0432\u0430\u043d\u043e." : "\u041d\u0435 \u0443\u0434\u0430\u043b\u043e\u0441\u044c \u0441\u043a\u043e\u043f\u0438\u0440\u043e\u0432\u0430\u0442\u044c. \u0412\u044b\u0434\u0435\u043b\u0438\u0442\u0435 \u0442\u0435\u043a\u0441\u0442 \u0438 \u0441\u043a\u043e\u043f\u0438\u0440\u0443\u0439\u0442\u0435 \u0432\u0440\u0443\u0447\u043d\u0443\u044e.",
      !ok
    );
  };
  const clipboard = window.navigator && window.navigator.clipboard;
  if (clipboard && typeof clipboard.writeText === "function") {
    clipboard.writeText(text).then(
      () => report(true),
      () => report(legacySelectCopy(box))
    );
    return;
  }
  report(legacySelectCopy(box));
}

/* \u2500\u2500 events \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */

// Delegation from the container elements, not per-button listeners: every
// render replaces the markup inside these hosts wholesale, so a listener bound
// to a button would be thrown away with it.
function bindEvents() {
  elem("card-host").addEventListener("click", (e) => {
    const option = e.target.closest(".option");
    if (option && !option.disabled) {
      submitAnswer(option.getAttribute("data-choice"));
      return;
    }
    if (e.target.closest("#check")) {
      const field = elem("answer");
      if (field) submitAnswer(field.value);
    }
  });

  // Enter submits, so the phone's "done" key finishes the card instead of
  // doing nothing.
  elem("card-host").addEventListener("keydown", (e) => {
    if (e.key !== "Enter") return;
    const field = e.target.closest("#answer");
    if (!field) return;
    e.preventDefault();
    submitAnswer(field.value);
  });

  elem("next").addEventListener("click", () => {
    if (isSessionOver(appState.session) && !appState.awaiting) restartSession();
    else showCard();
  });

  // One host, two controls: renderControls puts the filter and the theme
  // toggle in the same cluster, so they share a listener.
  elem("filter-host").addEventListener("click", (e) => {
    if (e.target.closest("#theme")) {
      toggleTheme();
      return;
    }
    if (!e.target.closest("#filter")) return;
    appState.pickerOpen = !appState.pickerOpen;
    renderControlsHost();
    renderPicker();
  });

  elem("picker-host").addEventListener("click", (e) => {
    const preset = e.target.closest("[data-preset]");
    if (preset) {
      applyPreset(preset.getAttribute("data-preset"));
      return;
    }
    const topic = e.target.closest("[data-topic]");
    if (topic) toggleTopic(topic.getAttribute("data-topic"));
  });

  elem("screen-progress").addEventListener("click", (e) => {
    if (e.target.closest("#export")) handleExport();
    else if (e.target.closest("#import")) handleImportOpen();
    else if (e.target.closest("#io-apply")) handleImportApply();
    else if (e.target.closest("#io-copy")) handleCopy();
  });

  document.querySelector(".tabbar").addEventListener("click", (e) => {
    const tab = e.target.closest(".tab");
    if (tab) showScreen(tab.getAttribute("data-screen"));
  });

  // Covers the live tap: a missed-rule link changing the hash while she is
  // already looking at \u041f\u0440\u043e\u0433\u0440\u0435\u0441\u0441. The revisit-with-the-same-hash case is
  // covered separately, from renderProgressScreen itself \u2014 see openHashTarget.
  window.addEventListener("hashchange", openHashTarget);
}

function boot() {
  const loaded = load(window.localStorage, STORAGE_KEY);
  appState.progress = setTopics(loaded, pruneTopics(loaded.topics));
  appState.today = todayISO(new Date());
  appState.tick = nextTick(appState.progress);
  bindEvents();
  renderControlsHost();
  renderPicker();
  resumeSession();
}

// Before anything else, and outside boot(): the root element exists as soon as
// this script runs, and stamping the stored theme on it here is what stops the
// page painting the OS theme first and correcting itself a moment later.
applyStoredTheme();

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", boot);
} else {
  boot();
}
</script>

</body>
</html>
