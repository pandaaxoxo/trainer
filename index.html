  },
  {
    id: "article-geographic-names",
    category: "grammar",
    title: "\u0410\u0440\u0442\u0438\u043a\u043b\u044c \u0432 \u0433\u0435\u043e\u0433\u0440\u0430\u0444\u0438\u0447\u0435\u0441\u043a\u0438\u0445 \u043d\u0430\u0437\u0432\u0430\u043d\u0438\u044f\u0445",
    explanation:
      "\u201cThe\u201d \u0441\u0442\u0430\u0432\u0438\u0442\u0441\u044f \u0441 \u0433\u043e\u0440\u043d\u044b\u043c\u0438 \u0446\u0435\u043f\u044f\u043c\u0438 (the Alps, the Andes), \u0440\u0435\u043a\u0430\u043c\u0438 (the Thames, " +
      "the Mekong), \u043c\u043e\u0440\u044f\u043c\u0438 \u0438 \u043e\u043a\u0435\u0430\u043d\u0430\u043c\u0438, \u043f\u0443\u0441\u0442\u044b\u043d\u044f\u043c\u0438 \u0438 \u0433\u0440\u0443\u043f\u043f\u0430\u043c\u0438 \u043e\u0441\u0442\u0440\u043e\u0432\u043e\u0432 (the Hebrides). " +
      "\u0410\u0440\u0442\u0438\u043a\u043b\u044f \u043d\u0435\u0442 \u0441 \u0443\u043b\u0438\u0446\u0430\u043c\u0438 (Mill Road), \u043f\u0430\u0440\u043a\u0430\u043c\u0438 (Hyde Park), \u043e\u0442\u0434\u0435\u043b\u044c\u043d\u044b\u043c\u0438 \u0432\u0435\u0440\u0448\u0438\u043d\u0430\u043c\u0438 " +
      "(Ben Nevis), \u043e\u0437\u0451\u0440\u0430\u043c\u0438 (Lake Como), \u043e\u0442\u0434\u0435\u043b\u044c\u043d\u044b\u043c\u0438 \u043e\u0441\u0442\u0440\u043e\u0432\u0430\u043c\u0438, \u043a\u043e\u043d\u0442\u0438\u043d\u0435\u043d\u0442\u0430\u043c\u0438 \u0438 " +
      "\u0431\u043e\u043b\u044c\u0448\u0438\u043d\u0441\u0442\u0432\u043e\u043c \u0441\u0442\u0440\u0430\u043d \u0438 \u0433\u043e\u0440\u043e\u0434\u043e\u0432. \u041b\u043e\u0433\u0438\u043a\u0438 \u0437\u0434\u0435\u0441\u044c \u043d\u0435\u043c\u043d\u043e\u0433\u043e: \u0440\u0430\u0431\u043e\u0442\u0430\u0435\u0442 \u043f\u0440\u043e\u0442\u0438\u0432\u043e\u043f\u043e\u0441\u0442\u0430\u0432\u043b\u0435\u043d\u0438\u0435 " +
      "\u00ab\u0441\u043e\u0432\u043e\u043a\u0443\u043f\u043d\u043e\u0441\u0442\u044c \u0438\u043b\u0438 \u043f\u0440\u043e\u0442\u044f\u0436\u0451\u043d\u043d\u044b\u0439 \u043e\u0431\u044a\u0435\u043a\u0442 \u2014 \u0441 \u0430\u0440\u0442\u0438\u043a\u043b\u0435\u043c, \u0435\u0434\u0438\u043d\u0438\u0447\u043d\u0430\u044f \u0442\u043e\u0447\u043a\u0430 \u2014 \u0431\u0435\u0437\u00bb.",
    example: {
      wrong: "The impact study covered villages along Mekong and offices on the Mill Road.",
      right: "The impact study covered villages along the Mekong and offices on Mill Road.",
    },
    registers: ["work"],
    topics: ["tutor-articles"],
  },
  {
    id: "article-a-affiliations",
    category: "grammar",
    title: "\u201cA / an\u201d \u0441 \u0440\u0435\u043b\u0438\u0433\u0438\u043e\u0437\u043d\u043e\u0439 \u0438 \u043f\u043e\u043b\u0438\u0442\u0438\u0447\u0435\u0441\u043a\u043e\u0439 \u043f\u0440\u0438\u043d\u0430\u0434\u043b\u0435\u0436\u043d\u043e\u0441\u0442\u044c\u044e",
    explanation:
      "\u041a\u043e\u0433\u0434\u0430 \u043f\u0440\u0438\u043d\u0430\u0434\u043b\u0435\u0436\u043d\u043e\u0441\u0442\u044c \u043d\u0430\u0437\u0432\u0430\u043d\u0430 \u0441\u0443\u0449\u0435\u0441\u0442\u0432\u0438\u0442\u0435\u043b\u044c\u043d\u044b\u043c, \u0430\u0440\u0442\u0438\u043a\u043b\u044c \u043e\u0431\u044f\u0437\u0430\u0442\u0435\u043b\u0435\u043d: she is a " +
      "socialist, he is an atheist, their chair is a republican. \u0422\u0430\u043a \u0436\u0435 \u0432\u0435\u0434\u0443\u0442 \u0441\u0435\u0431\u044f " +
      "\u043f\u0440\u043e\u0444\u0435\u0441\u0441\u0438\u0438 \u0438 \u0440\u043e\u043b\u0438: she is a researcher, he is a trustee. \u0421\u043b\u043e\u0432\u0430 \u043e \u0432\u0435\u0440\u043e\u0438\u0441\u043f\u043e\u0432\u0435\u0434\u0430\u043d\u0438\u0438 \u2014 " +
      "Catholic, Muslim, Buddhist, Jewish \u2014 \u0434\u0430\u0432\u043d\u043e \u0440\u0430\u0431\u043e\u0442\u0430\u044e\u0442 \u0438 \u043a\u0430\u043a \u043f\u0440\u0438\u043b\u0430\u0433\u0430\u0442\u0435\u043b\u044c\u043d\u044b\u0435, " +
      "\u043f\u043e\u044d\u0442\u043e\u043c\u0443 \u201cShe is Catholic\u201d \u0438 \u201cShe is Buddhist\u201d \u043d\u0435 \u0445\u0443\u0436\u0435 \u0432\u0430\u0440\u0438\u0430\u043d\u0442\u043e\u0432 \u0441 \u0430\u0440\u0442\u0438\u043a\u043b\u0435\u043c. " +
      "\u0410 \u0432\u043e\u0442 socialist, atheist, republican \u0432 \u044d\u0442\u043e\u0439 \u043a\u043e\u043d\u0441\u0442\u0440\u0443\u043a\u0446\u0438\u0438 \u043e\u0441\u0442\u0430\u044e\u0442\u0441\u044f " +
      "\u0441\u0443\u0449\u0435\u0441\u0442\u0432\u0438\u0442\u0435\u043b\u044c\u043d\u044b\u043c\u0438, \u0438 \u0430\u0440\u0442\u0438\u043a\u043b\u044c \u043f\u0440\u0438 \u043d\u0438\u0445 \u043e\u0431\u044f\u0437\u0430\u0442\u0435\u043b\u0435\u043d. \u0420\u0443\u0441\u0441\u043a\u043e\u0435 \u00ab\u041e\u043d\u0430 \u0441\u043e\u0446\u0438\u0430\u043b\u0438\u0441\u0442\u043a\u0430\u00bb " +
      "\u043e\u0431\u0445\u043e\u0434\u0438\u0442\u0441\u044f \u0431\u0435\u0437 \u0432\u0441\u044f\u043a\u043e\u0433\u043e \u043f\u043e\u043a\u0430\u0437\u0430\u0442\u0435\u043b\u044f, \u043f\u043e\u044d\u0442\u043e\u043c\u0443 \u0430\u0440\u0442\u0438\u043a\u043b\u044c \u0437\u0434\u0435\u0441\u044c \u0432\u044b\u043f\u0430\u0434\u0430\u0435\u0442 \u043e\u0441\u043e\u0431\u0435\u043d\u043d\u043e \u043b\u0435\u0433\u043a\u043e.",
    example: {
      wrong: "Our new trustee is socialist and the incoming chair is atheist.",
      right: "Our new trustee is a socialist and the incoming chair is an atheist.",
    },
    registers: ["work"],
    topics: ["tutor-articles"],
  },
  {
    id: "article-a-the-with-names",
    category: "grammar",
    title: "\u0410\u0440\u0442\u0438\u043a\u043b\u044c \u043f\u0435\u0440\u0435\u0434 \u0438\u043c\u0435\u043d\u0435\u043c \u0441\u043e\u0431\u0441\u0442\u0432\u0435\u043d\u043d\u044b\u043c",
    explanation:
      "\u0418\u043c\u044f \u0441\u043e\u0431\u0441\u0442\u0432\u0435\u043d\u043d\u043e\u0435 \u043e\u0431\u044b\u0447\u043d\u043e \u0438\u0434\u0451\u0442 \u0431\u0435\u0437 \u0430\u0440\u0442\u0438\u043a\u043b\u044f, \u043d\u043e \u0435\u0441\u0442\u044c \u0434\u0432\u0430 \u0436\u0438\u0432\u044b\u0445 \u0438\u0441\u043a\u043b\u044e\u0447\u0435\u043d\u0438\u044f. \u201cA + " +
      "\u0438\u043c\u044f\u201d \u0437\u043d\u0430\u0447\u0438\u0442 \u00ab\u043d\u0435\u043a\u0438\u0439, \u043a\u0430\u043a\u043e\u0439-\u0442\u043e\u00bb. \u0413\u043e\u0432\u043e\u0440\u044f\u0449\u0438\u0439 \u044d\u0442\u043e\u0433\u043e \u0447\u0435\u043b\u043e\u0432\u0435\u043a\u0430 \u043d\u0435 \u0437\u043d\u0430\u0435\u0442: \u201cA Morgan " +
      "rang for you\u201d. \u201cThe + \u0438\u043c\u044f\u201d \u043f\u043e\u0434 \u0443\u0434\u0430\u0440\u0435\u043d\u0438\u0435\u043c \u0437\u043d\u0430\u0447\u0438\u0442 \u00ab\u0442\u043e\u0442 \u0441\u0430\u043c\u044b\u0439, \u0438\u0437\u0432\u0435\u0441\u0442\u043d\u044b\u0439\u00bb: " +
      "\u201cthe Morgan who wrote the funding report\u201d. \u041e\u0431\u0430 \u043e\u0431\u043e\u0440\u043e\u0442\u0430 \u0440\u0430\u0437\u0433\u043e\u0432\u043e\u0440\u043d\u044b\u0435 \u0438 \u0447\u0430\u0441\u0442\u043e " +
      "\u0438\u0434\u0443\u0442 \u0441 \u043b\u0451\u0433\u043a\u043e\u0439 \u0438\u0440\u043e\u043d\u0438\u0435\u0439.",
    example: {
      wrong: "Morgan rang for you, and I asked whether she was Morgan who wrote the funding report.",
      right: "A Morgan rang for you, and I asked whether she was the Morgan who wrote the funding report.",
    },
    registers: ["everyday"],
    topics: ["tutor-articles"],
  },
  {
    id: "quantifier-some-any",
    category: "grammar",
    title: "\u201cSome\u201d \u0438 \u201cany\u201d \u043f\u0435\u0440\u0435\u0434 \u043c\u043d\u043e\u0436\u0435\u0441\u0442\u0432\u0435\u043d\u043d\u044b\u043c \u0438 \u043d\u0435\u0438\u0441\u0447\u0438\u0441\u043b\u044f\u0435\u043c\u044b\u043c",
    explanation:
      "\u201cSome\u201d \u0438 \u201cany\u201d \u043e\u0431\u043e\u0437\u043d\u0430\u0447\u0430\u044e\u0442 \u043d\u0435\u043e\u043f\u0440\u0435\u0434\u0435\u043b\u0451\u043d\u043d\u043e\u0435, \u043e\u0433\u0440\u0430\u043d\u0438\u0447\u0435\u043d\u043d\u043e\u0435 \u043a\u043e\u043b\u0438\u0447\u0435\u0441\u0442\u0432\u043e \u043f\u0435\u0440\u0435\u0434 " +
      "\u043c\u043d\u043e\u0436\u0435\u0441\u0442\u0432\u0435\u043d\u043d\u044b\u043c\u0438 \u0438 \u043d\u0435\u0438\u0441\u0447\u0438\u0441\u043b\u044f\u0435\u043c\u044b\u043c\u0438 \u0441\u0443\u0449\u0435\u0441\u0442\u0432\u0438\u0442\u0435\u043b\u044c\u043d\u044b\u043c\u0438. \u201cSome\u201d \u2014 \u0432 \u0443\u0442\u0432\u0435\u0440\u0436\u0434\u0435\u043d\u0438\u044f\u0445, \u0430 " +
      "\u0442\u0430\u043a\u0436\u0435 \u0432 \u043f\u0440\u0435\u0434\u043b\u043e\u0436\u0435\u043d\u0438\u044f\u0445 \u0438 \u043f\u0440\u043e\u0441\u044c\u0431\u0430\u0445, \u0433\u0434\u0435 \u0436\u0434\u0443\u0442 \u0441\u043e\u0433\u043b\u0430\u0441\u0438\u044f (\u201cWould you like some " +
      "tea?\u201d); \u201cany\u201d \u2014 \u0432 \u0432\u043e\u043f\u0440\u043e\u0441\u0430\u0445, \u043e\u0442\u0440\u0438\u0446\u0430\u043d\u0438\u044f\u0445 \u0438 \u043f\u043e\u0441\u043b\u0435 if. \u0420\u0443\u0441\u0441\u043a\u0438\u0439 \u0432 \u0442\u0430\u043a\u0438\u0445 " +
      "\u043f\u0440\u0435\u0434\u043b\u043e\u0436\u0435\u043d\u0438\u044f\u0445 \u043e\u0441\u0442\u0430\u0432\u043b\u044f\u0435\u0442 \u0441\u0443\u0449\u0435\u0441\u0442\u0432\u0438\u0442\u0435\u043b\u044c\u043d\u043e\u0435 \u0433\u043e\u043b\u044b\u043c (\u00ab\u0443 \u043c\u0435\u043d\u044f \u0435\u0441\u0442\u044c \u0437\u0430\u043c\u0435\u0442\u043a\u0438\u00bb), \u043f\u043e\u044d\u0442\u043e\u043c\u0443 " +
      "\u043a\u0432\u0430\u043d\u0442\u0438\u0444\u0438\u043a\u0430\u0442\u043e\u0440 \u0440\u0435\u0433\u0443\u043b\u044f\u0440\u043d\u043e \u0442\u0435\u0440\u044f\u0435\u0442\u0441\u044f. \u041f\u043e-\u0430\u043d\u0433\u043b\u0438\u0439\u0441\u043a\u0438 \u043f\u0443\u0441\u0442\u043e\u0435 \u043c\u0435\u0441\u0442\u043e \u0437\u0434\u0435\u0441\u044c \u0437\u0432\u0443\u0447\u0438\u0442 " +
      "\u043e\u0431\u0440\u044b\u0432\u043e\u0447\u043d\u043e.",
    example: {
      wrong: "Do you have questions about the consent form? I have notes from yesterday.",
      right: "Do you have any questions about the consent form? I have some notes from yesterday.",
    },
    registers: ["work", "everyday"],
    topics: ["tutor-quantifiers"],
  },
  {

      "\u201cno + \u0441\u0443\u0449\u0435\u0441\u0442\u0432\u0438\u0442\u0435\u043b\u044c\u043d\u043e\u0435\u201d \u0437\u0432\u0443\u0447\u0438\u0442 \u043a\u0430\u0442\u0435\u0433\u043e\u0440\u0438\u0447\u043d\u0435\u0435 \u0438 \u0443\u043c\u0435\u0441\u0442\u043d\u0435\u0435 \u0432 \u043f\u0438\u0441\u044c\u043c\u0435\u043d\u043d\u043e\u043c \u0442\u0435\u043a\u0441\u0442\u0435; " +
      "\u201cnot any\u201d \u0440\u0430\u0437\u0433\u043e\u0432\u043e\u0440\u043d\u0435\u0435, \u043d\u043e \u0440\u0430\u0431\u043e\u0442\u0430\u0435\u0442 \u0442\u043e\u043b\u044c\u043a\u043e \u043f\u0440\u0438 \u0436\u0451\u0441\u0442\u043a\u043e\u043c \u0443\u0441\u043b\u043e\u0432\u0438\u0438: \u043e\u0442\u0440\u0438\u0446\u0430\u043d\u0438\u0435 " +
      "\u0434\u043e\u043b\u0436\u043d\u043e \u0441\u0442\u043e\u044f\u0442\u044c \u043d\u0430 \u0433\u043b\u0430\u0433\u043e\u043b\u0435 (\u201cthere isn\u2019t any budget\u201d, \u201cwe haven\u2019t got any " +
      "data\u201d). \u0421\u0430\u043c\u043e \u043f\u043e \u0441\u0435\u0431\u0435, \u043f\u0440\u0438 \u0443\u0442\u0432\u0435\u0440\u0434\u0438\u0442\u0435\u043b\u044c\u043d\u043e\u043c \u0441\u043a\u0430\u0437\u0443\u0435\u043c\u043e\u043c, \u043e\u043d\u043e \u043d\u0435\u0432\u043e\u0437\u043c\u043e\u0436\u043d\u043e: \u201cthe " +

      "explanation\u201d \u0438\u043b\u0438 \u201cdoes not offer any explanation\u201d. \u0412 \u043f\u043e\u0434\u043b\u0435\u0436\u0430\u0449\u0435\u043c \u0432\u044b\u0431\u043e\u0440\u0430 \u043d\u0435\u0442 " +
      "\u0442\u0435\u043c \u0431\u043e\u043b\u0435\u0435: \u043f\u0440\u0435\u0434\u043b\u043e\u0436\u0435\u043d\u0438\u0435 \u043c\u043e\u0436\u0435\u0442 \u043d\u0430\u0447\u0438\u043d\u0430\u0442\u044c\u0441\u044f \u0442\u043e\u043b\u044c\u043a\u043e \u0441 \u201cNo participant asked\u2026\u201d, " +
      "\u0432\u0430\u0440\u0438\u0430\u043d\u0442 \u0441 \u201cnot any\u201d \u0442\u0430\u043c \u043d\u0435\u0432\u043e\u0437\u043c\u043e\u0436\u0435\u043d. \u0421 \u0438\u0441\u0447\u0438\u0441\u043b\u044f\u0435\u043c\u044b\u043c \u0432 \u0435\u0434\u0438\u043d\u0441\u0442\u0432\u0435\u043d\u043d\u043e\u043c \u0447\u0438\u0441\u043b\u0435 " +
      "\u0438\u0441\u043f\u043e\u043b\u044c\u0437\u0443\u0435\u0442\u0441\u044f \u201cno\u201d \u0438\u043b\u0438 \u201cnot a / an\u201d. \u0418 \u043f\u043e\u043c\u043d\u0438\u0442\u0435 \u043f\u0440\u043e \u043e\u0434\u043d\u043e \u043e\u0442\u0440\u0438\u0446\u0430\u043d\u0438\u0435 \u043d\u0430 " +

  {
    id: "quantifier-any-some-singular",

  {
    id: "quantifier-double-determiners",
    category: "grammar",
    title: "\u0414\u0432\u0430 \u043e\u043f\u0440\u0435\u0434\u0435\u043b\u0438\u0442\u0435\u043b\u044f \u043f\u043e\u0434\u0440\u044f\u0434: \u201canother three days\u201d, \u201cmy every move\u201d",
    explanation:
      "\u0410\u043d\u0433\u043b\u0438\u0439\u0441\u043a\u0438\u0439 \u0434\u043e\u043f\u0443\u0441\u043a\u0430\u0435\u0442 \u043d\u0435\u0441\u043a\u043e\u043b\u044c\u043a\u043e \u0443\u0441\u0442\u043e\u0439\u0447\u0438\u0432\u044b\u0445 \u0441\u043e\u0447\u0435\u0442\u0430\u043d\u0438\u0439 \u043e\u043f\u0440\u0435\u0434\u0435\u043b\u0438\u0442\u0435\u043b\u0435\u0439, \u0438 \u043f\u043e\u0440\u044f\u0434\u043e\u043a \u0432 " +
      "\u043d\u0438\u0445 \u0436\u0451\u0441\u0442\u043a\u0438\u0439. \u201cAnother\u201d \u043f\u0435\u0440\u0435\u0434 \u0447\u0438\u0441\u043b\u0438\u0442\u0435\u043b\u044c\u043d\u044b\u043c \u0438 \u043c\u043d\u043e\u0436\u0435\u0441\u0442\u0432\u0435\u043d\u043d\u044b\u043c \u0447\u0438\u0441\u043b\u043e\u043c \u0437\u043d\u0430\u0447\u0438\u0442 \u00ab\u0435\u0449\u0451 " +
      "\u0441\u0442\u043e\u043b\u044c\u043a\u043e-\u0442\u043e\u00bb: another three days, \u0438 \u0442\u043e \u0436\u0435 \u0441\u0430\u043c\u043e\u0435 \u043c\u043e\u0436\u043d\u043e \u0441\u043a\u0430\u0437\u0430\u0442\u044c \u043a\u0430\u043a three more " +
      "days. \u041f\u0440\u0438\u0442\u044f\u0436\u0430\u0442\u0435\u043b\u044c\u043d\u043e\u0435 \u0441 \u201cevery\u201d \u043f\u0435\u0440\u0435\u0434 \u0435\u0434\u0438\u043d\u0441\u0442\u0432\u0435\u043d\u043d\u044b\u043c \u0447\u0438\u0441\u043b\u043e\u043c \u2014 \u044d\u043c\u0444\u0430\u0442\u0438\u0447\u0435\u0441\u043a\u0438\u0439 " +
      "\u043e\u0431\u043e\u0440\u043e\u0442: my every move, his every decision. \u201cThe many\u201d \u0438 \u201cthe few\u201d \u043f\u0435\u0440\u0435\u0434 " +

  {

  {

      "a transcript\u201d. \u0410 \u0432\u043e\u0442 past simple \u0442\u0430\u043a \u043d\u0435 \u0441\u043e\u043a\u0440\u0430\u0449\u0430\u0435\u0442\u0441\u044f: \u201cthe people who took part\u201d \u2192 \u201cthe " +
      "people taking part\u201d \u043c\u0435\u043d\u044f\u0435\u0442 \u0438 \u0432\u0440\u0435\u043c\u044f, \u0438 \u0441\u043c\u044b\u0441\u043b. \u041e\u0441\u043d\u043e\u0432\u043d\u043e\u0439 \u0441\u043b\u0443\u0447\u0430\u0439 \u2014 \u0438\u043c\u0435\u043d\u043d\u043e \u043e\u0433\u0440\u0430\u043d\u0438\u0447\u0438\u0442\u0435\u043b\u044c\u043d\u043e\u0435 " +
      "\u043f\u0440\u0438\u0434\u0430\u0442\u043e\u0447\u043d\u043e\u0435 \u0431\u0435\u0437 \u0437\u0430\u043f\u044f\u0442\u044b\u0445, \u0442\u0430\u043c \u0441\u043e\u043a\u0440\u0430\u0449\u0435\u043d\u0438\u0435 \u0437\u0432\u0443\u0447\u0438\u0442 \u0435\u0441\u0442\u0435\u0441\u0442\u0432\u0435\u043d\u043d\u0435\u0435 \u0432\u0441\u0435\u0433\u043e. \u041d\u043e \u0438 \u0441 \u0443\u0442\u043e\u0447\u043d\u044f\u044e\u0449\u0438\u043c " +
      "\u043f\u0440\u0438\u0434\u0430\u0442\u043e\u0447\u043d\u044b\u043c, \u043e\u0442\u0434\u0435\u043b\u0451\u043d\u043d\u044b\u043c \u0437\u0430\u043f\u044f\u0442\u044b\u043c\u0438, \u043f\u0440\u0438\u0451\u043c \u0440\u0430\u0431\u043e\u0442\u0430\u0435\u0442, \u043e\u0441\u043e\u0431\u0435\u043d\u043d\u043e \u0441 \u043f\u0440\u0438\u0447\u0430\u0441\u0442\u0438\u0435\u043c \u043f\u0440\u043e\u0448\u0435\u0434\u0448\u0435\u0433\u043e " +
      "\u0432\u0440\u0435\u043c\u0435\u043d\u0438 \u0438 \u043f\u0430\u0441\u0441\u0438\u0432\u043e\u043c: \u201cThe trustees, who were alarmed by the figures, called a special " +
      "meeting\u201d \u2192 \u201cThe trustees, alarmed by the figures, called a special meeting\u201d. \u0422\u0430\u043a\u043e\u0439 " +
      "\u043e\u0431\u043e\u0440\u043e\u0442 \u0442\u044f\u0436\u0435\u043b\u0435\u0435 \u0438 \u043a\u043d\u0438\u0436\u043d\u0435\u0435, \u043f\u043e\u044d\u0442\u043e\u043c\u0443 \u0432 \u0440\u0430\u0437\u0433\u043e\u0432\u043e\u0440\u043d\u043e\u0439 \u0440\u0435\u0447\u0438 \u043e\u043d \u0432\u0441\u0442\u0440\u0435\u0447\u0430\u0435\u0442\u0441\u044f \u0440\u0435\u0434\u043a\u043e. \u0421\u043e\u043a\u0440\u0430\u0449\u0451\u043d\u043d\u044b\u0439 " +
      "\u0432\u0430\u0440\u0438\u0430\u043d\u0442 \u043a\u043e\u0440\u043e\u0447\u0435 \u0438 \u0437\u0432\u0443\u0447\u0438\u0442 \u043b\u0435\u0433\u0447\u0435.",

  {
    id: "modal-be-able-formal",
    category: "grammar",
    title: "\u201cBe able to\u201d \u0438 \u201cbe unable to\u201d \u043a\u0430\u043a \u0444\u043e\u0440\u043c\u0430\u043b\u044c\u043d\u0430\u044f \u0437\u0430\u043c\u0435\u043d\u0430 can",
    explanation:
      "\u201cBe able / unable to\u201d \u2014 \u0444\u043e\u0440\u043c\u0430\u043b\u044c\u043d\u044b\u0439 \u044d\u043a\u0432\u0438\u0432\u0430\u043b\u0435\u043d\u0442 can \u0438 can\u2019t, \u043e\u0431\u044b\u0447\u043d\u044b\u0439 \u0434\u043b\u044f \u0434\u043e\u043a\u0443\u043c\u0435\u043d\u0442\u043e\u0432 \u0438 " +
      "\u043e\u0444\u0438\u0446\u0438\u0430\u043b\u044c\u043d\u044b\u0445 \u043f\u0438\u0441\u0435\u043c. \u041a\u0440\u043e\u043c\u0435 \u0440\u0435\u0433\u0438\u0441\u0442\u0440\u0430 \u0443 \u043d\u0435\u0433\u043e \u0435\u0441\u0442\u044c \u0447\u0438\u0441\u0442\u043e \u0433\u0440\u0430\u043c\u043c\u0430\u0442\u0438\u0447\u0435\u0441\u043a\u0430\u044f \u043d\u0435\u043e\u0431\u0445\u043e\u0434\u0438\u043c\u043e\u0441\u0442\u044c: \u0443 " +
      "\u043c\u043e\u0434\u0430\u043b\u044c\u043d\u043e\u0433\u043e can \u043d\u0435\u0442 \u043d\u0438 \u0438\u043d\u0444\u0438\u043d\u0438\u0442\u0438\u0432\u0430, \u043d\u0438 \u043f\u0440\u0438\u0447\u0430\u0441\u0442\u0438\u044f, \u043f\u043e\u044d\u0442\u043e\u043c\u0443 \u043f\u043e\u0441\u043b\u0435 \u0434\u0440\u0443\u0433\u043e\u0433\u043e \u043c\u043e\u0434\u0430\u043b\u044c\u043d\u043e\u0433\u043e, \u0432 " +
      "\u043f\u0435\u0440\u0444\u0435\u043a\u0442\u0435 \u0438 \u043f\u043e\u0441\u043b\u0435 to \u0440\u0430\u0431\u043e\u0442\u0430\u0435\u0442 \u0442\u043e\u043b\u044c\u043a\u043e \u201cbe able to\u201d: \u201cmight be able to\u201d, \u201chas been able " +
      "to\u201d, \u201cwe hope to be able to\u201d.",
    plainNote: "\u041e\u0431\u0430 \u0432\u0430\u0440\u0438\u0430\u043d\u0442\u0430 \u0432\u0435\u0440\u043d\u044b \u0442\u0430\u043c, \u0433\u0434\u0435 can \u0432\u043e\u043e\u0431\u0449\u0435 \u0432\u043e\u0437\u043c\u043e\u0436\u0435\u043d.",
    example: {
      wrong: "Applicants who can\u2019t attend in person can join online.",
      right: "Applicants unable to attend in person may join online.",
    },
    registers: ["work"],
    topics: ["tutor-modals-can"],
    emphasis: true,
    goal: "formal",
  },
  {
    id: "modal-was-able-managed",
    category: "grammar",
    title: "\u201cWas able to\u201d \u0438 \u201cmanaged to\u201d \u0432\u043c\u0435\u0441\u0442\u043e \u201ccould\u201d",
    explanation:
      "\u0412 \u0443\u0442\u0432\u0435\u0440\u0434\u0438\u0442\u0435\u043b\u044c\u043d\u043e\u043c \u043f\u0440\u0435\u0434\u043b\u043e\u0436\u0435\u043d\u0438\u0438 \u201ccould\u201d \u043e\u0437\u043d\u0430\u0447\u0430\u0435\u0442 \u043e\u0431\u0449\u0443\u044e \u0441\u043f\u043e\u0441\u043e\u0431\u043d\u043e\u0441\u0442\u044c \u0432 \u043f\u0440\u043e\u0448\u043b\u043e\u043c \u2014 " +
      "\u00ab\u0443\u043c\u0435\u043b, \u043c\u043e\u0433 \u0432\u043e\u043e\u0431\u0449\u0435\u00bb. \u0414\u043b\u044f \u043e\u0434\u043d\u043e\u0433\u043e \u043a\u043e\u043d\u043a\u0440\u0435\u0442\u043d\u043e\u0433\u043e \u0441\u043b\u0443\u0447\u0430\u044f, \u0433\u0434\u0435 \u0443\u0441\u0438\u043b\u0438\u0435 \u0443\u0432\u0435\u043d\u0447\u0430\u043b\u043e\u0441\u044c " +
      "\u0443\u0441\u043f\u0435\u0445\u043e\u043c, \u043d\u0443\u0436\u043d\u043e \u201cwas / were able to\u201d \u0438\u043b\u0438 \u201cmanaged to\u201d. \u0412 \u043e\u0442\u0440\u0438\u0446\u0430\u043d\u0438\u0438 \u044d\u0442\u043e\u0433\u043e " +
      "\u043e\u0433\u0440\u0430\u043d\u0438\u0447\u0435\u043d\u0438\u044f \u043d\u0435\u0442: \u201ccouldn\u2019t finish\u201d \u0441\u043e\u0432\u0435\u0440\u0448\u0435\u043d\u043d\u043e \u043d\u043e\u0440\u043c\u0430\u043b\u044c\u043d\u043e. \u0420\u0443\u0441\u0441\u043a\u043e\u0435 \u00ab\u0441\u043c\u043e\u0433\u00bb " +
      "\u043f\u043e\u043a\u0440\u044b\u0432\u0430\u0435\u0442 \u043e\u0431\u0430 \u0441\u043c\u044b\u0441\u043b\u0430 \u0441\u0440\u0430\u0437\u0443, \u043f\u043e\u044d\u0442\u043e\u043c\u0443 \u201ccould\u201d \u043f\u043e\u0434\u0441\u0442\u0430\u0432\u043b\u044f\u0435\u0442\u0441\u044f \u0432 \u0435\u0434\u0438\u043d\u0438\u0447\u043d\u044b\u0435 " +
      "\u0434\u043e\u0441\u0442\u0438\u0436\u0435\u043d\u0438\u044f \u0430\u0432\u0442\u043e\u043c\u0430\u0442\u0438\u0447\u0435\u0441\u043a\u0438. \u0417\u0434\u0435\u0441\u044c \u044d\u0442\u043e \u043e\u0448\u0438\u0431\u043a\u0430, \u0430 \u043d\u0435 \u043e\u0442\u0442\u0435\u043d\u043e\u043a.",
    example: {
      wrong: "The screen reader crashed twice, but we could finish the session.",
      right: "The screen reader crashed twice, but we were able to finish the session.",
    },
    registers: ["work"],
    topics: ["tutor-modals-can"],
  },
  {
    id: "modal-can-general-could-specific",
    category: "grammar",
    title: "\u201cCan\u201d \u043e \u0432\u043e\u0437\u043c\u043e\u0436\u043d\u043e\u0441\u0442\u0438 \u0432\u043e\u043e\u0431\u0449\u0435, \u201ccould\u201d \u043e \u043a\u043e\u043d\u043a\u0440\u0435\u0442\u043d\u043e\u0439",
    explanation:
      "\u201cCan\u201d \u043e\u043f\u0438\u0441\u044b\u0432\u0430\u0435\u0442, \u0447\u0442\u043e \u0431\u044b\u0432\u0430\u0435\u0442 \u0432 \u043f\u0440\u0438\u043d\u0446\u0438\u043f\u0435: \u201cInterviews can run over\u201d \u2014 \u0442\u0430\u043a\u043e\u0435 " +
      "\u0441\u043b\u0443\u0447\u0430\u0435\u0442\u0441\u044f. \u041a\u0430\u043a \u0442\u043e\u043b\u044c\u043a\u043e \u0440\u0435\u0447\u044c \u0437\u0430\u0445\u043e\u0434\u0438\u0442 \u043e \u043a\u043e\u043d\u043a\u0440\u0435\u0442\u043d\u043e\u043c \u0441\u043b\u0443\u0447\u0430\u0435, \u043d\u0443\u0436\u0435\u043d \u201ccould\u201d, " +
      "\u201cmay\u201d \u0438\u043b\u0438 \u201cmight\u201d: \u201cThis interview could run over\u201d. \u041f\u043e\u0434\u0441\u0442\u0430\u0432\u0438\u0442\u044c \u201ccan\u201d \u043a " +
      "\u043e\u043f\u0440\u0435\u0434\u0435\u043b\u0451\u043d\u043d\u043e\u0439 \u0441\u0438\u0442\u0443\u0430\u0446\u0438\u0438 \u2014 \u0440\u0430\u0441\u043f\u0440\u043e\u0441\u0442\u0440\u0430\u043d\u0451\u043d\u043d\u0430\u044f \u043e\u0448\u0438\u0431\u043a\u0430, \u0438 \u0441\u043c\u044b\u0441\u043b \u043f\u0440\u0438 \u044d\u0442\u043e\u043c \u043f\u043b\u044b\u0432\u0451\u0442: " +
      "\u0444\u0440\u0430\u0437\u0430 \u043d\u0430\u0447\u0438\u043d\u0430\u0435\u0442 \u0437\u0432\u0443\u0447\u0430\u0442\u044c \u043a\u0430\u043a \u0440\u0430\u0437\u0440\u0435\u0448\u0435\u043d\u0438\u0435 (\u00ab\u044d\u0442\u043e\u043c\u0443 \u0438\u043d\u0442\u0435\u0440\u0432\u044c\u044e \u043c\u043e\u0436\u043d\u043e \u0437\u0430\u0442\u044f\u043d\u0443\u0442\u044c\u0441\u044f\u00bb).",
    example: {

      right: "This particular interview could run over, so leave a gap after it.",
    },
    registers: ["work"],
    topics: ["tutor-modals-can"],
  },
  {
    id: "modal-could-future-prediction",
    category: "grammar",
    title: "\u201cCould\u201d, \u0430 \u043d\u0435 \u201ccan\u201d, \u0432 \u043f\u0440\u0435\u0434\u0441\u043a\u0430\u0437\u0430\u043d\u0438\u0438 \u043e \u0431\u0443\u0434\u0443\u0449\u0435\u043c",
    explanation:
      "\u0414\u043b\u044f \u0443\u0442\u0432\u0435\u0440\u0434\u0438\u0442\u0435\u043b\u044c\u043d\u043e\u0433\u043e \u043f\u0440\u0435\u0434\u043f\u043e\u043b\u043e\u0436\u0435\u043d\u0438\u044f \u043e \u0431\u0443\u0434\u0443\u0449\u0435\u043c \u0438\u0441\u043f\u043e\u043b\u044c\u0437\u0443\u044e\u0442\u0441\u044f could, may \u0438 might, " +
      "\u043d\u043e \u043d\u0435 can: \u201cThe funding round could close before we submit\u201d. \u0412 \u043e\u0442\u0440\u0438\u0446\u0430\u043d\u0438\u0438 " +
      "\u043a\u0430\u0440\u0442\u0438\u043d\u0430 \u0434\u0440\u0443\u0433\u0430\u044f: \u0442\u0430\u043c \u0440\u0430\u0431\u043e\u0442\u0430\u044e\u0442 \u201cmay not\u201d \u0438 \u201cmight not\u201d (\u00ab\u0432\u043e\u0437\u043c\u043e\u0436\u043d\u043e, \u043d\u0435 " +
      "\u0437\u0430\u043a\u0440\u043e\u0435\u0442\u0441\u044f\u00bb), \u0442\u043e\u0433\u0434\u0430 \u043a\u0430\u043a \u201ccouldn\u2019t\u201d \u043e\u0437\u043d\u0430\u0447\u0430\u043b\u043e \u0431\u044b \u0443\u0432\u0435\u0440\u0435\u043d\u043d\u043e\u0441\u0442\u044c \u0432 \u043d\u0435\u0432\u043e\u0437\u043c\u043e\u0436\u043d\u043e\u0441\u0442\u0438. " +
      "\u041f\u0430\u0440\u0430 \u201ccould\u201d \u0438 \u201ccouldn\u2019t\u201d \u0442\u0430\u043a\u0438\u043c \u043e\u0431\u0440\u0430\u0437\u043e\u043c \u043d\u0435\u0441\u0438\u043c\u043c\u0435\u0442\u0440\u0438\u0447\u043d\u0430, \u0438 \u044d\u0442\u043e \u0441\u0442\u043e\u0438\u0442 \u0434\u0435\u0440\u0436\u0430\u0442\u044c " +
      "\u0432 \u0433\u043e\u043b\u043e\u0432\u0435 \u043e\u0442\u0434\u0435\u043b\u044c\u043d\u043e.",
    example: {
      wrong: "The new funding round can close before we submit.",
      right: "The new funding round could close before we submit.",
    },
    registers: ["work"],
    topics: ["tutor-modals-can"],
  },
  {
    id: "modal-cant-have-certainty",

    title: "\u201cCan\u2019t have\u201d \u0434\u043b\u044f \u0443\u0432\u0435\u0440\u0435\u043d\u043d\u043e\u0433\u043e \u043e\u0442\u0440\u0438\u0446\u0430\u0442\u0435\u043b\u044c\u043d\u043e\u0433\u043e \u0432\u044b\u0432\u043e\u0434\u0430",
    explanation:
      "\u0423\u0432\u0435\u0440\u0435\u043d\u043d\u043e\u0441\u0442\u044c \u0432 \u0442\u043e\u043c, \u0447\u0442\u043e \u0447\u0435\u0433\u043e-\u0442\u043e \u043d\u0435 \u0431\u044b\u043b\u043e, \u0432\u044b\u0440\u0430\u0436\u0430\u0435\u0442\u0441\u044f \u0447\u0435\u0440\u0435\u0437 \u201ccan\u2019t have\u201d \u0438\u043b\u0438 " +
      "\u201ccouldn\u2019t have + \u043f\u0440\u0438\u0447\u0430\u0441\u0442\u0438\u0435 \u043f\u0440\u043e\u0448\u0435\u0434\u0448\u0435\u0433\u043e \u0432\u0440\u0435\u043c\u0435\u043d\u0438\u201d: \u00ab\u043d\u0435 \u043c\u043e\u0436\u0435\u0442 \u0431\u044b\u0442\u044c, \u0447\u0442\u043e\u0431\u044b \u043e\u043d\u0438 " +
      "\u043f\u0440\u043e\u0447\u0438\u0442\u0430\u043b\u0438 \u043f\u0440\u0438\u043b\u043e\u0436\u0435\u043d\u0438\u0435\u00bb. \u0417\u0434\u0435\u0441\u044c \u043d\u0435\u043b\u044c\u0437\u044f \u0432\u0437\u044f\u0442\u044c \u201cmustn\u2019t have\u201d: \u201cmustn\u2019t\u201d \u2014 \u044d\u0442\u043e " +

      "\u0443\u0432\u0435\u0440\u0435\u043d\u043d\u043e\u0441\u0442\u044c, \u0430 \u0432\u0441\u0435\u0433\u043e \u043b\u0438\u0448\u044c \u0432\u043e\u0437\u043c\u043e\u0436\u043d\u043e\u0441\u0442\u044c: \u00ab\u043c\u043e\u0436\u0435\u0442 \u0431\u044b\u0442\u044c, \u0438 \u043f\u0440\u043e\u0447\u0438\u0442\u0430\u043b\u0438\u00bb.",

  {

    title: "\u201cMay not\u201d \u0438 \u201cmight not\u201d \u043d\u0435 \u0441\u043e\u043a\u0440\u0430\u0449\u0430\u044e\u0442\u0441\u044f",
    explanation:
      "\u0423 may \u043e\u0442\u0440\u0438\u0446\u0430\u0442\u0435\u043b\u044c\u043d\u043e\u0439 \u0441\u0442\u044f\u0436\u0451\u043d\u043d\u043e\u0439 \u0444\u043e\u0440\u043c\u044b \u043d\u0435\u0442 \u0432\u043e\u0432\u0441\u0435: \u201cmayn\u2019t\u201d \u0432 \u0441\u043e\u0432\u0440\u0435\u043c\u0435\u043d\u043d\u043e\u043c " +
      "\u0430\u043d\u0433\u043b\u0438\u0439\u0441\u043a\u043e\u043c \u043d\u0435 \u0432\u0441\u0442\u0440\u0435\u0447\u0430\u0435\u0442\u0441\u044f \u2014 \u044d\u0442\u043e \u043d\u0430\u0441\u0442\u043e\u044f\u0449\u0430\u044f \u043e\u0448\u0438\u0431\u043a\u0430. \u0421 \u201cmightn\u2019t\u201d \u043a\u0430\u0440\u0442\u0438\u043d\u0430 \u0434\u0440\u0443\u0433\u0430\u044f: " +
      "\u0432 \u0431\u0440\u0438\u0442\u0430\u043d\u0441\u043a\u043e\u0439 \u0440\u0430\u0437\u0433\u043e\u0432\u043e\u0440\u043d\u043e\u0439 \u0440\u0435\u0447\u0438 \u0444\u043e\u0440\u043c\u0430 \u0436\u0438\u0432\u0430\u044f, \u043e\u0441\u043e\u0431\u0435\u043d\u043d\u043e \u0432 \u0440\u0430\u0437\u0434\u0435\u043b\u0438\u0442\u0435\u043b\u044c\u043d\u044b\u0445 \u0432\u043e\u043f\u0440\u043e\u0441\u0430\u0445 " +
      "(\u201cHe might come, mightn\u2019t he?\u201d), \u043d\u043e \u0432 \u0434\u0435\u043b\u043e\u0432\u043e\u043c \u0438 \u0430\u043a\u0430\u0434\u0435\u043c\u0438\u0447\u0435\u0441\u043a\u043e\u043c \u043f\u0438\u0441\u044c\u043c\u0435 \u0435\u0451 \u043d\u0435 " +
      "\u043f\u0438\u0448\u0443\u0442. \u041f\u043e\u044d\u0442\u043e\u043c\u0443 \u043d\u0430 \u043f\u0438\u0441\u044c\u043c\u0435 \u2014 \u043f\u043e\u043b\u043d\u043e\u0441\u0442\u044c\u044e, may not \u0438 might not; \u044d\u0442\u043e \u043e\u0442\u043b\u0438\u0447\u0430\u0435\u0442 \u0438\u0445 \u043e\u0442 " +

  {

    plainNote: "\u0412\u0430\u0440\u0438\u0430\u043d\u0442 \u0441 although \u043f\u0435\u0440\u0435\u0434\u0430\u0451\u0442 \u0442\u043e\u0442 \u0436\u0435 \u0441\u043c\u044b\u0441\u043b \u0438 \u0441\u043e\u0432\u0435\u0440\u0448\u0435\u043d\u043d\u043e \u043f\u0440\u0430\u0432\u0438\u043b\u0435\u043d.",

  {

      "\u043d\u0435\u0441\u0434\u0435\u043b\u0430\u043d\u043d\u043e\u0435: \u00ab\u043c\u043e\u0433 \u0431\u044b \u0438 \u0441\u043a\u0430\u0437\u0430\u0442\u044c\u00bb, \u00ab\u043c\u043e\u0433\u043b\u0430 \u0431\u044b \u0438 \u0434\u043e\u0433\u0430\u0434\u0430\u0442\u044c\u0441\u044f\u00bb. \u0424\u043e\u0440\u043c\u0430\u043b\u044c\u043d\u043e \u0441\u043e\u0432\u043f\u0430\u0434\u0430\u0435\u0442 \u0441 " +
      "\u043f\u0440\u0435\u0434\u043f\u043e\u043b\u043e\u0436\u0435\u043d\u0438\u0435\u043c \u043e \u043f\u0440\u043e\u0448\u043b\u043e\u043c, \u043d\u043e \u0438\u043d\u0442\u043e\u043d\u0430\u0446\u0438\u044f \u0438 \u043a\u043e\u043d\u0442\u0435\u043a\u0441\u0442 \u0440\u0430\u0437\u043b\u0438\u0447\u0430\u044e\u0442 \u0438\u0445 \u043d\u0430\u0434\u0451\u0436\u043d\u043e. \u201cMight have\u201d " +
      "\u0430\u043f\u0435\u043b\u043b\u0438\u0440\u0443\u0435\u0442 \u043d\u0435 \u043a \u043e\u0431\u044f\u0437\u0430\u043d\u043d\u043e\u0441\u0442\u0438, \u0430 \u043a \u044d\u043b\u0435\u043c\u0435\u043d\u0442\u0430\u0440\u043d\u043e\u0439 \u043f\u0440\u0435\u0434\u0443\u043f\u0440\u0435\u0434\u0438\u0442\u0435\u043b\u044c\u043d\u043e\u0441\u0442\u0438, \u0438 \u043e\u0442\u0442\u043e\u0433\u043e \u0437\u0432\u0443\u0447\u0438\u0442 " +
      "\u043e\u0431\u0438\u0436\u0435\u043d\u043d\u0435\u0435, \u0447\u0435\u043c \u201cshould have\u201d.",
    plainNote: "\u0412\u0430\u0440\u0438\u0430\u043d\u0442 \u0441 \u201cshould have\u201d \u0442\u043e\u0436\u0435 \u0432\u0435\u0440\u0435\u043d \u0438 \u0442\u043e\u0436\u0435 \u043a\u0440\u0438\u0442\u0438\u043a\u0443\u0435\u0442.",

  {
    id: "modal-permission-register",
    category: "style",
    title: "\u0412\u0435\u0436\u043b\u0438\u0432\u043e\u0441\u0442\u044c \u0432 \u043f\u0440\u043e\u0441\u044c\u0431\u0430\u0445: can, could, may, might",
    explanation:
      "\u042d\u0442\u0438 \u0447\u0435\u0442\u044b\u0440\u0435 \u0432\u0430\u0440\u0438\u0430\u043d\u0442\u0430 \u0440\u0430\u0437\u043b\u0438\u0447\u0430\u0435\u0442 \u0442\u043e\u043b\u044c\u043a\u043e \u0440\u0435\u0433\u0438\u0441\u0442\u0440, \u0438 \u0448\u043a\u0430\u043b\u0430 \u0443\u0441\u0442\u0440\u043e\u0435\u043d\u0430 \u0442\u0430\u043a: \u201cCan I\u2026?\u201d \u2014 " +
      "\u043d\u0435\u0439\u0442\u0440\u0430\u043b\u044c\u043d\u043e-\u0440\u0430\u0437\u0433\u043e\u0432\u043e\u0440\u043d\u043e\u0435, " +
      "\u201cCould I\u2026?\u201d \u2014 \u0432\u0435\u0436\u043b\u0438\u0432\u0435\u0435 \u0438 \u0433\u043e\u0434\u0438\u0442\u0441\u044f \u043f\u043e\u0447\u0442\u0438 \u0432\u0435\u0437\u0434\u0435, \u201cMay I\u2026?\u201d \u2014 \u0444\u043e\u0440\u043c\u0430\u043b\u044c\u043d\u043e \u0438 \u0443\u043c\u0435\u0441\u0442\u043d\u043e \u0441 " +
      "\u0447\u0435\u043b\u043e\u0432\u0435\u043a\u043e\u043c \u0432\u044b\u0448\u0435 \u043f\u043e \u0441\u0442\u0430\u0442\u0443\u0441\u0443 \u0438\u043b\u0438 \u0432 \u043e\u0444\u0438\u0446\u0438\u0430\u043b\u044c\u043d\u043e\u0439 \u0441\u0438\u0442\u0443\u0430\u0446\u0438\u0438 \u0432\u0440\u043e\u0434\u0435 \u043f\u043e\u043b\u0443\u0447\u0435\u043d\u0438\u044f \u0441\u043e\u0433\u043b\u0430\u0441\u0438\u044f " +
      "\u0443\u0447\u0430\u0441\u0442\u043d\u0438\u043a\u0430, \u201cMight I\u2026?\u201d \u2014 \u043f\u043e\u0434\u0447\u0451\u0440\u043a\u043d\u0443\u0442\u043e \u0446\u0435\u0440\u0435\u043c\u043e\u043d\u043d\u043e \u0438 \u0432 \u043e\u0431\u044b\u0447\u043d\u043e\u043c \u0440\u0430\u0437\u0433\u043e\u0432\u043e\u0440\u0435 \u0437\u0432\u0443\u0447\u0438\u0442 \u043d\u0430\u0440\u043e\u0447\u0438\u0442\u043e. " +

    plainNote: "\u0412\u0441\u0435 \u0447\u0435\u0442\u044b\u0440\u0435 \u0432\u0430\u0440\u0438\u0430\u043d\u0442\u0430 \u0433\u0440\u0430\u043c\u043c\u0430\u0442\u0438\u0447\u0435\u0441\u043a\u0438 \u0432\u0435\u0440\u043d\u044b.",

  {
    id: "compound-noun-first-singular",
    category: "grammar",
    title: "\u041f\u0435\u0440\u0432\u043e\u0435 \u0441\u0443\u0449\u0435\u0441\u0442\u0432\u0438\u0442\u0435\u043b\u044c\u043d\u043e\u0435 \u0432 \u0441\u043e\u0441\u0442\u0430\u0432\u043d\u043e\u043c \u0441\u043e\u0447\u0435\u0442\u0430\u043d\u0438\u0438 \u2014 \u0432 \u0435\u0434\u0438\u043d\u0441\u0442\u0432\u0435\u043d\u043d\u043e\u043c \u0447\u0438\u0441\u043b\u0435",
    explanation:
      "\u041a\u043e\u0433\u0434\u0430 \u043e\u0434\u043d\u043e \u0441\u0443\u0449\u0435\u0441\u0442\u0432\u0438\u0442\u0435\u043b\u044c\u043d\u043e\u0435 \u043e\u043f\u0440\u0435\u0434\u0435\u043b\u044f\u0435\u0442 \u0434\u0440\u0443\u0433\u043e\u0435, \u043f\u0435\u0440\u0432\u043e\u0435 \u043e\u0441\u0442\u0430\u0451\u0442\u0441\u044f \u0432 \u0435\u0434\u0438\u043d\u0441\u0442\u0432\u0435\u043d\u043d\u043e\u043c " +
      "\u0447\u0438\u0441\u043b\u0435, \u0434\u0430\u0436\u0435 \u0435\u0441\u043b\u0438 \u043f\u043e \u0441\u043c\u044b\u0441\u043b\u0443 \u0438\u0445 \u043c\u043d\u043e\u0433\u043e: a ten-page summary, user research, a " +
      "three-year grant, a shoe shop, a policy document. \u041c\u043d\u043e\u0436\u0435\u0441\u0442\u0432\u0435\u043d\u043d\u043e\u0435 \u0447\u0438\u0441\u043b\u043e \u043d\u0435\u0441\u0451\u0442 " +
      "\u0442\u043e\u043b\u044c\u043a\u043e \u0432\u0442\u043e\u0440\u043e\u0435 \u0441\u043b\u043e\u0432\u043e. \u0418\u0441\u043a\u043b\u044e\u0447\u0435\u043d\u0438\u044f \u0437\u0430\u043f\u043e\u043c\u0438\u043d\u0430\u044e\u0442\u0441\u044f \u0441\u043f\u0438\u0441\u043a\u043e\u043c: a sports centre, a " +
      "savings account, a needs assessment, a careers adviser. \u042d\u0442\u043e \u043f\u0440\u0430\u0432\u0438\u043b\u043e \u043d\u0435 \u043e \u0442\u043e\u043c, " +
      "\u043f\u0438\u0441\u0430\u0442\u044c \u0441\u043b\u0438\u0442\u043d\u043e \u0438\u043b\u0438 \u0440\u0430\u0437\u0434\u0435\u043b\u044c\u043d\u043e: \u043d\u0430\u043f\u0438\u0441\u0430\u043d\u0438\u0435 \u0441\u043e\u0441\u0442\u0430\u0432\u043d\u044b\u0445 \u0441\u043b\u043e\u0432 \u0440\u0435\u0433\u0443\u043b\u0438\u0440\u0443\u0435\u0442\u0441\u044f \u043e\u0442\u0434\u0435\u043b\u044c\u043d\u043e; " +
      "\u0437\u0434\u0435\u0441\u044c \u0440\u0435\u0447\u044c \u0442\u043e\u043b\u044c\u043a\u043e \u043e \u0447\u0438\u0441\u043b\u0435 \u043f\u0435\u0440\u0432\u043e\u0433\u043e \u0441\u043b\u043e\u0432\u0430.",
    example: {

      right: "She wrote a ten-page summary of the user research.",
    },
    registers: ["work"],
    topics: ["tutor-noun-phrases"],
  },
  {
    id: "compound-noun-vs-of-phrase",
    category: "grammar",
    title: "\u0421\u043e\u0441\u0442\u0430\u0432\u043d\u043e\u0435 \u0441\u0443\u0449\u0435\u0441\u0442\u0432\u0438\u0442\u0435\u043b\u044c\u043d\u043e\u0435 \u0438\u043b\u0438 \u043e\u0431\u043e\u0440\u043e\u0442 \u0441 \u201cof\u201d",
    explanation:
      "\u0423\u0441\u0442\u043e\u044f\u0432\u0448\u0435\u0435\u0441\u044f, \u043e\u0431\u043e\u0431\u0449\u0451\u043d\u043d\u043e\u0435 \u043f\u043e\u043d\u044f\u0442\u0438\u0435 \u043d\u0430\u0437\u044b\u0432\u0430\u044e\u0442 \u0441\u043e\u0441\u0442\u0430\u0432\u043d\u044b\u043c \u0441\u0443\u0449\u0435\u0441\u0442\u0432\u0438\u0442\u0435\u043b\u044c\u043d\u044b\u043c: response rate, " +
      "impact measurement, grant application, consent form. \u041e\u0431\u043e\u0440\u043e\u0442 \u201cthe X of Y\u201d \u043d\u0443\u0436\u0435\u043d, \u043a\u043e\u0433\u0434\u0430 " +
      "\u0440\u0435\u0447\u044c \u043e \u043a\u043e\u043d\u043a\u0440\u0435\u0442\u043d\u043e\u043c \u044d\u043a\u0437\u0435\u043c\u043f\u043b\u044f\u0440\u0435 \u0438\u043b\u0438 \u043a\u043e\u0433\u0434\u0430 \u0441\u043e\u0447\u0435\u0442\u0430\u043d\u0438\u0435 \u0435\u0449\u0451 \u043d\u0435 \u0443\u0441\u0442\u043e\u044f\u043b\u043e\u0441\u044c: the response rate " +
      "of the deaf panel, the cost of this particular audit. \u0412\u044b\u0431\u043e\u0440 \u0437\u0430\u0432\u0438\u0441\u0438\u0442 \u043e\u0442 \u0442\u043e\u0433\u043e, \u043d\u0430\u0437\u044b\u0432\u0430\u0435\u0442\u0435 " +
      "\u0432\u044b \u043f\u043e\u043d\u044f\u0442\u0438\u0435 \u0438\u043b\u0438 \u0443\u043a\u0430\u0437\u044b\u0432\u0430\u0435\u0442\u0435 \u043d\u0430 \u0441\u043b\u0443\u0447\u0430\u0439. \u0420\u0443\u0441\u0441\u043a\u0438\u0439 \u0440\u043e\u0434\u0438\u0442\u0435\u043b\u044c\u043d\u044b\u0439 \u043f\u0430\u0434\u0435\u0436 \u0442\u044f\u043d\u0435\u0442 \u043a \u201cof\u201d \u0434\u0430\u0436\u0435 \u0442\u0430\u043c, " +
      "\u0433\u0434\u0435 \u0430\u043d\u0433\u043b\u0438\u0447\u0430\u043d\u0438\u043d \u0432\u043e\u0437\u044c\u043c\u0451\u0442 \u0441\u043e\u0441\u0442\u0430\u0432\u043d\u043e\u0435 \u0441\u0443\u0449\u0435\u0441\u0442\u0432\u0438\u0442\u0435\u043b\u044c\u043d\u043e\u0435.",
    plainNote: "\u041e\u0431\u0430 \u0432\u0430\u0440\u0438\u0430\u043d\u0442\u0430 \u0433\u0440\u0430\u043c\u043c\u0430\u0442\u0438\u0447\u043d\u044b.",

  {
    id: "gerund-subject-negative",
    category: "grammar",
    title: "\u0413\u0435\u0440\u0443\u043d\u0434\u0438\u0439 \u0432 \u0440\u043e\u043b\u0438 \u043f\u043e\u0434\u043b\u0435\u0436\u0430\u0449\u0435\u0433\u043e \u0438 \u0435\u0433\u043e \u043e\u0442\u0440\u0438\u0446\u0430\u043d\u0438\u0435",
    explanation:
      "\u0413\u0435\u0440\u0443\u043d\u0434\u0438\u0439 \u043c\u043e\u0436\u0435\u0442 \u0431\u044b\u0442\u044c \u043f\u043e\u0434\u043b\u0435\u0436\u0430\u0449\u0438\u043c \u0438 \u0432\u0435\u0434\u0451\u0442 \u0441\u0435\u0431\u044f \u043a\u0430\u043a \u0441\u0443\u0449\u0435\u0441\u0442\u0432\u0438\u0442\u0435\u043b\u044c\u043d\u043e\u0435 \u0432 \u0435\u0434\u0438\u043d\u0441\u0442\u0432\u0435\u043d\u043d\u043e\u043c \u0447\u0438\u0441\u043b\u0435: " +
      "\u201cMeasuring impact is hard\u201d \u2014 is, \u0430 \u043d\u0435 are, \u0434\u0430\u0436\u0435 \u0435\u0441\u043b\u0438 \u0434\u0430\u043b\u044c\u0448\u0435 \u0438\u0434\u0451\u0442 \u043c\u043d\u043e\u0436\u0435\u0441\u0442\u0432\u0435\u043d\u043d\u043e\u0435 " +
      "\u0434\u043e\u043f\u043e\u043b\u043d\u0435\u043d\u0438\u0435. \u041e\u0442\u0440\u0438\u0446\u0430\u043d\u0438\u0435 \u043e\u0444\u043e\u0440\u043c\u043b\u044f\u0435\u0442\u0441\u044f \u0441\u043b\u043e\u0432\u043e\u043c \u201cnot\u201d \u043d\u0435\u043f\u043e\u0441\u0440\u0435\u0434\u0441\u0442\u0432\u0435\u043d\u043d\u043e \u043f\u0435\u0440\u0435\u0434 \u0433\u0435\u0440\u0443\u043d\u0434\u0438\u0435\u043c, \u0431\u0435\u0437 " +
      "\u0432\u0441\u044f\u043a\u0438\u0445 \u0432\u0441\u043f\u043e\u043c\u043e\u0433\u0430\u0442\u0435\u043b\u044c\u043d\u044b\u0445 \u0433\u043b\u0430\u0433\u043e\u043b\u043e\u0432: \u201cNot asking about assistive technology cost us the " +
      "whole first wave\u201d. \u0413\u0435\u0440\u0443\u043d\u0434\u0438\u0439 \u043a\u043e\u043c\u043f\u0430\u043a\u0442\u043d\u0435\u0435 \u0440\u0430\u0437\u0432\u0451\u0440\u043d\u0443\u0442\u043e\u0433\u043e \u043f\u0440\u0438\u0434\u0430\u0442\u043e\u0447\u043d\u043e\u0433\u043e \u0438 \u0444\u043e\u0440\u043c\u0430\u043b\u044c\u043d\u0435\u0435.",
    plainNote: "\u0420\u0430\u0437\u0432\u0451\u0440\u043d\u0443\u0442\u044b\u0439 \u0432\u0430\u0440\u0438\u0430\u043d\u0442 \u0441 \u043f\u0440\u0438\u0434\u0430\u0442\u043e\u0447\u043d\u044b\u043c \u0442\u043e\u0436\u0435 \u0432\u0435\u0440\u0435\u043d.",
    example: {

      right: "Not asking about assistive technology in the screener cost us the whole first wave.",

  {

      "\u0434\u0432\u0435 \u0444\u043e\u0440\u043c\u044b: \u043e\u0431\u044a\u0435\u043a\u0442\u043d\u0443\u044e (\u201cus publishing the transcripts\u201d) \u0432 \u043d\u0435\u0439\u0442\u0440\u0430\u043b\u044c\u043d\u043e\u0439 \u0440\u0435\u0447\u0438 \u0438 " +
      "\u043f\u0440\u0438\u0442\u044f\u0436\u0430\u0442\u0435\u043b\u044c\u043d\u0443\u044e (\u201cour publishing the transcripts\u201d, \u201cthe fund\u2019s withdrawing\u201d) \u0432 " +
      "\u0444\u043e\u0440\u043c\u0430\u043b\u044c\u043d\u043e\u043c \u043f\u0438\u0441\u044c\u043c\u0435. \u041f\u0440\u0438\u0442\u044f\u0436\u0430\u0442\u0435\u043b\u044c\u043d\u0430\u044f \u0444\u043e\u0440\u043c\u0430 \u0432 \u0440\u0430\u0437\u0433\u043e\u0432\u043e\u0440\u0435 \u0437\u0432\u0443\u0447\u0438\u0442 \u043a\u043d\u0438\u0436\u043d\u043e. \u0420\u0443\u0441\u0441\u043a\u0438\u0439 \u043e\u0431\u0445\u043e\u0434\u0438\u0442\u0441\u044f " +
      "\u043f\u0440\u0438\u0434\u0430\u0442\u043e\u0447\u043d\u044b\u043c (\u00ab\u0447\u0442\u043e \u043c\u044b \u043e\u043f\u0443\u0431\u043b\u0438\u043a\u0443\u0435\u043c\u00bb), \u043f\u043e\u044d\u0442\u043e\u043c\u0443 \u0441\u0430\u043c\u0443 \u043a\u043e\u043d\u0441\u0442\u0440\u0443\u043a\u0446\u0438\u044e \u043f\u0440\u0438\u0445\u043e\u0434\u0438\u0442\u0441\u044f \u0441\u0442\u0440\u043e\u0438\u0442\u044c " +
      "\u0441\u043e\u0437\u043d\u0430\u0442\u0435\u043b\u044c\u043d\u043e.",

  {

      "\u043e\u0444\u0438\u0446\u0438\u0430\u043b\u044c\u043d\u043e. \u0423 \u043d\u0435\u0433\u043e \u0435\u0441\u0442\u044c \u0438 \u043e\u0433\u0440\u0430\u043d\u0438\u0447\u0435\u043d\u0438\u0435: \u0441 \u0430\u0440\u0442\u0438\u043a\u043b\u0435\u043c \u043f\u0435\u0440\u0435\u0434 \u0433\u0435\u0440\u0443\u043d\u0434\u0438\u0435\u043c \u043d\u0435\u043b\u044c\u0437\u044f \u043f\u043e\u0441\u0442\u0430\u0432\u0438\u0442\u044c " +
      "\u043d\u0430\u0440\u0435\u0447\u0438\u0435. \u201cCarefully measuring impact\u201d \u0441\u043a\u0430\u0437\u0430\u0442\u044c \u043c\u043e\u0436\u043d\u043e, \u0430 \u201cthe carefully measuring of " +

  },
  {
    id: "infinitive-as-subject",

    explanation:

      "breach consent\u201d. \u041e\u0442\u0440\u0438\u0446\u0430\u043d\u0438\u0435 \u2014 \u201cnot\u201d \u043f\u0435\u0440\u0435\u0434 \u201cto\u201d: \u201cNot to report the " +
      "exclusions would be dishonest\u201d. \u041e\u0431\u043e\u0440\u043e\u0442 \u043a\u043d\u0438\u0436\u043d\u044b\u0439 \u0438 \u0441\u043b\u0435\u0433\u043a\u0430 \u0442\u043e\u0440\u0436\u0435\u0441\u0442\u0432\u0435\u043d\u043d\u044b\u0439: \u0432 " +
      "\u043e\u0431\u044b\u0447\u043d\u043e\u0439 \u043f\u0440\u043e\u0437\u0435 \u0442\u0443 \u0436\u0435 \u043c\u044b\u0441\u043b\u044c \u0447\u0430\u0449\u0435 \u0432\u044b\u0440\u0430\u0436\u0430\u044e\u0442 \u0447\u0435\u0440\u0435\u0437 \u0432\u0432\u043e\u0434\u043d\u043e\u0435 \u201cit\u201d (\u201cIt would be " +

    plainNote: "\u0412\u0441\u0435 \u0442\u0440\u0438 \u0432\u0430\u0440\u0438\u0430\u043d\u0442\u0430 \u0432\u0435\u0440\u043d\u044b: \u0438\u043d\u0444\u0438\u043d\u0438\u0442\u0438\u0432, \u0432\u0432\u043e\u0434\u043d\u043e\u0435 \u201cit\u201d \u0438 \u0433\u0435\u0440\u0443\u043d\u0434\u0438\u0439.",
    example: {

    registers: ["work"],
    topics: ["tutor-noun-phrases"],

  {

    explanation:
      "\u041d\u043e\u043c\u0438\u043d\u0430\u043b\u0438\u0437\u0430\u0446\u0438\u044f \u0441\u0432\u043e\u0440\u0430\u0447\u0438\u0432\u0430\u0435\u0442 \u0441\u043a\u0430\u0437\u0443\u0435\u043c\u043e\u0435 \u0432 \u0441\u0443\u0449\u0435\u0441\u0442\u0432\u0438\u0442\u0435\u043b\u044c\u043d\u043e\u0435 \u0438 \u043f\u043e\u0437\u0432\u043e\u043b\u044f\u0435\u0442 \u0443\u043b\u043e\u0436\u0438\u0442\u044c \u0432 \u043e\u0434\u043d\u043e " +
      "\u043f\u0440\u0435\u0434\u043b\u043e\u0436\u0435\u043d\u0438\u0435 \u0442\u043e, \u043d\u0430 \u0447\u0442\u043e \u0438\u043d\u0430\u0447\u0435 \u0443\u0448\u043b\u043e \u0431\u044b \u0434\u0432\u0430: \u201cBecause the council cut the budget\u2026\u201d " +
      "\u043f\u0440\u0435\u0432\u0440\u0430\u0449\u0430\u0435\u0442\u0441\u044f \u0432 \u201cthe council\u2019s budget cut\u201d. \u041f\u0440\u0438\u0451\u043c \u0442\u0438\u043f\u0438\u0447\u0435\u043d \u0434\u043b\u044f \u0430\u043a\u0430\u0434\u0435\u043c\u0438\u0447\u0435\u0441\u043a\u043e\u0433\u043e \u0438 " +
      "\u043e\u0442\u0447\u0451\u0442\u043d\u043e\u0433\u043e \u0441\u0442\u0438\u043b\u044f: \u0442\u0435\u043a\u0441\u0442 \u0441\u0442\u0430\u043d\u043e\u0432\u0438\u0442\u0441\u044f \u043f\u043b\u043e\u0442\u043d\u0435\u0435 \u0438 \u0431\u0435\u0437\u043b\u0438\u0447\u043d\u0435\u0435. \u041f\u0435\u0440\u0435\u0433\u0440\u0443\u0436\u0435\u043d\u043d\u044b\u0439 \u043d\u043e\u043c\u0438\u043d\u0430\u043b\u0438\u0437\u0430\u0446\u0438\u044f\u043c\u0438 " +
      "\u0442\u0435\u043a\u0441\u0442 \u0447\u0438\u0442\u0430\u0435\u0442\u0441\u044f \u0442\u044f\u0436\u0435\u043b\u043e, \u0442\u0430\u043a \u0447\u0442\u043e \u044d\u0442\u043e \u0438\u043d\u0441\u0442\u0440\u0443\u043c\u0435\u043d\u0442 \u0434\u043b\u044f \u043e\u0442\u0434\u0435\u043b\u044c\u043d\u044b\u0445 \u043c\u0435\u0441\u0442, \u0430 \u043d\u0435 \u0446\u0435\u043b\u044c.",
    plainNote: "\u041e\u0431\u0430 \u0432\u0430\u0440\u0438\u0430\u043d\u0442\u0430 \u0432\u0435\u0440\u043d\u044b.",

  {

  {
    id: "nominalization-corresponding-noun",

  {

    title: "\u041f\u0440\u0435\u0434\u043b\u043e\u0433 \u043f\u0440\u0438 \u0441\u0443\u0449\u0435\u0441\u0442\u0432\u0438\u0442\u0435\u043b\u044c\u043d\u043e\u043c",
    explanation:
      "\u0421\u0443\u0449\u0435\u0441\u0442\u0432\u0438\u0442\u0435\u043b\u044c\u043d\u044b\u0435 \u0437\u0430\u043a\u0440\u0435\u043f\u043b\u044f\u044e\u0442 \u0437\u0430 \u0441\u043e\u0431\u043e\u0439 \u043f\u0440\u0435\u0434\u043b\u043e\u0433, \u0438 \u0432\u044b\u0432\u0435\u0441\u0442\u0438 \u0435\u0433\u043e \u0438\u0437 \u0437\u043d\u0430\u0447\u0435\u043d\u0438\u044f \u043d\u0435\u043b\u044c\u0437\u044f: " +
      "the reason for, the demand for, the need for, the solution to, the answer to, " +
      "the approach to, the increase in, the interest in, the effect on, the cause of, " +
      "the lack of. \u041f\u0430\u0440\u0430 \u201cthe reason for\u201d \u0438 \u201cthe cause of\u201d \u043f\u043e\u043a\u0430\u0437\u044b\u0432\u0430\u0435\u0442, \u043d\u0430\u0441\u043a\u043e\u043b\u044c\u043a\u043e " +
      "\u043c\u0430\u043b\u043e \u043f\u043e\u043c\u043e\u0433\u0430\u0435\u0442 \u0441\u043c\u044b\u0441\u043b: \u0441\u043b\u043e\u0432\u0430 \u0431\u043b\u0438\u0437\u043a\u0438\u0435, \u043f\u0440\u0435\u0434\u043b\u043e\u0433\u0438 \u0440\u0430\u0437\u043d\u044b\u0435. \u0420\u0443\u0441\u0441\u043a\u0438\u0439 \u043f\u0430\u0434\u0435\u0436 (\u00ab\u043f\u0440\u0438\u0447\u0438\u043d\u0430 " +
      "\u0437\u0430\u0434\u0435\u0440\u0436\u043a\u0438\u00bb) \u043f\u043e\u0434\u0441\u043a\u0430\u0437\u044b\u0432\u0430\u0435\u0442 \u201cof\u201d \u0438 \u0432 \u043f\u043e\u043b\u043e\u0432\u0438\u043d\u0435 \u0441\u043b\u0443\u0447\u0430\u0435\u0432 \u043f\u043e\u0434\u0432\u043e\u0434\u0438\u0442.",
    example: {
      wrong: "The report gives no explanation of the reason of the delay or the demand of interpreters.",
      right: "The report gives no explanation of the reason for the delay or the demand for interpreters.",
    },
    registers: ["work"],
    topics: ["tutor-noun-phrases"],
  },
  {
    id: "will-habits-typical",
    category: "grammar",
    title: "\u201cWill\u201d \u043e \u043f\u0440\u0438\u0432\u044b\u0447\u043a\u0430\u0445 \u0438 \u0442\u0438\u043f\u0438\u0447\u043d\u043e\u043c \u043f\u043e\u0432\u0435\u0434\u0435\u043d\u0438\u0438",
    explanation:
      "\u0421 \u0434\u0438\u043d\u0430\u043c\u0438\u0447\u0435\u0441\u043a\u0438\u043c\u0438 \u0433\u043b\u0430\u0433\u043e\u043b\u0430\u043c\u0438 will \u0438 won\u2019t \u043e\u043f\u0438\u0441\u044b\u0432\u0430\u044e\u0442 \u043d\u0435 \u0431\u0443\u0434\u0443\u0449\u0435\u0435, \u0430 \u0445\u0430\u0440\u0430\u043a\u0442\u0435\u0440\u043d\u043e\u0435 \u043f\u043e\u0432\u0435\u0434\u0435\u043d\u0438\u0435: " +
      "\u00ab\u0432\u043e\u0442 \u0442\u0430\u043a \u043e\u043d\u0438 \u0432\u0441\u0435\u0433\u0434\u0430 \u0438 \u0434\u0435\u043b\u0430\u044e\u0442\u00bb. \u201cOur procurement team will send the clause back twice\u201d " +
      "\u2014 \u0440\u0435\u0447\u044c \u043e \u043d\u0435\u0438\u0437\u043c\u0435\u043d\u043d\u043e\u0439 \u043f\u0440\u0438\u0432\u044b\u0447\u043a\u0435, \u0430 \u043d\u0435 \u043e \u043f\u043b\u0430\u043d\u0430\u0445. \u0415\u0441\u043b\u0438 will \u0432\u044b\u0434\u0435\u043b\u0435\u043d\u043e \u0443\u0434\u0430\u0440\u0435\u043d\u0438\u0435\u043c, \u0434\u043e\u0431\u0430\u0432\u043b\u044f\u0435\u0442\u0441\u044f " +
      "\u0440\u0430\u0437\u0434\u0440\u0430\u0436\u0435\u043d\u0438\u0435: \u00ab\u0432\u0435\u0447\u043d\u043e \u043e\u043d\u0438\u2026\u00bb. Will \u043f\u0440\u0438\u0434\u0430\u0451\u0442 \u043e\u0442\u0442\u0435\u043d\u043e\u043a \u043d\u0435\u0438\u0437\u0431\u0435\u0436\u043d\u043e\u0441\u0442\u0438.",
    plainNote: "\u0412\u0430\u0440\u0438\u0430\u043d\u0442 \u0441 usually \u0438\u043b\u0438 always \u0442\u043e\u0436\u0435 \u0432\u0435\u0440\u0435\u043d \u0438 \u043d\u0435\u0439\u0442\u0440\u0430\u043b\u044c\u043d\u0435\u0435.",
    example: {
      wrong: "Our procurement team usually sends the accessibility clause back twice.",
      right: "Our procurement team will send the accessibility clause back twice, every single time.",
    },
    registers: ["work"],
    topics: ["tutor-modals-will"],
    emphasis: true,
    goal: "modal",
  },
  {
    id: "will-belief-true",
    category: "grammar",
    title: "\u201cWill\u201d \u043a\u0430\u043a \u0443\u0432\u0435\u0440\u0435\u043d\u043d\u043e\u0435 \u043f\u0440\u0435\u0434\u043f\u043e\u043b\u043e\u0436\u0435\u043d\u0438\u0435 \u043e \u043d\u0430\u0441\u0442\u043e\u044f\u0449\u0435\u043c",
    explanation:
      "Will \u0438 won\u2019t \u0432\u044b\u0440\u0430\u0436\u0430\u044e\u0442 \u0443\u0432\u0435\u0440\u0435\u043d\u043d\u043e\u0441\u0442\u044c \u0432 \u0442\u043e\u043c, \u0447\u0442\u043e \u043f\u0440\u043e\u0438\u0441\u0445\u043e\u0434\u0438\u0442 \u043f\u0440\u044f\u043c\u043e \u0441\u0435\u0439\u0447\u0430\u0441, \u2014 \u0443\u0432\u0435\u0440\u0435\u043d\u043d\u043e\u0441\u0442\u044c, " +
      "\u043e\u0441\u043d\u043e\u0432\u0430\u043d\u043d\u0443\u044e \u043d\u0430 \u043e\u0436\u0438\u0434\u0430\u0435\u043c\u043e\u043c \u0445\u043e\u0434\u0435 \u0432\u0435\u0449\u0435\u0439: \u201cThat will be the ethics committee\u2019s reply\u201d \u0437\u043d\u0430\u0447\u0438\u0442 " +
      "\u00ab\u043d\u0430\u0432\u0435\u0440\u043d\u044f\u043a\u0430 \u044d\u0442\u043e \u0438\u0445 \u043e\u0442\u0432\u0435\u0442\u00bb, \u0430 \u043d\u0435 \u00ab\u0431\u0443\u0434\u0435\u0442\u00bb. \u201cDon\u2019t ring now, she won\u2019t be at her desk " +
      "yet\u201d. \u0411\u0443\u0434\u0443\u0449\u0435\u0433\u043e \u0432\u0440\u0435\u043c\u0435\u043d\u0438 \u0437\u0434\u0435\u0441\u044c \u043d\u0435\u0442 \u0432\u043e\u0432\u0441\u0435, \u0438 \u044d\u0442\u043e \u0433\u043b\u0430\u0432\u043d\u0430\u044f \u0442\u0440\u0443\u0434\u043d\u043e\u0441\u0442\u044c \u043a\u043e\u043d\u0441\u0442\u0440\u0443\u043a\u0446\u0438\u0438: \u0444\u043e\u0440\u043c\u0430 " +
      "\u0432\u044b\u0433\u043b\u044f\u0434\u0438\u0442 \u043a\u0430\u043a \u043f\u043b\u0430\u043d, \u0430 \u0441\u043c\u044b\u0441\u043b \u2014 \u043a\u0430\u043a \u0432\u044b\u0432\u043e\u0434. \u041d\u0430\u0440\u0435\u0447\u0438\u0435 probably \u0432\u0437\u0432\u0435\u0448\u0438\u0432\u0430\u0435\u0442 \u0432\u0435\u0440\u043e\u044f\u0442\u043d\u043e\u0441\u0442\u044c, \u0430 " +
      "will \u043f\u043e\u0434\u0430\u0451\u0442 \u0432\u044b\u0432\u043e\u0434 \u043a\u0430\u043a \u043f\u043e\u0447\u0442\u0438 \u0443\u0441\u0442\u0430\u043d\u043e\u0432\u043b\u0435\u043d\u043d\u044b\u0439 \u0444\u0430\u043a\u0442.",
    plainNote:
      "\u0412\u0430\u0440\u0438\u0430\u043d\u0442 \u0441 probably (\u201cThat is probably their reply\u201d) \u2014 \u043f\u0440\u0430\u0432\u0438\u043b\u044c\u043d\u044b\u0439 \u0430\u043d\u0433\u043b\u0438\u0439\u0441\u043a\u0438\u0439, \u0438 will " +
      "\u0435\u0433\u043e \u043d\u0435 \u0438\u0441\u043f\u0440\u0430\u0432\u043b\u044f\u0435\u0442.",
    example: {
      wrong: "That is probably the ethics committee\u2019s reply in your inbox.",
      right: "That will be the ethics committee\u2019s reply in your inbox.",
    },
    registers: ["work"],
    topics: ["tutor-modals-will"],
    emphasis: true,
    goal: "confident",
  },
  {
    id: "will-willingness",
    category: "grammar",
    title: "\u201cWill\u201d \u043e \u0433\u043e\u0442\u043e\u0432\u043d\u043e\u0441\u0442\u0438, \u043e\u0431\u0435\u0449\u0430\u043d\u0438\u0438 \u0438 \u043e\u0442\u043a\u0430\u0437\u0435",
    explanation:

      "\u0443\u0433\u0440\u043e\u0437\u0443. \u041e\u0442\u0440\u0438\u0446\u0430\u0442\u0435\u043b\u044c\u043d\u043e\u0435 won\u2019t \u043e\u0437\u043d\u0430\u0447\u0430\u0435\u0442 \u043e\u0442\u043a\u0430\u0437 \u2014 \u00ab\u043d\u0435 \u0445\u043e\u0447\u0435\u0442, \u043d\u0435 \u0436\u0435\u043b\u0430\u0435\u0442\u00bb, \u0430 \u043d\u0435 \u043f\u0440\u043e\u0441\u0442\u043e " +
      "\u00ab\u043d\u0435 \u0431\u0443\u0434\u0435\u0442\u00bb. \u042d\u0442\u043e \u0440\u0430\u0431\u043e\u0442\u0430\u0435\u0442 \u0438 \u0441 \u043f\u0440\u0435\u0434\u043c\u0435\u0442\u0430\u043c\u0438: \u201cThe screen reader won\u2019t read the " +

      "\u0442\u043e\u043c, \u0447\u0442\u043e going to \u043e\u043f\u0438\u0441\u044b\u0432\u0430\u0435\u0442 \u0437\u0430\u0440\u0430\u043d\u0435\u0435 \u043f\u0440\u0438\u043d\u044f\u0442\u043e\u0435 \u0440\u0435\u0448\u0435\u043d\u0438\u0435, \u0430 will \u2014 \u0441\u0438\u044e\u043c\u0438\u043d\u0443\u0442\u043d\u043e\u0435.",

  {

      "\u043f\u0438\u0448\u0443\u0442 \u0440\u0435\u0433\u043b\u0430\u043c\u0435\u043d\u0442\u044b, \u0443\u0441\u0442\u0430\u0432\u044b \u0438 \u0438\u043d\u0441\u0442\u0440\u0443\u043a\u0446\u0438\u0438: \u201cParticipants will complete the consent form " +

  {

  {

    category: "grammar",
    title: "\u201cWould\u201d \u0432 \u043d\u0435\u0440\u0435\u0430\u043b\u044c\u043d\u043e\u0439 \u0441\u0438\u0442\u0443\u0430\u0446\u0438\u0438",
    explanation:
      "Would \u2014 \u0433\u043b\u0430\u0432\u043d\u0430\u044f \u0447\u0430\u0441\u0442\u044c \u043d\u0435\u0440\u0435\u0430\u043b\u044c\u043d\u043e\u0433\u043e \u0443\u0441\u043b\u043e\u0432\u0438\u044f \u043e \u043d\u0430\u0441\u0442\u043e\u044f\u0449\u0435\u043c \u0438\u043b\u0438 \u0431\u0443\u0434\u0443\u0449\u0435\u043c: \u0443\u0441\u043b\u043e\u0432\u0438\u0435 " +
      "\u0441\u0442\u043e\u0438\u0442 \u0432 past simple, \u0441\u043b\u0435\u0434\u0441\u0442\u0432\u0438\u0435 \u0441 would. \u0421\u043c\u0435\u0448\u0435\u043d\u0438\u0435 \u0432\u0440\u0435\u043c\u0451\u043d (\u201cif the fund counted\u2026, " +
      "accessibility work looks\u2026\u201d) \u2014 \u043d\u0430\u0441\u0442\u043e\u044f\u0449\u0430\u044f \u043e\u0448\u0438\u0431\u043a\u0430. \u0423\u0441\u043b\u043e\u0432\u0438\u0435 \u043d\u0435 \u043e\u0431\u044f\u0437\u0430\u043d\u043e \u0431\u044b\u0442\u044c " +
      "\u043d\u0430\u0437\u0432\u0430\u043d\u043d\u044b\u043c: \u201cThat would cost us two months\u201d \u0443\u0436\u0435 \u043f\u043e\u0434\u0440\u0430\u0437\u0443\u043c\u0435\u0432\u0430\u0435\u0442 \u00ab\u0435\u0441\u043b\u0438 \u0431\u044b \u043c\u044b \u0442\u0430\u043a " +
      "\u0441\u0434\u0435\u043b\u0430\u043b\u0438\u00bb. \u0420\u0443\u0441\u0441\u043a\u043e\u0435 \u00ab\u0431\u044b\u00bb \u0437\u0434\u0435\u0441\u044c \u043f\u043e\u043c\u043e\u0433\u0430\u0435\u0442, \u043d\u043e \u0441 \u043e\u0433\u043e\u0432\u043e\u0440\u043a\u043e\u0439: \u0440\u0443\u0441\u0441\u043a\u0438\u0439 \u043e\u0431\u0445\u043e\u0434\u0438\u0442\u0441\u044f \u043e\u0434\u043d\u043e\u0439 " +
      "\u0444\u043e\u0440\u043c\u043e\u0439, \u0430 \u0430\u043d\u0433\u043b\u0438\u0439\u0441\u043a\u0438\u0439 \u0440\u0430\u0437\u043b\u0438\u0447\u0430\u0435\u0442 would do \u043e \u043d\u0430\u0441\u0442\u043e\u044f\u0449\u0435\u043c \u0438 would have done \u043e " +
      "\u043f\u0440\u043e\u0448\u043b\u043e\u043c.",
    example: {
      wrong: "If the fund counted assisted sessions, accessibility work looks profitable.",
      right: "If the fund counted assisted sessions, accessibility work would look profitable.",

    topics: ["tutor-modals-will"],

  {

      "\u0443\u0441\u043b\u043e\u0432\u043d\u043e\u0435 \u043d\u0430\u043a\u043b\u043e\u043d\u0435\u043d\u0438\u0435.",

  {

      "\u0432\u0435\u0449\u0435\u0439, \u0430 \u043d\u0435 \u0434\u043e\u043a\u0430\u0437\u0430\u0442\u0435\u043b\u044c\u0441\u0442\u0432\u043e. \u0424\u043e\u0440\u043c\u0430 \u0441\u043e\u0432\u043f\u0430\u0434\u0430\u0435\u0442 \u0441 \u043d\u0435\u0440\u0435\u0430\u043b\u044c\u043d\u044b\u043c \u0443\u0441\u043b\u043e\u0432\u0438\u0435\u043c \u043e \u043f\u0440\u043e\u0448\u043b\u043e\u043c \u0438 \u0441 " +
      "\u0441\u043e\u0436\u0430\u043b\u0435\u043d\u0438\u0435\u043c, \u043f\u043e\u044d\u0442\u043e\u043c\u0443 \u0441\u043c\u044b\u0441\u043b \u0440\u0430\u0437\u043b\u0438\u0447\u0430\u0435\u0442\u0441\u044f \u0442\u043e\u043b\u044c\u043a\u043e \u043f\u043e \u043a\u043e\u043d\u0442\u0435\u043a\u0441\u0442\u0443: \u0435\u0441\u043b\u0438 \u0440\u044f\u0434\u043e\u043c \u043d\u0435\u0442 \u0443\u0441\u043b\u043e\u0432\u0438\u044f, " +
      "\u043f\u0435\u0440\u0435\u0434 \u0432\u0430\u043c\u0438 \u043f\u0440\u0435\u0434\u043f\u043e\u043b\u043e\u0436\u0435\u043d\u0438\u0435. \u0420\u044f\u0434\u043e\u043c \u0441 \u043f\u0440\u043e\u0441\u0442\u044b\u043c probably would have \u0437\u0432\u0443\u0447\u0438\u0442 \u0443\u0432\u0435\u0440\u0435\u043d\u043d\u0435\u0435 \u0438 " +

    example: {

  {

  {

// --- src/normalize.mjs ---
// The single source of truth for sentence equality. Grading compares
// normalised forms so that a phone keyboard's curly apostrophe, a doubled
// space, or a missing full stop never counts as a wrong answer.
function normalizeText(s) {
  return String(s)
    .normalize("NFC")
    .replace(/[\u2018\u2019\u02bc]/g, "'")
    .replace(/[\u201c\u201d\u201e]/g, '"')
    .replace(/[\u2013\u2014]/g, "-")
    .replace(/\s+/g, " ")
    .replace(/\s*[.!?]+\s*$/, "")
    .trim()
    .toLowerCase();
}

function tokenizeRaw(s) {
  return String(s).trim().split(/\s+/).filter((t) => t.length > 0);
}

function tokenizeNormalized(s) {
  const n = normalizeText(s);
  return n.length === 0 ? [] : n.split(" ").filter((t) => t.length > 0);

  return JSON.stringify(progress, null, 2);

    throw new Error("\u042d\u0442\u043e \u043d\u0435 JSON. \u041f\u0440\u043e\u0432\u0435\u0440\u044c\u0442\u0435, \u0447\u0442\u043e \u0432\u0441\u0442\u0430\u0432\u043b\u0435\u043d \u0432\u0435\u0441\u044c \u0442\u0435\u043a\u0441\u0442 \u0432\u044b\u0433\u0440\u0443\u0437\u043a\u0438, \u043e\u0442 \u00ab{\u00bb \u0434\u043e \u00ab}\u00bb.");

  if (!isPlainObject(raw.rules)) throw new Error("\u0412 \u044d\u0442\u0438\u0445 \u0434\u0430\u043d\u043d\u044b\u0445 \u043d\u0435\u0442 \u043f\u0440\u043e\u0433\u0440\u0435\u0441\u0441\u0430 \u043f\u043e \u043f\u0440\u0430\u0432\u0438\u043b\u0430\u043c.");

// Every screen is a pure function from data to an HTML string. Nothing here
// touches the DOM, reads the clock or shuffles on its own, so the whole
// interface is testable from the terminal.

// The decks named by what they hold rather than by where they came from: one is
// the mistakes she makes often, the other is rules she has only just met.
const DECK_LABELS = { course: "\u0427\u0430\u0441\u0442\u043e\u0435", tutor: "\u041d\u043e\u0432\u043e\u0435" };

const CATEGORY_LABELS = {
  grammar: "\u0413\u0440\u0430\u043c\u043c\u0430\u0442\u0438\u043a\u0430",
  spelling: "\u041e\u0440\u0444\u043e\u0433\u0440\u0430\u0444\u0438\u044f",
  style: "\u0421\u0442\u0438\u043b\u044c",
  "word-choice": "\u0412\u044b\u0431\u043e\u0440 \u0441\u043b\u043e\u0432\u0430",
};

function escapeHtml(s) {
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// Russian counting: 1 \u043f\u0440\u0430\u0432\u0438\u043b\u043e, 2 \u043f\u0440\u0430\u0432\u0438\u043b\u0430, 5 \u043f\u0440\u0430\u0432\u0438\u043b.
function plural(n, one, few, many) {
  const mod10 = n % 10;
  const mod100 = n % 100;
  if (mod10 === 1 && mod100 !== 11) return one;
  if (mod10 >= 2 && mod10 <= 4 && (mod100 < 12 || mod100 > 14)) return few;
  return many;
}

// Levels and day counts are read back out of stored progress, and `importJSON`
// puts a user-supplied file through a hydrate that checks only that `rules` and
// `days` are objects \u2014 never the values inside them. Coercing here, at the one
// boundary where those values enter the markup, keeps a hostile string out of
// an attribute and keeps plural() doing arithmetic rather than concatenation.
function count(n) {
  const v = Number(n);
  return Number.isFinite(v) ? v : 0;
}

function categoryLabel(category) {
  return CATEGORY_LABELS[category] || category;
}

function deckLabel(deck) {
  return DECK_LABELS[deck] || deck;
}

// The blank in a choice sentence. No ellipsis inside it: the rule under the
// blank already says a word is missing. The non-breaking space is there so the
// span keeps a width of its own before any stylesheet touches it.
const GAP = `<span class="gap">&nbsp;</span>`;

// The same blank where a comma or a full stop follows it. The gap is an
// inline-block with a margin and a padding of its own, so on
// `["", ", still unsigned."]` the sentence renders as \u00ab______ , still
// unsigned.\u00bb \u2014 a space before a comma, in an app whose owner sets books. The
// markup cannot close that space itself; it can say which blanks must be closed.
const TIGHT_GAP = `<span class="gap gap-tight">&nbsp;</span>`;

// True when the part that follows the blank opens with punctuation that should
// sit against it.
function opensWithPunctuation(part) {
  return /^\s*[,.;:!?)]/.test(String(part || ""));
}

// The sentence with its blank in it. Written here rather than as a join so the
// gap can see what comes after it.
function gappedSentence(parts) {
  let html = "";
  for (let i = 0; i < parts.length; i += 1) {
    if (i > 0) html += opensWithPunctuation(parts[i]) ? TIGHT_GAP : GAP;
    html += escapeHtml(parts[i]);
  }
  return html;
}

// Fisher\u2013Yates over an injected rng, so the order is reproducible in tests and
// the module keeps no hidden randomness.
function buildOptions(item, rng) {
  const opts = [item.right, item.wrong, ...item.distractors];
  for (let i = opts.length - 1; i > 0; i -= 1) {
    const j = Math.floor(rng() * (i + 1));
    const t = opts[i];
    opts[i] = opts[j];
    opts[j] = t;
  }
  return opts;
}

// The card asks for something. Without a task line it only offers things to tap,
// and on an emphasis rule the panel afterwards would be explaining a distinction
// the card never mentioned. The line names the goal rather than the grammar, so
// it still never says which option is right or that more than one is possible.
// `rule` is optional; without it the card falls back to asking for a repair.
function renderChoiceCard(item, options, rule) {
  const buttons = options
    .map(
      (o) =>
        `<button type="button" class="option" data-choice="${escapeHtml(o)}">${escapeHtml(o)}</button>`
    )
    .join("");
  return (
    `<div class="card card-choice" data-mode="choice" data-item="${escapeHtml(item.id)}" data-rule="${escapeHtml(item.rule)}">` +
    `<p class="task">${taskLineHtml(rule, item, "choice")}</p>` +
    `<p class="sentence">${gappedSentence(item.parts)}</p>` +
    `<div class="options">${buttons}</div>` +
    `</div>`
  );
}

// hold cards that pull in opposite directions \u2014 the register rules ask for the
// more formal option on most of their items and the least formal one on six.
// Then the rule's own goal, because the topic map only guesses from the family
// a rule sits in and the families are too coarse: a compression topic holds a
// rule whose wanted span is longer, a modal topic holds one whose three options
// are all modals. The map stays as the last fallback, so a rule with no goal
// still asks for something, and so does one carrying a goal this module has
// never heard of.
//
// `item` is optional: the example pair is the rule's, not any card's, and is
// looked up without one.
function goalOf(rule, item) {
  if (item && typeof item.goal === "string" && GOAL_COPY[item.goal]) return item.goal;
  if (rule && typeof rule.goal === "string" && GOAL_COPY[rule.goal]) return rule.goal;
  for (const topic of (rule && rule.topics) || []) {
    if (EMPHASIS_GOALS[topic]) return EMPHASIS_GOALS[topic];
  }
  return "emphatic";

// Russian names it. Interpolated, never looked up: the bank already carries a
// phrase (\u00ab\u0446\u0435\u043b\u043e\u0435 \u0441\u043e\u0431\u044b\u0442\u0438\u0435\u00bb) beside the three single nouns, and more may follow.
function focusOf(item) {
  const focus = item && typeof item.focus === "string" ? item.focus.trim() : "";

//
// Below that: the two ordinary cards are not asking the same thing either. The
// typed card prints the broken sentence, so there is a mistake on the screen to
// repair. The choice card prints a blank and three options, and \u00ab\u0418\u0441\u043f\u0440\u0430\u0432\u044c\u0442\u0435
// \u043e\u0448\u0438\u0431\u043a\u0443.\u00bb over it names an error that is nowhere to be seen.
// The line and the one word in it that carries the instruction, kept together
// in one place so they cannot drift apart. `key` is a run of `text`; where it
// is not \u2014 a `focus` the bank rewords, a phrasing edited on one line and not
// the other \u2014 `taskLineHtml` marks nothing rather than marking the wrong words,
// and the test over every goal and both modes is what notices.
function taskParts(rule, item, mode) {
  const emphasis = Boolean(rule && rule.emphasis);
  const forced = Boolean(item && item.forced);
  if (emphasis && !forced) {
    const copy = GOAL_COPY[goalOf(rule, item)];
    const focus = focusOf(item);
    if (focus) {
      // The constituent is the whole instruction here, so it is the marked run.
      return mode === "choice"
        ? { text: `\u0412\u044b\u0431\u0435\u0440\u0438\u0442\u0435 \u0432\u0430\u0440\u0438\u0430\u043d\u0442, \u043a\u043e\u0442\u043e\u0440\u044b\u0439 \u0432\u044b\u0434\u0435\u043b\u044f\u0435\u0442 ${focus}.`, key: focus }
        : { text: `\u041e\u0431\u0430 \u0432\u0430\u0440\u0438\u0430\u043d\u0442\u0430 \u0432\u0435\u0440\u043d\u044b. \u0412\u044b\u0434\u0435\u043b\u0438\u0442\u0435 ${focus}.`, key: focus };

      ? { text: copy.choice, key: copy.choiceKey }
      : { text: copy.typed, key: copy.typedKey };

  return mode === "choice"
    ? { text: "\u0417\u0430\u043f\u043e\u043b\u043d\u0438\u0442\u0435 \u043f\u0440\u043e\u043f\u0443\u0441\u043a.", key: "\u043f\u0440\u043e\u043f\u0443\u0441\u043a" }
    : { text: "\u0418\u0441\u043f\u0440\u0430\u0432\u044c\u0442\u0435 \u043e\u0448\u0438\u0431\u043a\u0443.", key: "\u043e\u0448\u0438\u0431\u043a\u0443" };
}

function taskLine(rule, item, mode) {
  return taskParts(rule, item, mode).text;
}

// The same line as markup. She reads past this line and goes straight to the
// options \u2014 \u00ab\u043c\u043e\u0439 \u0433\u043b\u0430\u0437 \u0437\u0430 \u043d\u0435\u0433\u043e \u043d\u0435 \u0446\u0435\u043f\u043b\u044f\u0435\u0442\u0441\u044f\u00bb \u2014 and on an emphasis card that means
// answering a question she has not read. One word in each line says what to do;
// marking it is what gives the eye somewhere to land, and it is markup rather
// than a stylesheet guess because the word is different in every line and is
// interpolated from the bank in one of them.
function taskLineHtml(rule, item, mode) {
  const { text, key } = taskParts(rule, item, mode);
  const at = key ? String(text).indexOf(key) : -1;
  if (at < 0) return escapeHtml(text);
  return (
    escapeHtml(text.slice(0, at)) +
    `<b class="task-key">${escapeHtml(key)}</b>` +
    escapeHtml(text.slice(at + key.length))
