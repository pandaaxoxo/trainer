<style>
/* \002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500
   \000421\000442\000438\00043b\000438 \000441\000442\000440\000430\00043d\000438\000446\00044b.

   TYPE. The material under study is English prose; everything wrapped around it
   is a Russian interface. The stylesheet says so out loud: every English string
   \002014 the card sentence, the options, the typed answer, the diff, the logged
   examples \002014 is set in a serif text face, and every Russian control, label and
   heading is set in the UI sans.

   COLOUR (owner's ruling, "Addendum, 2026-08-13: the look, and the colours that
   are not allowed"). No green and no red anywhere. Two hues carry meaning:
   TEAL for a correct answer and the inserted half of a diff, LILAC for a miss
   and the removed half. INDIGO is the accent for buttons and controls only, and
   sits well clear of the lilac \002014 42\0000b0 of hue and 16pp of lightness apart in the
   light theme, 43\0000b0 and 12pp in the dark \002014 so a lilac feedback panel never reads
   as something to press. Every foreground/background pair in use clears WCAG AA
   for small text (4.5) in both themes; the tightest are 4.57.

   GLASS. Frosted translucent chrome over a soft CSS gradient \002014 tab bar, topic
   filter and picker, buttons, stat tiles. Deliberately NOT glass: the exercise
   card, the feedback panel, the 110-row progress list and the rules list. She
   reads English on those and answers precisely, and text over a see-through
   surface costs legibility for decoration. Glass is applied as progressive
   enhancement: the default is a near-opaque surface, and `@supports` upgrades
   it only where `backdrop-filter` actually exists.

   THEMES. Tokens only, and DARK IS THE DEFAULT (owner's ruling, 2026-08-14).
   Untouched means dark whatever the OS asks for; the toggle gives light and
   dark explicitly; there is no follow-the-system state left. So the dark set is
   the bare :root, repeated under :root[data-theme="dark"], and the light set
   lives only under :root[data-theme="light"]. `prefers-color-scheme` is not
   consulted anywhere in this stylesheet \002014 the script stamps an explicit
   data-theme on the root before the first paint, and an untouched page is
   already correct in the instant before it runs. Components are styled through
   the tokens and never inside a theme block. build.py asserts the three blocks
   define the identical set of token names.
   \002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500\002500 */

:root {
  /* Dark is what an untouched page is, so `dark` and not `light dark`: the
     scrollbars, the form controls and the browser's own default canvas have to
     agree with the tokens below before the first paint, whatever the OS asks
     for. The two overrides below each set their own. */
  color-scheme: dark;

  /* Avenir Next for the Russian interface, New York for the English material
     (ui-serif resolves to New York on Apple platforms) \002014 the owner's choice
     after comparing seven pairings on her own iPhone.

     "Avenir" is deliberately NOT in this chain. Parsing /System/Library/Fonts:
     eleven of the twelve faces in Avenir.ttc carry zero Cyrillic. Since font
     fallback is per-character, a device with Avenir but not Avenir Next would
     set the Latin half of "\00041c\00043e\000434\000430\00043b\00044c\00043d\00044b\000435: will, would, should" in Avenir and the
     Cyrillic half in the next family down \002014 two faces inside one line, which is
     the ugly failure here. Dropping it means such a device falls to a single
     system face for both scripts instead.

     Avenir Next itself is clean: its 400/500/600/700 upright faces each cover
     all 66 Russian letters plus \0000ab \0000bb \002014 \002026. Its 275 and 900 faces carry no
     Cyrillic at all, which is why no rule below asks for either. */
  --font-ui: "Avenir Next", -apple-system, BlinkMacSystemFont, "Segoe UI",
    "Noto Sans", "Helvetica Neue", Arial, sans-serif;
  --font-text: ui-serif, "Iowan Old Style", Charter, "Palatino Linotype",
    Palatino, "Times New Roman", Georgia, serif;
  --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
    monospace;

  --t-xs: 0.75rem;
  --t-sm: 0.8125rem;
  --t-ui: 0.9375rem;
  --t-base: 1rem;
  --t-text: 1.1875rem;
  --t-lg: 1.375rem;
  --t-xl: 1.625rem;

  --sp-1: 0.25rem;
  --sp-2: 0.5rem;
  --sp-3: 0.75rem;
  --sp-4: 1rem;
  --sp-5: 1.5rem;
  --sp-6: 2rem;

  --radius: 20px;
  --radius-sm: 14px;
  --radius-pill: 999px;
  --tap: 44px;
  /* The tab bar's own geometry, declared here rather than inside .tabbar,
     because the sticky \0000ab\000414\000430\00043b\00044c\000448\000435\0000bb has to stay clear of it and \0000abclear of it\0000bb
     cannot be a number somebody copied. The bar sets its padding and its border
     width FROM these tokens, so the height below is derived from the bar rather
     than describing it from memory: change the padding and the button's
     clearance follows, instead of silently eating the 8px gap that the whole
     section exists to guarantee. Measured in the DOM at 54px. */
  --bar-pad: var(--sp-1);
  --bar-border: 1px;
  --bar-h: calc(var(--tap) + var(--bar-pad) * 2 + var(--bar-border) * 2);
  /* Everything the floor of the screen is already spoken for by: the bar, the
     gap it floats in, and the home indicator under it. */
  --bar-clear: calc(
    var(--bar-h) + var(--sp-2) + env(safe-area-inset-bottom, 0px)
  );
  --measure: 34rem;
  --blur: blur(16px) saturate(150%);

  /* \002500\002500 dark: the default, and what an untouched page is \002500\002500 */
  --bg: #0b0d1a;
  --surface: #191c30;
  --surface-2: #212540;
  --glass: rgba(34, 38, 66, 0.66);
  --glass-solid: rgba(28, 32, 56, 0.94);
  --glass-card: rgba(26, 29, 48, 0.74);
  --glass-card-solid: rgba(25, 28, 48, 0.97);
  --glass-line: rgba(255, 255, 255, 0.09);
  --edge: rgba(255, 255, 255, 0.22);
  --sheen: rgba(255, 255, 255, 0.025);
  --dome: rgba(255, 255, 255, 0.16);
  --wash-lift: rgba(0, 0, 0, 0.32);
  --glass-shadow: 0 2px 6px rgba(0, 0, 0, 0.4), 0 14px 34px rgba(0, 0, 0, 0.38);
  --ink: #eceefa;
  --ink-2: #b2b7d2;
  --ink-3: #a4a9c5;
  --line: #2d3150;
  --line-strong: #6a7096;

  --accent: #7d8cf2;
  --accent-ink: #a3adfa;
  --accent-soft: #232a4e;
  --accent-line: #3f4a91;
  --accent-glass: rgba(125, 140, 242, 0.86);
  --on-accent: #0b0d1a;

  --teal: #5ccfe2;
  --teal-soft: #0f303a;
  --teal-line: #2b6d80;

  --lilac: #dcb5f7;
  --lilac-line: #5c4088;
  --teal-edge: rgba(92, 207, 226, 0.75);
  --teal-bloom: rgba(92, 207, 226, 0.2);
  --lilac-edge: rgba(220, 181, 247, 0.75);
  --lilac-bloom: rgba(220, 181, 247, 0.2);

  --grad-violet: rgba(150, 96, 255, 0.38);
  --grad-teal: rgba(40, 210, 235, 0.3);
  --grad-indigo: rgba(94, 116, 255, 0.32);
  --grad-bloom: rgba(184, 202, 255, 0.14);

  --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px rgba(0, 0, 0, 0.32);
}

/* Both themes are explicit, and both are stamped on the root by the script
   before the first paint. The dark block repeats the defaults above so that a
   root she has stamped `dark` beats a stale `light` in the cascade whichever
   order the two rules end up in. */
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0b0d1a;
  --surface: #191c30;
  --surface-2: #212540;
  --glass: rgba(34, 38, 66, 0.66);
  --glass-solid: rgba(28, 32, 56, 0.94);
  --glass-card: rgba(26, 29, 48, 0.74);
  --glass-card-solid: rgba(25, 28, 48, 0.97);
  --glass-line: rgba(255, 255, 255, 0.09);
  --edge: rgba(255, 255, 255, 0.22);
  --sheen: rgba(255, 255, 255, 0.025);
  --dome: rgba(255, 255, 255, 0.16);
  --wash-lift: rgba(0, 0, 0, 0.32);
  --glass-shadow: 0 2px 6px rgba(0, 0, 0, 0.4), 0 14px 34px rgba(0, 0, 0, 0.38);
  --ink: #eceefa;
  --ink-2: #b2b7d2;
  --ink-3: #a4a9c5;
  --line: #2d3150;
  --line-strong: #6a7096;

  --accent: #7d8cf2;
  --accent-ink: #a3adfa;
  --accent-soft: #232a4e;
  --accent-line: #3f4a91;
  --accent-glass: rgba(125, 140, 242, 0.86);
  --on-accent: #0b0d1a;

  --teal: #5ccfe2;
  --teal-soft: #0f303a;
  --teal-line: #2b6d80;

  --lilac: #dcb5f7;
  --lilac-line: #5c4088;
  --teal-edge: rgba(92, 207, 226, 0.75);
  --teal-bloom: rgba(92, 207, 226, 0.2);
  --lilac-edge: rgba(220, 181, 247, 0.75);
  --lilac-bloom: rgba(220, 181, 247, 0.2);

  --grad-violet: rgba(150, 96, 255, 0.38);
  --grad-teal: rgba(40, 210, 235, 0.3);
  --grad-indigo: rgba(94, 116, 255, 0.32);
  --grad-bloom: rgba(184, 202, 255, 0.14);

  --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px rgba(0, 0, 0, 0.32);

:root[data-theme="light"] {
  color-scheme: light;
  --bg: #f1f0fb;
  --surface: #ffffff;
  --surface-2: #f2f3fb;
  --glass: rgba(255, 255, 255, 0.62);
  --glass-solid: rgba(255, 255, 255, 0.92);
  --glass-card: rgba(255, 255, 255, 0.78);
  --glass-card-solid: rgba(255, 255, 255, 0.97);
  --glass-line: rgba(255, 255, 255, 0.72);
  --edge: rgba(255, 255, 255, 0.95);
  --sheen: rgba(255, 255, 255, 0.34);
  --dome: rgba(255, 255, 255, 0.34);
  --wash-lift: rgba(255, 255, 255, 0.55);
  --glass-shadow: 0 2px 6px rgba(29, 26, 74, 0.05),
    0 14px 34px rgba(29, 26, 74, 0.1);
  --ink: #191a2b;
  --ink-2: #3e4157;
  --ink-3: #565b73;
  --line: #dcdeee;
  --line-strong: #8589a6;

  --accent: #2b3391;
  --accent-ink: #242b7c;
  --accent-soft: #e4e7fa;
  --accent-line: #aeb5e6;
  --accent-glass: rgba(43, 51, 145, 0.86);
  --on-accent: #ffffff;

  --teal: #0e7385;
  --teal-soft: #e9f6f9;
  --teal-line: #a8d8e2;

  --lilac: #9450bf;
  --lilac-line: #d5b3ec;
  --teal-edge: rgba(14, 115, 133, 0.6);
  --teal-bloom: rgba(14, 115, 133, 0.07);
  --lilac-edge: rgba(148, 80, 191, 0.6);
  --lilac-bloom: rgba(148, 80, 191, 0.07);

  --grad-violet: rgba(139, 92, 246, 0.45);
  --grad-teal: rgba(20, 184, 208, 0.4);
  --grad-indigo: rgba(79, 102, 241, 0.36);
  --grad-bloom: rgba(214, 116, 224, 0.3);
